name: seqops

on:
  push:
    paths: ['seqops/**', '.github/workflows/seqops.yml']
  pull_request:
    paths: ['seqops/**', '.github/workflows/seqops.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: seqops

jobs:
  epreuves:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seqops/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run verif
      - name: Épreuves unitaires
        run: npm run test
      - name: Construction
        run: npm run build
      # Le navigateur est téléchargé ici, faute d'en avoir un dans l'image ;
      # sur un poste, PW_CHROME suffit.
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: seqops/playwright-report/
          retention-days: 7
