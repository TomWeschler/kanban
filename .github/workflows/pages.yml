# Déploiement GitHub Pages par Actions.
#
# Pourquoi : le déploiement automatique « Deploy from a branch » s'exécute sur le
# parc de machines interne de Pages. Quand celui-ci est indisponible, les runs
# restent en file ou échouent sur « The job was not acquired by Runner of type
# hosted ». Ce workflow-ci tourne sur ubuntu-latest, un parc différent.
#
# Pour l'activer : Settings → Pages → Build and deployment → Source = GitHub Actions.
name: Deploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On met en file plutôt que d'annuler : plusieurs commits rapprochés annulaient
# les builds précédents, si bien qu'aucun n'aboutissait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
