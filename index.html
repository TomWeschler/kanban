// ── Sheets I/O ──────────────────────────────────────
async function sportPutValues(range,values){
  const sid=cfg.spreadsheetId;
  return fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{
    method:'PUT',headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({values})
  });
}
async function ensureSportSheets(){
  const sid=cfg.spreadsheetId;
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}?fields=sheets.properties.title`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(r=>r.ok?r.json():{}).catch(()=>({}));
  const titles=(meta.sheets||[]).map(s=>s.properties.title);
  const toCreate=[];
  if(!titles.includes('sport_plan'))   toCreate.push({sheet:'sport_plan',rows:[SPORT_PLAN_HEADER]});
  if(!titles.includes('sport_log'))    toCreate.push({sheet:'sport_log', rows:[SPORT_LOG_HEADER]});
  const formatExists=titles.includes('sport_format');
  if(!formatExists) toCreate.push({sheet:'sport_format',rows:SPORT_FORMAT_DOC.map(l=>[l])});
  if(toCreate.length){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{
      method:'POST',headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({requests:toCreate.map(t=>({addSheet:{properties:{title:t.sheet}}}))})
    });
    for(const t of toCreate) await sportPutValues(`${t.sheet}!A1`,t.rows);
  }
  // Resync the spec tab if it pre-existed (propagate the current SPEC version)
  if(formatExists){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent('sport_format!A:Z')}:clear`,{method:'POST',headers:{Authorization:`Bearer ${accessToken}`}});
    await sportPutValues('sport_format!A1',SPORT_FORMAT_DOC.map(l=>[l]));
  }
}
// Dedup rows keeping the LAST occurrence per date (append-only sheets,
// shared with the Claude strategy project which appends plan rows).
function sportDedupLast(rows){
  const map={};
  rows.forEach(r=>{ if(r.date) map[r.date]=r; });
  return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
}
async function loadSportData(){
  if(!accessToken)return;
  await ensureSportSheets();
  const sid=cfg.spreadsheetId;
  const [planR,logR]=await Promise.all([
    fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/sport_plan!A:F`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(r=>r.ok?r.json():{values:[]}).catch(()=>({values:[]})),
    fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/sport_log!A:G`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(r=>r.ok?r.json():{values:[]}).catch(()=>({values:[]})),
  ]);
  const pr=planR.values||[], lr=logR.values||[];
  // Reconcile header labels if a tab pre-existed with an older schema (positions unchanged → safe)
  const hdrMatches=(row,hdr)=>hdr.every((h,i)=>String((row||[])[i]||'').trim()===h);
  if(pr.length && !hdrMatches(pr[0],SPORT_PLAN_HEADER)) await sportPutValues('sport_plan!A1',[SPORT_PLAN_HEADER]);
  if(lr.length && !hdrMatches(lr[0],SPORT_LOG_HEADER))  await sportPutValues('sport_log!A1',[SPORT_LOG_HEADER]);
  const plans=(pr.length<=1?[]:pr.slice(1)).filter(r=>r[0]).map(r=>({
    date:String(r[0]||'').trim(),type:String(r[1]||'').trim()||'Autre',
    duration:parseInt(r[2])||0,title:String(r[3]||'').trim(),content:String(r[4]||''),bonus:String(r[5]||'').trim()
  }));
  const logs=(lr.length<=1?[]:lr.slice(1)).filter(r=>r[0]).map(r=>({
    date:String(r[0]||'').trim(),status:String(r[1]||'').trim(),exercises:String(r[2]||''),
    feeling:parseInt(r[3])||0,weight:parseFloat(String(r[4]||'').replace(',','.'))||0,comment:String(r[5]||'').trim(),
    bonusDone:String(r[6]||'').trim().toUpperCase()==='TRUE'
  }));
  sportPlans=sportDedupLast(plans).filter(p=>p.type!==SPORT_DELETED);
  sportLogs=sportDedupLast(logs);
  sportLoaded=true;
}
async function sportUpsertPlan(p){
  const i=sportPlans.findIndex(x=>x.date===p.date);
  if(i>=0) sportPlans[i]=p; else sportPlans.push(p);
  sportPlans.sort((a,b)=>a.date.localeCompare(b.date));
  await sheetUpsertByKey('sport_plan',p.date,[p.date,p.type,String(p.duration||''),p.title,p.content,p.bonus||'']);
}
async function sportDeletePlan(date){
  if(!sportPlanFor(date)) return;
  if(!confirm(`Supprimer le programme du ${date} ?`)) return;
  sportPlans=sportPlans.filter(p=>p.date!==date);
  showLoad(true);
  await sheetUpsertByKey('sport_plan',date,[date,SPORT_DELETED,'','','','']); // tombstone en place
  showLoad(false);
  toast('Programme supprimé','info');
  renderSportPage();
}
async function sportDeleteFuturePlans(){
  const today=sportYmd(new Date());
  const future=sportPlans.filter(p=>p.date>today);
  if(!future.length) return;
  if(!confirm(`Supprimer les ${future.length} programme(s) à venir (après aujourd'hui) ?`)) return;
  showLoad(true);
  for(const p of future) await sheetUpsertByKey('sport_plan',p.date,[p.date,SPORT_DELETED,'','','','']);
  showLoad(false);
  sportPlans=sportPlans.filter(p=>p.date<=today);
  toast('Programmes à venir supprimés','info');
  renderSportPage();
}
async function sportUpsertLog(l){
  const i=sportLogs.findIndex(x=>x.date===l.date);
  if(i>=0) sportLogs[i]=l; else sportLogs.push(l);
  sportLogs.sort((a,b)=>a.date.localeCompare(b.date));
  await sheetUpsertByKey('sport_log',l.date,[l.date,l.status,l.exercises||'',String(l.feeling||''),String(l.weight||''),l.comment||'',l.bonusDone?'TRUE':'FALSE']);
}

// ── helpers ─────────────────────────────────────────
function sportPlanFor(date){return sportPlans.find(p=>p.date===date)||null;}
function sportLogFor(date){return sportLogs.find(l=>l.date===date)||null;}

function renderSportBonus(){
  const el=document.getElementById('sportBonus');
  if(!el)return;
  const today=sportYmd(new Date());
  const p=sportPlanFor(today);
  const log=sportLogFor(today);
  const bonus=p&&p.bonus?p.bonus:'';
  const done=!!(log&&log.bonusDone);
  if(!bonus){
    el.innerHTML=`<div class="sp-bonus empty"><span class="sp-bonus-ico">✨</span><span class="sp-bonus-txt">Pas d'activité bonus aujourd'hui — demande-la à Claude, ou ajoute-la via « Définir le programme ».</span></div>`;
    return;
  }
  el.innerHTML=`<div class="sp-bonus${done?' done':''}">
    <span class="sp-bonus-ico">✨</span>
    <div class="sp-bonus-body">
      <div class="sp-bonus-lbl">Activité bonus du jour</div>
      <div class="sp-bonus-txt">${sportEsc(bonus)}</div>
    </div>
    <button class="sp-bonus-btn${done?' done':''}" onclick="sportToggleBonus()">${done?'✓ Fait':'Marquer fait'}</button>
  </div>`;
}
async function sportToggleBonus(){
  const today=sportYmd(new Date());
  const ex=sportLogFor(today);
  const log={date:today,
    status:ex?ex.status:'',
    exercises:ex?ex.exercises:'',
    feeling:ex?ex.feeling:0,
    weight:ex?ex.weight:0,
    comment:ex?ex.comment:'',
    bonusDone:!(ex&&ex.bonusDone)};
  showLoad(true);await sportUpsertLog(log);showLoad(false);
  renderSportBonus();renderSportBanner();
}
async function reloadSportData(){
  sportLoaded=false;sportPlans=[];sportLogs=[];
  Object.values(sportCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  sportCharts={};

}

function renderSportBanner(){
  const today=sportYmd(new Date());
  const d=new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;
  const weekStart=new Date(d);weekStart.setDate(d.getDate()-dow);
  const weekDates=Array.from({length:7},(_,i)=>{const x=new Date(weekStart);x.setDate(weekStart.getDate()+i);return sportYmd(x);});
  const weekDone=sportLogs.filter(l=>weekDates.includes(l.date)&&(l.status==='done'||l.status==='partial')).length;
  const month=today.slice(0,7);
  const monthDone=sportLogs.filter(l=>l.date.startsWith(month)&&(l.status==='done'||l.status==='partial')).length;
  const weights=sportLogs.filter(l=>l.weight>0).sort((a,b)=>a.date.localeCompare(b.date));
  const lastW=weights.length?weights[weights.length-1].weight:null;
  let planned=0,honored=0;
  for(let i=0;i<14;i++){const x=new Date();x.setDate(x.getDate()-i);const ds=sportYmd(x);const p=sportPlanFor(ds);if(p&&!/repos/i.test(p.type)){planned++;const l=sportLogFor(ds);if(l&&(l.status==='done'||l.status==='partial'))honored++;}}
  const adh=planned?Math.round(honored/planned*100):0;
  document.getElementById('sportBanner').innerHTML=`
    <div class="fit-banner">
      <div class="fit-kpi"><div class="fit-kpi-lbl">Cette semaine</div><div class="fit-kpi-val" style="color:var(--accent)">${weekDone}<span style="font-size:0.7rem;opacity:0.4">/${sportWeekGoal}</span></div><div class="fit-kpi-sub">séances · <span onclick="sportSetGoal()" style="cursor:pointer;text-decoration:underline dotted">objectif</span></div></div>
      <div class="fit-kpi"><div class="fit-kpi-lbl">Ce mois</div><div class="fit-kpi-val green">${monthDone}</div><div class="fit-kpi-sub">séances réalisées</div></div>
      <div class="fit-kpi"><div class="fit-kpi-lbl">Adhérence 14j</div><div class="fit-kpi-val" style="color:${adh>=70?'var(--green)':adh>=40?'var(--warn)':'var(--danger)'}">${planned?adh+'%':'—'}</div><div class="fit-kpi-sub">${honored}/${planned} prévus honorés</div></div>
      <div class="fit-kpi"><div class="fit-kpi-lbl">Poids</div><div class="fit-kpi-val">${lastW?lastW+'<span style="font-size:0.7rem;opacity:0.4"> kg</span>':'—'}</div><div class="fit-kpi-sub">${lastW?'dernière pesée':'aucune pesée'}</div></div>
    </div>

function sportSetGoal(){
  const v=prompt('Objectif de séances par semaine :',sportWeekGoal);
  if(v){const n=parseInt(v);if(n>0){sportWeekGoal=n;localStorage.setItem(SPORT_GOAL_KEY,n);renderSportBanner();}}
}

// Parse program content into items: headings, paragraphs, exercises (bullets)
function sportParseProgram(content){
  const items=[]; let exIdx=0;
  String(content||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line) return;
    if(/^#{1,3}\s/.test(line)) items.push({type:'head',text:line.replace(/^#{1,3}\s/,'')});
    else if(/^[-•*]\s/.test(line)){
      let txt=line.replace(/^[-•*]\s/,'');
      // Poids suggéré par la stratégie : marqueur @<poids>kg en fin de ligne.
      // On le détache du texte pour pré-remplir le champ kg de l'exercice.
      let sugg='';
      const m=txt.match(/@\s*([\d]+(?:[.,][\d]+)?)\s*kg\b/i);
      if(m){ sugg=m[1].replace(',','.'); txt=txt.replace(m[0],'').replace(/\s{2,}/g,' ').trim(); }
      items.push({type:'ex',idx:exIdx++,text:txt,sugg});
    }
    else items.push({type:'p',text:line});
  });
  return items;
}
// Today's stored per-exercise log (JSON in sport_log.exercises) → array of {ex,status,weight}
function sportExisting(){
  const l=sportLogFor(sportYmd(new Date()));
  if(!l||!l.exercises) return [];
  try{ const a=JSON.parse(l.exercises); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
function sportExBold(s){
  const esc=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
const SP_EX_CYCLE=['','done','partial','skipped'];
const SP_EX_ICON={'':'•',done:'✓',partial:'~',skipped:'✗'};

function renderSportToday(){
  const today=sportYmd(new Date());
  const p=sportPlanFor(today);
  const el=document.getElementById('sportToday');
  if(!p){
    el.innerHTML=`<div class="sp-today"><div class="fit-empty">Pas encore de programme pour aujourd'hui.<br><br>Demande à Claude ce soir :<br><b style="color:var(--text-mid)">« fais-moi mon programme de demain »</b><br><br><button class="fit-btn" onclick="openSportPlanModal('${today}')">Définir manuellement</button></div></div>`;
    return;
  }
  const col=sportTypeColor(p.type);
  const existing=sportExisting();
  const items=sportParseProgram(p.content);
  const body=items.length?items.map(it=>{
    if(it.type==='head') return `<h4>${sportExBold(it.text)}</h4>`;
    if(it.type==='p')    return `<p>${sportExBold(it.text)}</p>`;
    const i=it.idx;
    const status=sportExDraft[i]?.status ?? existing[i]?.status ?? '';
    // Priorité : saisie en cours > log du jour > poids suggéré par la stratégie (@kg).
    const weight=sportExDraft[i]?.weight ?? existing[i]?.weight ?? it.sugg ?? '';
    return `<div class="sp-ex-row">
      <button class="sp-ex-status st-${status||'none'}" onclick="sportCycleEx(${i})" title="Statut : fait → partiel → pas fait">${SP_EX_ICON[status]}</button>
      <div class="sp-ex-txt">${sportExBold(it.text)}</div>
      <input class="sp-ex-w" data-spexw="${i}" type="text" inputmode="decimal" placeholder="kg" value="${sportEsc(weight)}">
    </div>`;
  }).join(''):'<p style="opacity:0.5">Aucun détail fourni.</p>';
  el.innerHTML=`<div class="sp-today">
    <div style="position:absolute;top:0.9rem;right:0.9rem;display:flex;gap:0.35rem">
      <button class="fit-btn" style="font-size:0.46rem;padding:0.25rem 0.5rem" onclick="openSportPlanModal('${today}')" title="Éditer">✎</button>
      <button class="fit-btn" style="font-size:0.46rem;padding:0.25rem 0.5rem" onclick="sportDeletePlan('${today}')" title="Supprimer le programme du jour">🗑</button>
    </div>
    <div class="sp-today-hdr">
      <span class="sp-type-badge" style="color:${col};background:${col}22;border:1px solid ${col}55">${p.type}</span>
      ${p.duration?`<span class="sp-dur">⏱ ${p.duration} min</span>`:''}
    </div>
    <div class="sp-today-title">${p.title||'Séance du jour'}</div>
    ${items.some(it=>it.type==='ex')?`<div class="sp-ex-hint">Coche le statut ✓ ~ ✗ et note le poids sur chaque ligne</div>`:''}
    <div class="sp-content">${body}</div>
  </div>`;
}

function sportCaptureExInputs(){
  document.querySelectorAll('[data-spexw]').forEach(inp=>{
    const i=inp.getAttribute('data-spexw');
    sportExDraft[i]={...(sportExDraft[i]||{}),weight:inp.value};
  });
}
function sportCycleEx(i){
  sportCaptureExInputs();
  const existing=sportExisting();
  const cur=sportExDraft[i]?.status ?? existing[i]?.status ?? '';
  const next=SP_EX_CYCLE[(SP_EX_CYCLE.indexOf(cur)+1)%SP_EX_CYCLE.length];
  sportExDraft[i]={...(sportExDraft[i]||{}),status:next};
  renderSportToday();
}

function sportCaptureInputs(){
  const c=document.getElementById('spComment'); if(c)sportDraft.comment=c.value;
  const w=document.getElementById('spWeight');  if(w)sportDraft.weight=w.value;
}
function sportPickStatus(s){sportCaptureInputs();sportDraft.status=s;renderSportLogger();}
function sportPickFeeling(f){sportCaptureInputs();sportDraft.feeling=f;renderSportLogger();}

function renderSportLogger(){
  const today=sportYmd(new Date());
  const ex=sportLogFor(today);
  const st=sportDraft.status??ex?.status??'';
  const feel=sportDraft.feeling??ex?.feeling??0;
  const comment=(sportDraft.comment??ex?.comment)||'';
  const weight=(sportDraft.weight??(ex&&ex.weight?ex.weight:''))||'';
  const FEELINGS=['😵','😕','😐','🙂','💪'];
  document.getElementById('sportLogger').innerHTML=`<div class="sp-log">
    <div class="fit-box-ttl" style="margin-bottom:0.9rem">Ton retour — aujourd'hui</div>
    ${ex?`<div class="sp-log-done">✓ Enregistré : <b>${sportStatusLabel(ex.status)||'—'}</b>. Tu peux corriger ci-dessous.</div>`:''}
    <div class="sp-field"><label class="fit-form-lbl">Séance globale (sinon déduit des exercices)</label>
      <div class="sp-status-btns">
        <button class="sp-status-btn${st==='done'?' sel-done':''}" onclick="sportPickStatus('done')">✅ Fait</button>
        <button class="sp-status-btn${st==='partial'?' sel-partial':''}" onclick="sportPickStatus('partial')">🟡 Partiel</button>
        <button class="sp-status-btn${st==='skipped'?' sel-skipped':''}" onclick="sportPickStatus('skipped')">❌ Pas fait</button>
      </div></div>
    <div class="sp-field"><label class="fit-form-lbl">Ressenti</label>
      <div class="sp-feeling">${FEELINGS.map((e,i)=>`<button class="sp-feel-btn${feel===i+1?' sel':''}" onclick="sportPickFeeling(${i+1})">${e}</button>`).join('')}</div></div>
    <div class="sp-field"><label class="fit-form-lbl">Poids corporel (kg)</label>
      <input class="fit-input" id="spWeight" type="number" step="0.1" style="width:100%" placeholder="opt." value="${sportEsc(weight)}"></div>
    <div class="sp-field"><label class="fit-form-lbl">Commentaire global de la séance</label>
      <textarea class="fit-input" id="spComment" rows="3" style="width:100%" placeholder="Comment ça s'est passé ? énergie, douleurs, contexte...">${sportEsc(comment)}</textarea></div>
    <button class="fit-btn" style="margin-top:0.4rem;width:100%;color:var(--accent);border-color:var(--accent);padding:0.55rem" onclick="saveSportLog()">${ex?'Mettre à jour':'Enregistrer mon retour'}</button>
  </div>`;
}

async function saveSportLog(){
  sportCaptureInputs();
  sportCaptureExInputs();
  const today=sportYmd(new Date());
  const ex=sportLogFor(today);
  const p=sportPlanFor(today);
  const existing=sportExisting();
  const items=p?sportParseProgram(p.content).filter(it=>it.type==='ex'):[];
  const exercises=items.map(it=>{
    const i=it.idx;
    return {ex:it.text.replace(/\*\*/g,''),
      status:(sportExDraft[i]?.status ?? existing[i]?.status ?? ''),
      weight:(sportExDraft[i]?.weight ?? existing[i]?.weight ?? '')};
  });
  // Overall status: explicit session choice wins, else derive from per-exercise
  const marked=exercises.map(e=>e.status).filter(Boolean);
  let status=sportDraft.status??ex?.status??'';
  if(!status && marked.length){
    status=marked.every(s=>s==='done')?'done':marked.every(s=>s==='skipped')?'skipped':'partial';
  }
  if(!status){alert("Indique le statut de la séance (ou d'au moins un exercice).");return;}
  const log={date:today,status,
    exercises:exercises.length?JSON.stringify(exercises):'',
    feeling:(sportDraft.feeling??ex?.feeling)||0,
    weight:parseFloat(sportDraft.weight??(ex?ex.weight:''))||0,
    comment:(sportDraft.comment??ex?.comment)||'',
    bonusDone:!!(ex&&ex.bonusDone)};
  showLoad(true);await sportUpsertLog(log);showLoad(false);
  sportDraft={status:null,feeling:null,weight:null,comment:null};
  sportExDraft={};
  toast('Retour enregistré ✓','ok');
  renderSportPage();
}

      <button class="fit-btn" onclick="openSportPlanModal('${tom}')">+ Définir</button></div>`;

function renderSportHistory(){
  const el=document.getElementById('sportHistory');
  const rows=[];
  for(let i=0;i<14;i++){const x=new Date();x.setDate(x.getDate()-i);const ds=sportYmd(x);const p=sportPlanFor(ds);const l=sportLogFor(ds);if(!p&&!l)continue;rows.push({ds,p,l});}
  if(!rows.length){el.innerHTML=`<div class="fit-section-lbl">Historique</div><div class="fit-box"><div class="fit-empty">Aucun historique pour l'instant.</div></div>`;return;}
  const FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const body=rows.map(({ds,p,l})=>{
    const dt=new Date(ds+'T12:00:00');const dlabel=`${FR[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}`;
    const status=l?l.status:'none';
    const feel=l&&l.feeling?['','😵','😕','😐','🙂','💪'][l.feeling]:'';
    // Per-exercise summary from the JSON
    let detail='';
    if(l&&l.exercises){
      try{
        const arr=JSON.parse(l.exercises);
        if(Array.isArray(arr)&&arr.length){
          const done=arr.filter(e=>e.status==='done').length;
          const weights=arr.filter(e=>e.weight).map(e=>e.weight).join(' · ');
          detail=`<b style="color:var(--text)">${done}/${arr.length}</b> exos${weights?` · ${weights} kg`:''}`;
        }
      }catch(e){}
    }
    if(!detail&&l&&l.comment) detail=`<span style="font-style:italic">${sportEsc(l.comment).slice(0,40)}</span>`;
    return `<tr>
      <td style="white-space:nowrap;color:var(--text-mid)">${dlabel}</td>
      <td>${p?(p.title||p.type):'<span style="opacity:0.4">—</span>'}</td>
      <td><span class="sp-hist-status ${status}">${l?sportStatusLabel(status):'non loggé'}</span></td>
      <td style="color:var(--text-mid);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${detail}</td>
      <td>${feel}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="fit-section-lbl">Historique — 14 derniers jours</div>
    <div class="fit-box"><table class="fit-stats-table">
      <thead><tr><th>Jour</th><th>Programme</th><th>Statut</th><th>Détail</th><th>Ressenti</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

function renderSportWeight(){
  const el=document.getElementById('sportWeight');
  const w=sportLogs.filter(l=>l.weight>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(w.length<2){el.innerHTML='';if(sportCharts.w){try{sportCharts.w.destroy();}catch(e){}sportCharts.w=null;}return;}
  el.innerHTML=`<div class="fit-section-lbl">Évolution du poids</div><div class="fit-box"><div class="sp-wrap"><canvas id="spWeightChart"></canvas></div></div>`;
  if(sportCharts.w){try{sportCharts.w.destroy();}catch(e){}}
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#7c6aff';
  sportCharts.w=new Chart(document.getElementById('spWeightChart'),{
    type:'line',
    data:{labels:w.map(x=>x.date.slice(5)),datasets:[{data:w.map(x=>x.weight),borderColor:acc,backgroundColor:acc+'22',borderWidth:2,fill:true,tension:0.3,pointRadius:3,pointHoverRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` ${i.raw} kg`}}},
      scales:{x:{ticks:{font:{family:'monospace',size:8},maxTicksLimit:10},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{font:{family:'monospace',size:9},callback:v=>v+' kg'},grid:{color:'rgba(255,255,255,0.05)'}}}}
  });
}

// ── Plan modal ──────────────────────────────────────
function openSportPlanModal(date){
  const p=sportPlanFor(date);
  document.getElementById('spfDateInput').value=date||sportYmd(new Date());
  document.getElementById('spfType').value=p?p.type:'Muscu';
  document.getElementById('spfDuration').value=p&&p.duration?p.duration:'';
  document.getElementById('spfTitle').value=p?p.title:'';
  document.getElementById('spfContent').value=p?p.content:'';
  document.getElementById('spfBonus').value=p&&p.bonus?p.bonus:'';
  document.getElementById('sportPlanModalTitle').textContent=p?'ÉDITER LE PROGRAMME':'NOUVEAU PROGRAMME';
  document.getElementById('sportPlanModal').classList.add('open');
  setTimeout(()=>document.getElementById('spfTitle').focus(),70);
}
function closeSportPlanModal(){document.getElementById('sportPlanModal').classList.remove('open');}
async function saveSportPlan(){
  const date=document.getElementById('spfDateInput').value;
  if(!date){alert('Choisis une date.');return;}
  const plan={date,
    type:document.getElementById('spfType').value,
    duration:parseInt(document.getElementById('spfDuration').value)||0,
    title:document.getElementById('spfTitle').value.trim(),
    content:document.getElementById('spfContent').value,
    bonus:document.getElementById('spfBonus').value.trim()};
  showLoad(true);await sportUpsertPlan(plan);showLoad(false);
  closeSportPlanModal();
  toast('Programme enregistré ✓','ok');
  renderSportPage();
}
