      <div class="crp-sep"></div>
      <div class="crp-stat"><span class="crp-stat-l">PRIX USD</span>
        <span class="crp-stat-v">$${price.price < 1 ? price.price.toFixed(4) : price.price.toLocaleString('en-US',{maximumFractionDigits:2})}</span></div>
      <div class="crp-stat"><span class="crp-stat-l">24H</span>
        <span class="crp-stat-v" style="color:${price.change24h>=0?'var(--green)':'var(--danger)'}">${crpSign(price.change24h??0)}${(price.change24h??0).toFixed(2)}%</span></div>
      ${holdRow}
    ` : '';

    const statsBlock = hasData ? `
      <div class="crp-stat"><span class="crp-stat-l">P&L NET</span>
        <span class="crp-stat-v" style="color:${crpCol(g.totalNet)}">${crpFmt(g.totalNet)}</span></div>
      <div class="crp-stat"><span class="crp-stat-l">TRADES</span>
        <span class="crp-stat-v">${g.count} <span style="color:var(--text-dim);font-size:0.62rem">(${g.wins}W/${g.losses}L)</span></span></div>
      <div class="crp-stat"><span class="crp-stat-l">WIN RATE</span>
        <span class="crp-stat-v" style="color:${g.winRate>=50?'var(--green)':'var(--warn)'}">${g.winRate}%</span></div>
      ${g.avgGainPct!=null?`<div class="crp-stat"><span class="crp-stat-l">MOY. GAINS %</span>
        <span class="crp-stat-v" style="color:var(--green)">${crpSign(g.avgGainPct)}${g.avgGainPct.toFixed(2)}%</span></div>`:''}
      ${g.avgLossPct!=null?`<div class="crp-stat"><span class="crp-stat-l">MOY. PERTES %</span>
        <span class="crp-stat-v" style="color:var(--danger)">${g.avgLossPct.toFixed(2)}%</span></div>`:''}
      ${g.pricePct!=null?`<div class="crp-stat"><span class="crp-stat-l">P&L PRIX (B)</span>
        <span class="crp-stat-v" style="color:${crpCol(g.pricePct)}">${crpSign(g.pricePct)}${g.pricePct.toFixed(2)}%</span></div>`:''}
    ` : `<div class="crp-empty" style="padding:1.2rem 0;font-size:0.62rem">AUCUN TRADE</div>`;

    return `<div class="crp-card ${c.sym.toLowerCase()}${!hasData?' nodata':''}">
      <div class="crp-sym" style="color:${c.hex}">${c.sym}</div>
      ${statsBlock}${priceBlock}
    </div>`;
  }).join('');
}

// ────────────────────────────────────────────────────
// Shared helper: annotate every posFinale-bearing trade
// with its P&L delta (posFinale − prev posFinale for that crypto,
// prev = 0 for the very first trade of each crypto).
// Falls back to t.net when posFinale column absent from sheet.
// ────────────────────────────────────────────────────
function computeTradePnLs() {
  const withPF = cryptoTrades.filter(t => t.posFinale !== null && t.date)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if (!withPF.length) {
    // Fallback: annotate all dated trades with t.net as delta
    return [...cryptoTrades].filter(t => t.date)
      .sort((a,b) => a.date < b.date ? -1 : 1)
      .map(t => ({ ...t, pnlDelta: t.net, usingFallback: true }));
  }
  const prevPF = {};
  return withPF.map(t => {
    let prev;
    if (prevPF[t.symbol] === undefined) {
      // First trade of this crypto: use initial investment (B × D) as reference
      // so the delta reflects the real gain/loss vs the purchase price, not vs 0
      prev = (t.price || 0) * (t.colD || 0);
    } else {
      prev = prevPF[t.symbol];
    }
    const pnlDelta = t.posFinale - prev;
    prevPF[t.symbol] = t.posFinale;
    return { ...t, pnlDelta };
  });
}

// Bot ROI% for chart B2: calcNetPnL / first posFinale for that crypto
function calcBotRoiPct(sym) {
  const trades = cryptoTrades.filter(t => t.symbol === sym && t.posFinale !== null && t.date)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if (!trades.length) { const g = getCryptoStats(sym); return g.pct; }
  const firstPF = trades[0].posFinale;
  if (!firstPF) return null;
  return calcNetPnL(sym) / Math.abs(firstPF) * 100;
}

let finDebugInfo = { sheetTitles: [], comptesSheet: null, financeSheet: null, error: null };

async function loadFinancesData() {
  if (!accessToken) return;
  try {
    // Step 1: fetch spreadsheet metadata to get real sheet names
    const metaR = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}?fields=sheets.properties.title`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!metaR.ok) {
      finDebugInfo.error = `Spreadsheet inaccessible (HTTP ${metaR.status}) — vérifie l'ID et les permissions`;
      finLoaded = true; return;
    }
    const meta = await metaR.json();
    const titles = (meta.sheets || []).map(s => s.properties.title);
    finDebugInfo.sheetTitles = titles;

    // Step 2: fuzzy-match sheet names
    const findSheet = (...names) =>
      titles.find(t => names.some(n => t.toLowerCase().trim() === n.toLowerCase().trim())) ||
      titles.find(t => names.some(n => t.toLowerCase().includes(n.toLowerCase()))) ||
      null;
    const comptesSheet  = findSheet('Comptes','Compte','Accounts','comptes');
    const financeSheet  = findSheet('Finances','Finance','Dépenses','Depenses','depenses','Expenses','Budget');
    finDebugInfo.comptesSheet = comptesSheet;
    finDebugInfo.financeSheet = financeSheet;

    if (!comptesSheet && !financeSheet) {
      finDebugInfo.error = `Aucun onglet "Comptes" ou "Finance" trouvé`;
      finLoaded = true; return;
    }

    // Step 3: fetch data from matched sheets
    const fetches = [];
    if (comptesSheet) fetches.push(
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}/values/${encodeURIComponent(comptesSheet)}!A:Z`,
        { headers: { Authorization: `Bearer ${accessToken}` } })
    );
    if (financeSheet) fetches.push(
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}/values/${encodeURIComponent(financeSheet)}!A:Z`,
        { headers: { Authorization: `Bearer ${accessToken}` } })
    );
    const results = await Promise.all(fetches);
    let ri = 0;
    if (comptesSheet) { const r = results[ri++]; if (r.ok) { const d = await r.json(); finComptes  = d.values || []; } }
    if (financeSheet) { const r = results[ri++]; if (r.ok) { const d = await r.json(); finDepenses = d.values || []; } }
    finLoaded = true;
  } catch(e) {
    finDebugInfo.error = String(e);
    console.error('Finances load error', e);
    toast('Erreur chargement données Finances', 'err');
    finLoaded = true;
  }
}

// FINANCES — PARSING
// ════════════════════════════════════════════════════
function finParseNum(raw) {
  return parseFloat(String(raw||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;
}

function finParseDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY (common in French sheets)
  const m1 = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if (m1) return `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
  // YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // Excel/Sheets serial number with optional decimal time part (e.g. "45993" or "45993.5")
  if (/^\d{4,6}(\.\d+)?$/.test(s)) {
    const d = new Date((parseFloat(s) - 25569) * 86400000);
    if (!isNaN(d)) return d.toISOString().split('T')[0];
  }
  // Generic fallback
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().split('T')[0];
}

function parseComptes() {
  if (!finComptes.length) return [];
  // Always skip row 0 (confirmed header: "Compte / Valeur init. / Valeur 2026")
  // col A (0)=nom, col B (1)=valeur initiale début 2026, col C (2)=valeur actuelle
  return finComptes.slice(1)
    .filter(r => r.some(c => c !== ''))
    .map(r => ({
      name:    String(r[0] || '').trim(),
      initial: finParseNum(r[1]),   // col B — référence début 2026
      current: finParseNum(r[2]),   // col C — valeur actuelle
      type:    String(r[3] || '').trim(),
    }))
    .filter(c => c.name && !/^total$/i.test(c.name));
}

function parseDepenses() {
  if (!finDepenses.length) return [];
  // Confirmed column layout (user):
  //   A (0) = Date | B (1) = Description | C (2) = Montant (€)
  //   D (3) = Type/Catégorie | E (4) = Compte | F (5) = Mois
  // Always skip row 0 (header row)
  return finDepenses.slice(1)
    .filter(r => r.some(c => c !== ''))
    .map(r => ({
      date:   finParseDate(r[0]) || '',
      desc:   String(r[1] || '').trim(),
      amount: finParseNum(r[2]),
      cat:    String(r[3] || '').trim() || 'Autre',
      compte: String(r[4] || '').trim(),
      mois:   String(r[5] || '').trim(),
    }))
    .filter(d => d.date);
}

// ════════════════════════════════════════════════════
async function renderFinancesPage() {
  if (!finLoaded) {
    showLoad(true);
    // Load Finances sheet + crypto data (needed for portfolio value) in parallel
    await Promise.all([
      loadFinancesData(),
      cryptoLoaded ? Promise.resolve() : loadCryptoData(),
      // Fetch live USD→EUR rate
      fetch('https://open.er-api.com/v6/latest/USD')
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d?.rates?.EUR) usdToEur = d.rates.EUR; })
        .catch(() => {}), // keep fallback 0.92 on error
    ]);
    showLoad(false);
  }
  const comptes  = parseComptes();
  const depenses = parseDepenses();

  // Override the crypto account's current value with CryptoBot portfolio (USD → EUR)
  const cryptoPortfolioEur = calcPortfolioValue() * usdToEur;
  if (cryptoPortfolioEur > 0) {
    const cryptoCompte = comptes.find(c =>
      /crypto/i.test(c.name) || /bot/i.test(c.name)
    );
    if (cryptoCompte) cryptoCompte.current = parseFloat(cryptoPortfolioEur.toFixed(2));
  }

  renderFinBanner(comptes, depenses);
  renderFinAccounts(comptes);
  renderFinCharts(comptes, depenses);
  renderFinMilestone(comptes, depenses);
  renderFinTable(depenses);
}

// ════════════════════════════════════════════════════
// FINANCES — BANNER KPIs
// ════════════════════════════════════════════════════
function renderFinBanner(comptes, depenses) {
  const totalCurrent = comptes.reduce((s, c) => s + c.current, 0);
  const totalInitial = comptes.reduce((s, c) => s + c.initial, 0);
  const deltaEur = totalCurrent - totalInitial;
  const deltaPct = totalInitial > 0 ? deltaEur / totalInitial * 100 : 0;

  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  // If current month has no data, fall back to the most recent month present
  // Dépenses = negative amounts only
  let monthDeps = depenses.filter(d => d.date.startsWith(thisMonth) && d.amount < 0);
  let shownMonth = thisMonth;
  if (!monthDeps.length && depenses.length) {
    const months = [...new Set(depenses.filter(d => d.amount < 0).map(d => d.date.slice(0,7)))].filter(Boolean).sort();
    shownMonth = months[months.length - 1] || thisMonth;
    monthDeps  = depenses.filter(d => d.date.startsWith(shownMonth) && d.amount < 0);
  }
  const totalMonthDep = monthDeps.reduce((s, d) => s + Math.abs(d.amount), 0);
  const MONTHS_FR2 = ['janv.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];
  const shownMonthLabel = (() => { const [y,m] = shownMonth.split('-'); return `${MONTHS_FR2[parseInt(m)-1]} ${y}`; })();

  const monthsElapsed = Math.max(1, (now - FIN_START_DATE) / (1000*60*60*24*30.44));
  const mthSavings = deltaEur / monthsElapsed;

  const fmtEur = (v, sign=true) => {
    const s = sign && v >= 0 ? '+' : '';
    return `${s}${v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})} €`;
  };
  const pct1M  = Math.min(100, totalCurrent / FIN_GOAL * 100);
  const remain = FIN_GOAL - totalCurrent;

  document.getElementById('finBanner').innerHTML = `
    <div class="fin-banner">
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Patrimoine Total</div>
        <div class="fin-kpi-val" style="color:var(--accent)">${fmtEur(totalCurrent,false)}</div>
        <div class="fin-kpi-sub">Ref. janv. 2026 : ${fmtEur(totalInitial,false)}</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Plus-value depuis janv. 2026</div>
        <div class="fin-kpi-val" style="color:${deltaEur>=0?'var(--green)':'var(--danger)'}">${fmtEur(deltaEur)}</div>
        <div class="fin-kpi-sub">${deltaEur>=0?'+':''}${deltaPct.toFixed(1)}% · moy. ${fmtEur(mthSavings)}/mois</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Dépenses · ${shownMonthLabel}</div>
        <div class="fin-kpi-val" style="color:var(--warn)">${fmtEur(totalMonthDep,false)}</div>
        <div class="fin-kpi-sub">${monthDeps.length} opération${monthDeps.length>1?'s':''}${shownMonth!==thisMonth?' · (dernier mois avec données)':''}</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Objectif 1 000 000 €</div>
        <div class="fin-kpi-val" style="color:var(--accent)">${pct1M.toFixed(2)}%</div>
        <div class="fin-kpi-sub">${fmtEur(remain,false)} restants${mthSavings>0?' · ~'+Math.round(remain/mthSavings)+' mois':''}</div>
      </div>
    </div>`;
}

// FINANCES — ACCOUNTS
// ════════════════════════════════════════════════════
const FIN_PALETTE = ['#7c6aff','#4ade80','#fbbf24','#22d3ee','#a855f7','#f87171','#38bdf8','#fb923c','#e879f9','#a3e635'];

function renderFinAccounts(comptes) {
  const PALETTE = FIN_PALETTE;
  if (!comptes.length) {
    document.getElementById('finAccounts').innerHTML = `<div class="fin-section-lbl">COMPTES</div><div class="fin-empty">Aucun compte détecté dans l'onglet "Comptes"</div>`;
    return;
  }
  const fmtEur = v => v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
  const cards = comptes.map((c,i) => {
    const col   = PALETTE[i % PALETTE.length];
    const delta = c.current - c.initial;
    const dCol  = delta >= 0 ? 'var(--green)' : 'var(--danger)';
    const sign  = delta >= 0 ? '+' : '';
    const pct   = c.initial > 0 ? (delta/c.initial*100).toFixed(1) : null;
    return `
      <div class="fin-account">
        <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${col}"></div>
        <div class="fin-account-name">${c.name}</div>
        <div class="fin-account-val" style="color:${col}">${fmtEur(c.current)}</div>
        <div class="fin-account-delta" style="color:${dCol}">${sign}${fmtEur(delta)}${pct!=null?' ('+sign+pct+'%)':''}</div>
        ${c.initial ? `<div class="fin-account-meta">Réf. : ${fmtEur(c.initial)}</div>` : ''}
        ${c.type    ? `<div class="fin-account-meta" style="margin-top:0.15rem">${c.type}</div>` : ''}
      </div>`;
  }).join('');
  document.getElementById('finAccounts').innerHTML = `
    <div class="fin-section-lbl">COMPTES & ÉPARGNE</div>
    <div class="fin-accounts-wrap">
      <div class="fin-accounts">${cards}</div>
      <div class="fin-accounts-gif"><img src="gifs/zen3.gif" alt="" loading="lazy"></div>
    </div>`;
}

// ════════════════════════════════════════════════════
// FINANCES — CHARTS
// ════════════════════════════════════════════════════
function renderFinCharts(comptes, depenses) {
  Object.values(finCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  finCharts = {};

  const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

  // Map each compte name → palette color (same as account cards)
  const compteColorMap = {};
  comptes.forEach((c, i) => { compteColorMap[c.name] = FIN_PALETTE[i % FIN_PALETTE.length]; });
  // Fuzzy match: find color for a compte string from depenses
  const compteColor = name => {
    if (compteColorMap[name]) return compteColorMap[name];
    const found = Object.keys(compteColorMap).find(k =>
      k.toLowerCase().includes(name.toLowerCase()) || name.toLowerCase().includes(k.toLowerCase())
    );
    return found ? compteColorMap[found] : '#94a3b8';
  };

  // All individual dates sorted ascending (col A — no aggregation)
  const allDates   = [...new Set(depenses.map(d => d.date).filter(Boolean))].sort();
  // All unique comptes (each = one stacked area)
  const allComptes = [...new Set(depenses.map(d => d.compte).filter(Boolean))];
  // Category totals split by sign: negative = dépense, positive = gain
  const byCatDep = {}, byCatGain = {};
  depenses.forEach(d => {
    const cat = d.cat || 'Autre';
    if (d.amount < 0) byCatDep[cat]  = (byCatDep[cat]  || 0) + Math.abs(d.amount);
    if (d.amount > 0) byCatGain[cat] = (byCatGain[cat] || 0) + d.amount;
  });
  const catsDep  = Object.keys(byCatDep).sort((a,b)  => byCatDep[b]  - byCatDep[a]);
  const catsGain = Object.keys(byCatGain).sort((a,b) => byCatGain[b] - byCatGain[a]);

  // Short label for X axis: "14 jan", "2 fév" etc.
  const shortDateLabel = iso => {
    const [,mo,day] = iso.split('-');
    return `${parseInt(day)} ${MONTHS_FR[parseInt(mo)-1]}`;
  };

  // Build account breakdown HTML — sorted descending by current value
  const totalCurrent  = comptes.reduce((s,c) => s + (c.current||0), 0);
  const sortedComptes = [...comptes].filter(c => c.current > 0)
                          .sort((a,b) => b.current - a.current);
  // Assign stable colors based on sorted order
  const breakdownBar = sortedComptes.map((c, i) => {
    const pct = totalCurrent > 0 ? c.current / totalCurrent * 100 : 0;
    const col  = FIN_PALETTE[i % FIN_PALETTE.length];
    return `<div title="${c.name}: ${c.current.toLocaleString('fr-FR',{maximumFractionDigits:0})} € (${pct.toFixed(1)}%)"
                 style="width:${pct}%;background:${col};transition:width 0.4s"></div>`;
  }).join('');
  const breakdownLegend = sortedComptes.map((c, i) => {
    const pct = totalCurrent > 0 ? c.current / totalCurrent * 100 : 0;
    const col  = FIN_PALETTE[i % FIN_PALETTE.length];
    return `<div style="display:flex;align-items:center;gap:0.35rem;min-width:0">
      <div style="width:8px;height:8px;flex-shrink:0;background:${col};border-radius:2px"></div>
      <span style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
            title="${c.name}">${c.name}</span>
      <span style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text);margin-left:auto;flex-shrink:0">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');

  document.getElementById('finCharts').innerHTML = `
    <div class="fin-section-lbl">ANALYSE DES DÉPENSES</div>
    <div class="fin-charts">
      <div class="fin-box" style="display:flex;flex-direction:column">
        <div class="fin-box-hdr">
          <span class="fin-box-ttl">ÉVOLUTION DU PATRIMOINE</span>
          <button class="crp-btn" onclick="reloadFinancesData()">↻ RAFRAÎCHIR</button>
        </div>
        <div class="fin-wrap" style="flex:1;min-height:0"><canvas id="finChartArea"></canvas></div>
      </div>
      <div class="fin-box" style="display:flex;flex-direction:column">
        <div class="fin-box-hdr"><span class="fin-box-ttl">RÉPARTITION DES COMPTES</span></div>
        <div style="height:14px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:1rem">${breakdownBar}</div>
        <div style="display:flex;flex-direction:column;gap:0.55rem;flex:1">${breakdownLegend}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.85rem">
        <div class="fin-box" style="flex:1">
          <div class="fin-box-hdr"><span class="fin-box-ttl" style="color:var(--danger)">▼ DÉPENSES PAR CATÉGORIE</span></div>
          <div class="fin-wrap" style="height:155px"><canvas id="finChartDep"></canvas></div>
        </div>
        <div class="fin-box" style="flex:1">
          <div class="fin-box-hdr"><span class="fin-box-ttl" style="color:var(--green)">▲ GAINS PAR CATÉGORIE</span></div>
          <div class="fin-wrap" style="height:155px"><canvas id="finChartGain"></canvas></div>
        </div>
      </div>
    </div>`;

  Chart.defaults.color = '#60607a';

  // ── Single-line patrimoine evolution (total across all comptes) ──
  const ctxArea = document.getElementById('finChartArea')?.getContext('2d');
  if (ctxArea && allDates.length) {
    const getInitial = compteName => {
      const exact = comptes.find(c => c.name === compteName);
      if (exact) return exact.initial;
      const fuzzy = comptes.find(c =>
        c.name.toLowerCase().includes(compteName.toLowerCase()) ||
        compteName.toLowerCase().includes(c.name.toLowerCase())
      );
      return fuzzy ? fuzzy.initial : 0;
    };

    // Starting point = ALL comptes from the Comptes sheet (not just those in Finance col E).
    // Accounts that have no transactions are still part of the patrimoine.
    const runningMap = {};
    comptes.forEach(c => { runningMap[c.name] = c.initial || 0; });
    // Also seed any compte present in Finance but not in Comptes sheet (initial = 0)
    allComptes.forEach(c => { if (!(c in runningMap)) runningMap[c] = 0; });
    const totalInitialAll = Object.values(runningMap).reduce((s,v) => s+v, 0);

    const chartLabels = ['Début', ...allDates.map(shortDateLabel)];
    const totalData   = [parseFloat(totalInitialAll.toFixed(2))];

    allDates.forEach(date => {
      // Apply transactions for every compte that appears in Finance
      allComptes.forEach(compte => {
        const dayDelta = depenses
          .filter(d => d.date === date && d.compte === compte)
          .reduce((s,d) => s + d.amount, 0);
        runningMap[compte] = (runningMap[compte] || 0) + dayDelta;
      });
      // Total = sum of all comptes (including those with no transactions)
      const total = Object.values(runningMap).reduce((s,v) => s+v, 0);
      totalData.push(parseFloat(total.toFixed(2)));
    });

    finCharts.area = new Chart(ctxArea, {
      type: 'line',
      data: {
        labels: chartLabels,
        datasets: [{
          label: 'Patrimoine total',
          data: totalData,
          borderColor: '#7c6aff',
          backgroundColor: 'rgba(124,106,255,0.12)',
          fill: true,
          tension: 0.3,
          pointRadius: ctx => ctx.dataIndex === 0 ? 0 : 3,
          pointHoverRadius: 5,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: i => ` Total : ${i.raw.toLocaleString('fr-FR',{maximumFractionDigits:0})} €`,
              afterBody: items => {
                const di = items[0]?.dataIndex;
                if (!di) return [' Point de départ (valeurs initiales)'];
                const date = allDates[di - 1];
                if (!date) return [];
                const txns = depenses.filter(d => d.date === date);
                if (!txns.length) return [];
                return txns.map(d => {
                  const sign = d.amount >= 0 ? '+' : '';
                  return ` ${d.desc || d.compte || '—'} : ${sign}${d.amount.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
                });
              },
              footer: items => {
                const di = items[0]?.dataIndex;
                if (!di) return '';
                const date = allDates[di - 1];
                const net  = depenses.filter(d => d.date === date).reduce((s,d) => s+d.amount, 0);
                const sign = net >= 0 ? '+' : '';
                return ` Net du jour : ${sign}${net.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
              }
            }
          }
        },
        scales: {
          x: { ticks:{ font:{family:'Space Mono',size:8}, maxRotation:40, maxTicksLimit:20 }, grid:{ color:'rgba(37,37,53,0.5)' } },
          y: { ticks:{ font:{family:'Space Mono',size:9}, callback: v => v.toLocaleString('fr-FR',{maximumFractionDigits:0})+'€' }, grid:{ color:'rgba(37,37,53,0.5)' } }
        }
      }
    });
  } else if (ctxArea) {
    ctxArea.canvas.parentElement.innerHTML = '<div class="fin-empty">Aucune dépense trouvée</div>';
  }

  // ── Two doughnuts: dépenses (negative) and gains (positive) ──
  const CAT_COLORS = FIN_PALETTE.concat(['#94a3b8']);
  const fmtK = v => v >= 1000
    ? (v/1000).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'K€'
    : v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+'€';

  const makePie = (id, cats, byMap, key, centerColor) => {
    const ctx = document.getElementById(id)?.getContext('2d');
    if (!ctx) return;
    if (!cats.length) { ctx.canvas.parentElement.innerHTML = `<div class="fin-empty" style="font-size:0.5rem">Aucun ${key}</div>`; return; }
    const total = cats.reduce((s,c) => s + byMap[c], 0);

    // Inline plugin: draw total in the center of the ring
    const centerPlugin = {
      id: 'center_' + key,
      afterDraw(chart) {
        const { width, ctx: c, chartArea } = chart;
        if (!chartArea) return;
        const cx = (chartArea.left + chartArea.right) / 2;
        const cy = (chartArea.top  + chartArea.bottom) / 2;
        c.save();
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = `bold 11px "Space Mono", monospace`;
        c.fillStyle = centerColor;
        c.fillText(fmtK(total), cx, cy);
        c.restore();
      }
    };

    finCharts[key] = new Chart(ctx, {
      type: 'doughnut',
      // Labels include the category name + its amount
      data: {
        labels: cats.map(c => `${c}  ${fmtK(byMap[c])}`),
        datasets: [{ data: cats.map(c => parseFloat(byMap[c].toFixed(2))),
          backgroundColor: cats.map((_,i) => CAT_COLORS[i % CAT_COLORS.length]),
          borderColor: '#09090e', borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '58%',
        plugins: {
          legend: { position:'bottom', labels:{ font:{family:'Space Mono',size:7}, boxWidth:7, padding:4 } },
          tooltip: { callbacks: { label: i => ` ${cats[i.dataIndex]}  ${i.raw.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €` } }
        }
      },
      plugins: [centerPlugin]
    });
  };
  makePie('finChartDep',  catsDep,  byCatDep,  'dep',  '#f87171');
  makePie('finChartGain', catsGain, byCatGain, 'gain', '#4ade80');
}

// ════════════════════════════════════════════════════
// FINANCES — SAVINGS MILESTONE TRACKER
// ════════════════════════════════════════════════════
function renderFinMilestone(comptes, depenses) {
  const totalCurrent = comptes.reduce((s,c) => s + c.current, 0);
  const totalInitial = comptes.reduce((s,c) => s + c.initial, 0);
  const deltaEur     = totalCurrent - totalInitial;
  const now          = new Date();
  const monthsElapsed = Math.max(1, (now - FIN_START_DATE) / (1000*60*60*24*30.44));
  const mthSavings   = deltaEur / monthsElapsed;  // avg monthly savings since Jan 2026

  const pct1M = Math.min(100, totalCurrent / FIN_GOAL * 100);

  const fmtDate = d => {
    const mo = d.getMonth()+1;
    const MONTHS_SHORT = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
    return `${MONTHS_SHORT[mo-1]} ${d.getFullYear()}`;
  };

  const nodes = FIN_MILESTONES.map((ms, i) => {
    const done   = totalCurrent >= ms.val;
    const isNext = !done && FIN_MILESTONES.findIndex(m => totalCurrent < m.val) === i;
    let dateStr  = '';
    if (done) {
      dateStr = '✓ ATTEINT';
    } else if (mthSavings > 0) {
      const months = Math.ceil((ms.val - totalCurrent) / mthSavings);
      const proj   = new Date(now);
      proj.setMonth(proj.getMonth() + months);
      dateStr = `~${fmtDate(proj)}`;
    }
    return `
      <div class="fin-ms-node ${done?'done':''} ${isNext?'active-next':''}">
        <div class="fin-ms-icon">${ms.icon}</div>
        <div class="fin-ms-node-lbl">${ms.label}</div>
        <div class="fin-ms-node-date">${dateStr}</div>
      </div>`;
  }).join('');

  // Monthly savings needed from now to hit 1M in N years (aspirational targets)
  const targets = [
    {years:5,  rate: Math.ceil((FIN_GOAL - totalCurrent)/(5*12))},
    {years:10, rate: Math.ceil((FIN_GOAL - totalCurrent)/(10*12))},
    {years:15, rate: Math.ceil((FIN_GOAL - totalCurrent)/(15*12))},
  ];
  const targetHtml = targets.map(t =>
    `<span style="margin-right:1.2rem"><b style="color:var(--text)">${t.years} ans</b> → ${t.rate.toLocaleString('fr-FR')} €/mois</span>`
  ).join('');

  const fmtEur = v => v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';

  document.getElementById('finMilestone').innerHTML = `
    <div class="fin-section-lbl">PLAN D'ÉPARGNE · OBJECTIF 1 MILLION €</div>
    <div class="fin-milestone">
      <div class="fin-ms-top">
        <div>
          <div class="fin-ms-title">PROGRESSION VERS 1 000 000 €</div>
          <div style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-dim);margin-top:0.35rem;line-height:1.7">
            Patrimoine : <b style="color:var(--text)">${fmtEur(totalCurrent)}</b>
            &nbsp;·&nbsp; Épargne moy. : <b style="color:var(--green)">${mthSavings>=0?'+':''}${fmtEur(mthSavings)}/mois</b>
            ${mthSavings>0 ? `&nbsp;·&nbsp; Projection : <b style="color:var(--accent)">~${Math.round((FIN_GOAL-totalCurrent)/mthSavings)} mois</b>` : ''}
          </div>
          <div style="font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-top:0.5rem">
            Pour atteindre 1M€ en : ${targetHtml}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="fin-ms-pct">${pct1M.toFixed(2)}%</div>
          <div class="fin-ms-proj">${fmtEur(FIN_GOAL - totalCurrent)} restants</div>
        </div>
      </div>
      <div class="fin-ms-track">
        <div class="fin-ms-bar" style="width:${pct1M}%"></div>
      </div>
      <div class="fin-milestones">${nodes}</div>
    </div>`;
}

// ════════════════════════════════════════════════════
// FINANCES — TRANSACTIONS TABLE
// ════════════════════════════════════════════════════
function renderFinTable(depenses) {
  const CAT_PALETTE = [
    ['logement','loyer','#38bdf8'],['transport','carburant','#fbbf24'],
    ['alimentation','courses','nourriture','#4ade80'],['restaurant','café','#a3e635'],
    ['santé','médecin','pharmacie','#22d3ee'],['loisirs','sport','jeux','#a855f7'],
    ['épargne','livret','#7c6aff'],['investissement','bourse','crypto','#eab308'],
    ['abonnement','streamin','#fb923c'],['voyage','vacances','#e879f9'],
  ];
  const catColor = cat => {
    const c = cat.toLowerCase();
    for (const [,,col,...rest] of CAT_PALETTE) {
      const terms = CAT_PALETTE.find(p => p.slice(0,-1).some(t => c.includes(t)));
      if (terms && terms.slice(0,-1).some(t => c.includes(t))) return terms[terms.length-1];
    }
    return '#94a3b8';
  };
  // Simpler cat color approach
  const getCatColor = cat => {
    const c = (cat||'').toLowerCase();
    if (c.includes('logement')||c.includes('loyer')) return '#38bdf8';
    if (c.includes('transport')||c.includes('carburant')) return '#fbbf24';
    if (c.includes('aliment')||c.includes('course')||c.includes('nourrit')) return '#4ade80';
    if (c.includes('restaurant')||c.includes('café')||c.includes('cafe')) return '#a3e635';
    if (c.includes('santé')||c.includes('sante')||c.includes('médecin')||c.includes('pharma')) return '#22d3ee';
    if (c.includes('loisir')||c.includes('sport')||c.includes('jeux')||c.includes('jeu')) return '#a855f7';
    if (c.includes('épargne')||c.includes('epargne')||c.includes('livret')) return '#7c6aff';
    if (c.includes('invest')||c.includes('bourse')||c.includes('crypto')) return '#eab308';
    if (c.includes('abonn')||c.includes('stream')) return '#fb923c';
    if (c.includes('voyage')||c.includes('vacance')) return '#e879f9';
    return '#94a3b8';
  };

  const sorted  = [...depenses].sort((a,b) => b.date.localeCompare(a.date));
  const recent  = sorted.slice(0, 50);
  const fmtAmt  = v => v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';

  const rows = recent.map(d => {
    const catCol = getCatColor(d.cat);
    const amtColor = d.amount >= 0 ? 'var(--green)' : 'var(--danger)'; // positive=gain(green), negative=dépense(red)
    return `<tr>
      <td style="white-space:nowrap">${d.date}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.desc||'—'}</td>
      <td><span class="fin-cat-pill" style="color:${catCol};border-color:${catCol}44;background:${catCol}11">${d.cat||'—'}</span></td>
      <td style="color:var(--text-dim);white-space:nowrap">${d.compte||'—'}</td>
      <td style="text-align:right;font-weight:700;color:${amtColor}">${fmtAmt(d.amount)}</td>
    </tr>`;
  }).join('');

  document.getElementById('finTable').innerHTML = `
    <div class="fin-section-lbl">TRANSACTIONS RÉCENTES</div>
    <div class="fin-box">
      ${recent.length
        ? `<table class="fin-table">
            <thead><tr><th>DATE</th><th>DESCRIPTION</th><th>CATÉGORIE</th><th>COMPTE</th><th style="text-align:right">MONTANT</th></tr></thead>
            <tbody>${rows}</tbody>
           </table>
           ${sorted.length > 50 ? `<div style="font-family:'Space Mono',monospace;font-size:0.46rem;color:var(--text-dim);text-align:right;margin-top:0.5rem">Affichage des 50 transactions les plus récentes sur ${sorted.length}</div>` : ''}`
        : `<div class="fin-empty">0 transaction parsée depuis l'onglet "Finance"</div>
           <div style="font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-top:0.75rem;padding:0.75rem;background:var(--surface2);border:1px solid var(--border2);line-height:1.9">
             <div style="color:var(--warn);font-weight:700;margin-bottom:0.4rem">⚠ DIAGNOSTIC</div>
             ${finDebugInfo.error ? `<div style="color:var(--danger)">Erreur : ${finDebugInfo.error}</div>` : ''}
             <div>Onglets trouvés dans le spreadsheet : <b style="color:var(--text)">${finDebugInfo.sheetTitles.join(' · ') || '—'}</b></div>
             <div>Onglet "Comptes" détecté : <b style="color:${finDebugInfo.comptesSheet?'var(--green)':'var(--danger)'}">${finDebugInfo.comptesSheet||'NON TROUVÉ'}</b></div>
             <div>Onglet "Finance" détecté : <b style="color:${finDebugInfo.financeSheet?'var(--green)':'var(--danger)'}">${finDebugInfo.financeSheet||'NON TROUVÉ'}</b></div>
             <div>Lignes brutes reçues (Finance) : <b style="color:var(--text)">${finDepenses.length}</b></div>
             ${finDepenses.length ? finDepenses.slice(0,4).map((r,i)=>`<div style="margin-top:0.2rem;opacity:${i===0?'0.5':'1'}">
               [${i===0?'header':'L'+i}] ${r.slice(0,6).map(c=>`<span style="border:1px solid var(--border);padding:0 4px;margin-right:2px">${String(c||'∅')}</span>`).join('')}
             </div>`).join('') : ''}
             <div style="margin-top:0.4rem;opacity:0.5">Attendu : col A=date · B=description · C=montant · D=catégorie · E=compte</div>
           </div>`}
    </div>`;
}

let fitProgram=[], fitExercises=[], fitSessions=[], fitWeeklyPlan=[], fitSessionLog=[], fitBodyStats=[];
let fitLoaded=false;
const FIT_TIER_COLOR={S:'#a855f7',H:'#3b82f6',M:'#f97316',W:'#22c55e'};
const FIT_TIER_BG={S:'rgba(168,85,247,0.12)',H:'rgba(59,130,246,0.12)',M:'rgba(249,115,22,0.12)',W:'rgba(34,197,94,0.12)'};

async function loadFitData(){
  if(!accessToken){console.warn('No accessToken — fitness load aborted');return;}
  const sid=cfg.spreadsheetId;
  const sheets=['fit_program','fit_exercises','fit_sessions','fit_weekly_plan','fit_session_log','fit_body_stats'];
  const results=await Promise.all(sheets.map(s=>
    fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(s)}`,{headers:{Authorization:`Bearer ${accessToken}`}})
      .then(r=>r.ok?r.json():{values:[]}).catch(()=>({values:[]}))
  ));
  [fitProgram,fitExercises,fitSessions,fitWeeklyPlan,fitSessionLog,fitBodyStats]=results.map(r=>r.values||[]);
  fitLoaded=true;
}

function fitIdx(hdr,key){
  const k=key.toLowerCase().replace(/[\s_]/g,'');
  const i=hdr.findIndex(h=>h.toLowerCase().replace(/[\s_]/g,'')===k);
  return i>=0?i:-1;
}

function parseFitExercises(){
  if(!fitExercises.length)return{};
  const [hdr,...rows]=fitExercises;
  const g=k=>fitIdx(hdr,k);
  const iId=g('exercise_id'),iName=g('name')>=0?g('name'):g('exercise_name'),iCat=g('category'),
        iMuscles=g('primary_muscles')>=0?g('primary_muscles'):g('muscles'),
        iEq=g('equipment'),
        iSets=g('target_sets')>=0?g('target_sets'):g('sets'),
        iRMin=g('reps_min'),iRMax=g('reps_max'),iRPE=g('target_rpe'),
        iRest=g('rest_s'),iTempo=g('tempo'),
        iProg=g('progression_kg'),
        iCues=g('form_cues'),iNotes=g('notes');
  const ex={};
  rows.filter(r=>r.some(c=>c)).forEach(r=>{
    const id=String(r[iId>=0?iId:0]||'').trim();
    if(!id)return;
    ex[id]={
      id,
      name:    iName>=0?String(r[iName]||id).trim():id,
      cat:     iCat>=0?String(r[iCat]||'').trim():'',
      muscles: iMuscles>=0?String(r[iMuscles]||'').trim():'',
      eq:      iEq>=0?String(r[iEq]||'').trim():'',
      sets:    iSets>=0?(parseInt(r[iSets])||3):3,
      repsMin: iRMin>=0?(parseInt(r[iRMin])||5):5,
      repsMax: iRMax>=0?(parseInt(r[iRMax])||10):10,
      tgtRpe:  iRPE>=0?(parseFloat(String(r[iRPE]||'8').replace(',','.'))||8):8,
      restS:   iRest>=0?(parseInt(r[iRest])||90):90,
      tempo:   iTempo>=0?String(r[iTempo]||'').trim():'',
      progKg:  iProg>=0?(parseFloat(String(r[iProg]||'0').replace(',','.'))||0):0,
      cues:    iCues>=0?String(r[iCues]||'').trim():'',
      notes:   iNotes>=0?String(r[iNotes]||'').trim():'',
    };
  });
  return ex;
}

// Get last logged performance for an exercise (excluding today)
function fitLastPerf(log,exId,excludeDate){
  const past=log.filter(l=>l.exId===exId&&l.setNum>0&&l.date!==excludeDate);
  if(!past.length)return null;
  // Group by date, pick most recent date
  const byDate={};
  past.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l);});
  const lastDate=Object.keys(byDate).sort().pop();
  const sets=byDate[lastDate].sort((a,b)=>a.setNum-b.setNum);
  const topKg=Math.max(...sets.map(s=>s.kg));
  const topReps=Math.max(...sets.filter(s=>s.kg===topKg).map(s=>s.reps));
  return {date:lastDate, sets:sets.length, topKg, topReps,
          summary:sets.map(s=>`${s.reps}×${s.kg}kg`).join(' · ')};
}

// Double progression suggestion
function fitProgressionHint(ex,last){
  if(!last)return `Première séance : commence léger, vise ${ex.repsMin}–${ex.repsMax} reps @ RPE ${ex.tgtRpe}`;
  if(last.topReps>=ex.repsMax) return `🎯 Cible atteinte (${last.topReps} reps) → augmente à <b>${(last.topKg+ex.progKg).toFixed(1)} kg</b>`;
  if(last.topReps>=ex.repsMin) return `↗ Pousse vers ${ex.repsMax} reps à ${last.topKg} kg (dernière : ${last.topReps} reps)`;
  return `⚠ Sous la cible (${last.topReps}/${ex.repsMin}) — reste à ${last.topKg} kg, vise ${ex.repsMin} reps`;
}

function parseFitSessions(){
  if(!fitSessions.length)return{};
  const [hdr,...rows]=fitSessions;
  const g=k=>fitIdx(hdr,k);
  const iSid=g('session_id'),iExId=g('exercise_id'),iOrder=g('order')>=0?g('order'):g('exercise_order'),
        iTier=g('tier'),iName=g('name')>=0?g('name'):g('session_name');
  const sess={};
  rows.filter(r=>r.some(c=>c)).forEach(r=>{
    const sid=String(r[iSid>=0?iSid:0]||'').trim();
    if(!sid)return;
    if(!sess[sid])sess[sid]={id:sid,tier:String(r[iTier>=0?iTier:1]||'').trim(),name:String(r[iName>=0?iName:2]||sid).trim(),exercises:[]};
    const exId=String(r[iExId>=0?iExId:3]||'').trim();
    if(exId)sess[sid].exercises.push({exId,order:iOrder>=0?(parseInt(r[iOrder])||sess[sid].exercises.length+1):sess[sid].exercises.length+1});
  });
  Object.values(sess).forEach(s=>s.exercises.sort((a,b)=>a.order-b.order));
  return sess;
}

function parseFitWeeklyPlan(){
  if(!fitWeeklyPlan.length)return[];
  const [hdr,...rows]=fitWeeklyPlan;
  const g=k=>fitIdx(hdr,k);
  const iDate=g('date'),iDay=g('day'),iTier=g('planned_tier'),iSessId=g('planned_session_id'),
        iInt=g('intensity_modifier'),iNotes=g('notes'),iWeek=g('week_starting');
  return rows.filter(r=>r.some(c=>c)).map(r=>({
    weekStarting:String(r[iWeek>=0?iWeek:0]||'').trim(),
    date:   String(r[iDate>=0?iDate:1]||'').trim(),
    day:    String(r[iDay>=0?iDay:2]||'').trim(),
    tier:   String(r[iTier>=0?iTier:3]||'').trim(),
    sessId: String(r[iSessId>=0?iSessId:4]||'').trim(),
    intMod: String(r[iInt>=0?iInt:5]||'').trim(),
    notes:  String(r[iNotes>=0?iNotes:7]||'').trim(),
  })).filter(r=>r.date);
}

function parseFitSessionLog(){
  if(!fitSessionLog.length)return[];
  const [hdr,...rows]=fitSessionLog;
  if(!hdr||!hdr.length)return[];
  const g=k=>fitIdx(hdr,k);
  const iLogId=g('log_id'),iDate=g('date'),iSessId=g('session_id'),iStatus=g('status'),
        iSkip=g('skip_reason'),iDur=g('duration_min'),iExId=g('exercise_id'),
        iSet=g('set_number'),iReps=g('reps'),iKg=g('weight_kg'),iRPE=g('rpe'),
        iEnergy=g('session_energy_1to10'),iSleep=g('sleep_h_previous'),iNotes=g('session_notes');
  return rows.filter(r=>r.some(c=>c)).map(r=>({
    logId:  String(r[iLogId>=0?iLogId:0]||'').trim(),
    date:   String(r[iDate>=0?iDate:1]||'').trim(),
    sessId: String(r[iSessId>=0?iSessId:2]||'').trim(),
    status: String(r[iStatus>=0?iStatus:3]||'').trim(),
    skip:   String(r[iSkip>=0?iSkip:4]||'').trim(),
    dur:    parseInt(r[iDur>=0?iDur:5])||0,
    exId:   String(r[iExId>=0?iExId:6]||'').trim(),
    setNum: parseInt(r[iSet>=0?iSet:7])||0,
    reps:   parseInt(r[iReps>=0?iReps:8])||0,
    kg:     parseFloat(String(r[iKg>=0?iKg:9]||'0').replace(',','.'))||0,
    rpe:    parseFloat(String(r[iRPE>=0?iRPE:10]||'0').replace(',','.'))||0,
    energy: String(r[iEnergy>=0?iEnergy:12]||'').trim(),
    sleep:  String(r[iSleep>=0?iSleep:13]||'').trim(),
    notes:  String(r[iNotes>=0?iNotes:14]||'').trim(),
  })).filter(r=>r.date);
}

function parseFitBodyStats(){
  if(!fitBodyStats.length)return[];
  const [hdr,...rows]=fitBodyStats;
  if(!hdr||!hdr.length)return[];
  const g=k=>fitIdx(hdr,k);
  const iDate=g('date'),iWt=g('weight_kg'),iBf=g('bf_estimate_pct'),iWaist=g('waist_navel_cm'),iNotes=g('notes');
  return rows.filter(r=>r.some(c=>c)).map(r=>({
    date:  String(r[iDate>=0?iDate:0]||'').trim(),
    wt:    parseFloat(String(r[iWt>=0?iWt:1]||'0').replace(',','.'))||0,
    bf:    parseFloat(String(r[iBf>=0?iBf:2]||'0').replace(',','.'))||0,
    waist: parseFloat(String(r[iWaist>=0?iWaist:3]||'0').replace(',','.'))||0,
    notes: String(r[iNotes>=0?iNotes:12]||'').trim(),
  })).filter(r=>r.date);
}

async function fitAppendRow(sheetName,values){
  if(!accessToken)return false;
  const sid=cfg.spreadsheetId;
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(sheetName)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const resp=await fetch(url,{
    method:'POST',
    headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},
    body:JSON.stringify({values:[values]})
  });
  return resp.ok;
}

async function renderFitPage(){
  if(!fitLoaded){showLoad(true);await loadFitData();showLoad(false);}
  const exercises=parseFitExercises();
  const sessions=parseFitSessions();
  const plan=parseFitWeeklyPlan();
  const log=parseFitSessionLog();
  const stats=parseFitBodyStats();
  const today=td();
  const todayPlan=plan.find(p=>p.date===today);
  const loggedToday=log.filter(l=>l.date===today);
  renderFitBanner(plan,log,stats,today);
  renderFitWeekStrip(plan,log,today);
  renderFitToday(todayPlan,sessions,exercises,loggedToday,today);
  renderFitLogger(todayPlan,sessions,exercises,log,today);
  renderFitStats(stats);
  renderFitPrograms(sessions,exercises);
}

async function reloadFitData(){
  fitLoaded=false;fitProgram=[];fitExercises=[];fitSessions=[];fitWeeklyPlan=[];fitSessionLog=[];fitBodyStats=[];
  await renderFitPage();
}

function renderFitBanner(plan,log,stats,today){
  const now=new Date();
  const hour=now.getHours();
  const dow=(now.getDay()+6)%7;
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-dow);
  const weekDates=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d.toISOString().split('T')[0];});
  const doneDays=new Set(log.filter(l=>weekDates.includes(l.date)&&l.status==='completed').map(l=>l.date)).size;
  // streak
  let streak=0;const chk=new Date(today);
  while(streak<365){
    const ds=chk.toISOString().split('T')[0];
    if(log.some(l=>l.date===ds&&l.status==='completed')){streak++;chk.setDate(chk.getDate()-1);}
    else{if(ds===today){chk.setDate(chk.getDate()-1);}else break;}
  }
  const lastStat=stats.length?[...stats].sort((a,b)=>a.date.localeCompare(b.date)).pop():null;
  const loggedTodayAny=log.some(l=>l.date===today&&l.status==='completed');
  const showAntiZero=!loggedTodayAny&&hour>=18;
  const totalSessDone=new Set(log.filter(l=>l.status==='completed').map(l=>l.date+'_'+l.sessId)).size;
  document.getElementById('fitBanner').innerHTML=`
    ${showAntiZero?`<div class="fit-alert">⚡ ANTI-ZÉRO — ${hour}h et aucune séance complétée. Lance le mode Minimal (10 min) ou log ton Walk (8 000 pas) !</div>`:''}
    <div class="fit-banner" style="margin-top:${showAntiZero?'0.75rem':'0'}">
      <div class="fit-kpi">
        <div class="fit-kpi-lbl">SÉANCES SEMAINE</div>
        <div class="fit-kpi-val">${doneDays}<span style="font-size:0.7rem;opacity:0.4">/7</span></div>
        <div class="fit-kpi-sub">${weekDates.filter(d=>d<=today).length} jours écoulés</div>
      </div>
      <div class="fit-kpi">
        <div class="fit-kpi-lbl">STREAK</div>
        <div class="fit-kpi-val">${streak}<span style="font-size:0.7rem;opacity:0.4"> j</span></div>
        <div class="fit-kpi-sub">Jours consécutifs</div>
      </div>
      <div class="fit-kpi">
        <div class="fit-kpi-lbl">POIDS</div>
        <div class="fit-kpi-val">${lastStat&&lastStat.wt?lastStat.wt+'<span style="font-size:0.7rem;opacity:0.4"> kg</span>':'<span style="font-size:0.9rem;opacity:0.5">—</span>'}</div>
        <div class="fit-kpi-sub">${lastStat?lastStat.date:'Aucune mesure'}</div>
      </div>
      <div class="fit-kpi">
        <div class="fit-kpi-lbl">TOTAL SÉANCES</div>
        <div class="fit-kpi-val">${totalSessDone}</div>
        <div class="fit-kpi-sub">Depuis le début</div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:0.5rem">
      <button class="fit-btn" onclick="reloadFitData()" style="font-size:0.46rem">↺ RAFRAÎCHIR</button>
    </div>`;
}

function renderFitWeekStrip(plan,log,today){
  const now=new Date(today+'T12:00:00');
  const dow=(now.getDay()+6)%7;
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-dow);
  const DAYS=['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const dStr=d.toISOString().split('T')[0];
    const dayPlan=plan.find(p=>p.date===dStr);
    const hasLog=log.some(l=>l.date===dStr&&l.status==='completed');
    const isToday=dStr===today;
    const isPast=dStr<today;
    const tier=dayPlan?.tier||'';
    const tc=FIT_TIER_COLOR[tier]||'var(--text-dim)';
    const tb=FIT_TIER_BG[tier]||'transparent';
    let cls='fit-day';
    if(isToday)cls+=' fit-day-today';
    else if(hasLog)cls+=' fit-day-done';
    else if(isPast&&tier)cls+=' fit-day-missed';
    return `<div class="${cls}">
      <div class="fit-day-label">${DAYS[i]}</div>
      <div class="fit-day-date">${d.getDate()}</div>
      ${tier?`<div class="fit-day-tier" style="color:${tc};background:${tb};border-color:${tc}44">${tier}</div>`:`<div class="fit-day-tier" style="opacity:0.18">—</div>`}
      <div class="fit-day-check">${hasLog?'<span style="color:var(--green)">✓</span>':(isPast&&tier?'<span style="color:var(--danger)">✗</span>':'')}</div>
      ${dayPlan?.sessId?`<div class="fit-day-sess">${dayPlan.sessId.replace(/_/g,' ')}</div>`:''}
    </div>`;
  });
  document.getElementById('fitWeekStrip').innerHTML=`
    <div class="fit-section-lbl">SEMAINE EN COURS</div>
    <div class="fit-week">${days.join('')}</div>`;
}

function renderFitToday(todayPlan,sessions,exercises,loggedToday,today){
  const el=document.getElementById('fitToday');
  if(!todayPlan){
    el.innerHTML=`
      <div class="fit-section-lbl">AUJOURD'HUI — ${today}</div>
      <div class="fit-box">
        <div class="fit-empty">Aucune séance planifiée pour aujourd'hui</div>
        <div style="display:flex;gap:0.6rem;justify-content:center;margin-top:1rem">
          <button class="fit-btn fit-btn-m" onclick="fitQuickLog('M','minimal_10min','${today}')">⚡ LOG ANTI-ZÉRO (10 MIN)</button>
          <button class="fit-btn fit-btn-w" onclick="fitQuickLog('W','walk_daily','${today}')">🚶 LOG WALK (8 000 PAS)</button>
        </div>
      </div>`;
    return;
  }
  const tier=todayPlan.tier;
  const sessId=todayPlan.sessId;
  const sess=sessions[sessId];
  const tc=FIT_TIER_COLOR[tier]||'var(--accent)';
  const tb=FIT_TIER_BG[tier]||'var(--surface2)';
  const isLogged=loggedToday.some(l=>l.status==='completed'||l.status==='partial');
  let bodyHtml='';
  if(tier==='W'){
    bodyHtml=`<div class="fit-walk-box">
      <div style="font-size:2rem;margin-bottom:0.6rem">🚶</div>
      <div style="font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--text-dim);margin-bottom:1rem">OBJECTIF : 8 000 PAS</div>
      ${!isLogged?`<button class="fit-btn fit-btn-w" onclick="fitQuickLog('W','walk_daily','${today}')">✓ WALK COMPLÉTÉ</button>`:''}
    </div>`;
  } else if(sess&&sess.exercises.length){
    // need full log history for last-performance lookup
    const fullLog=parseFitSessionLog();
    const totalSets=sess.exercises.reduce((s,{exId})=>s+(exercises[exId]?.sets||0),0);
    const doneSets=loggedToday.filter(l=>l.setNum>0).length;
    bodyHtml=`<div class="fit-sess-meta">
      <span>${sess.exercises.length} exercices</span>
      <span>${totalSets} séries cibles</span>
      <span style="color:var(--green)">${doneSets} séries complétées</span>
      ${tier==='S'?'<span>≈ 50–60 min</span>':tier==='H'?'<span>≈ 25–30 min</span>':''}
    </div>`;
    bodyHtml+='<div class="fit-ex-list">';
    sess.exercises.forEach(({exId},idx)=>{
      const ex=exercises[exId];
      if(!ex){bodyHtml+=`<div class="fit-ex-row"><div class="fit-ex-num">${idx+1}</div><div class="fit-ex-info" style="color:var(--danger)">Exercice "${exId}" introuvable dans fit_exercises</div></div>`;return;}
      const sets=loggedToday.filter(l=>l.exId===exId&&l.setNum>0);
      const last=fitLastPerf(fullLog,exId,today);
      const hint=fitProgressionHint(ex,last);
      const restMin=Math.floor(ex.restS/60),restSec=ex.restS%60;
      const restTxt=restMin>0?`${restMin}min${restSec>0?' '+restSec+'s':''}`:`${ex.restS}s`;
      bodyHtml+=`<div class="fit-ex-row">
        <div class="fit-ex-num">${idx+1}</div>
        <div class="fit-ex-info">
          <div class="fit-ex-name">${ex.name}${ex.muscles?`<span style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-dim);font-weight:400;margin-left:0.5rem">${ex.muscles}</span>`:''}</div>
          <div class="fit-ex-prescription"><b>${ex.sets} × ${ex.repsMin}–${ex.repsMax}</b> reps · RPE ${ex.tgtRpe} · Repos ${restTxt}${ex.tempo?` · Tempo ${ex.tempo}`:''}${ex.eq?` · ${ex.eq}`:''}</div>
          <div class="fit-ex-progress">${hint}</div>
          ${last?`<div class="fit-ex-last">📊 Dernière (${last.date}) : ${last.summary}</div>`:''}
          ${ex.cues?`<div class="fit-ex-cues">💡 ${ex.cues}</div>`:''}
          ${ex.notes?`<div class="fit-ex-cues" style="opacity:0.7">${ex.notes}</div>`:''}
        </div>
        <div class="fit-ex-sets">
          ${sets.length?`<div class="fit-ex-sets-done">${sets.length}/${ex.sets} ✓</div>`:`<div style="color:var(--text-dim)">0/${ex.sets}</div>`}
          ${sets.length?`<div style="font-size:0.42rem;color:var(--text-dim);margin-top:0.25rem;text-align:right">${sets.map(s=>`${s.reps}×${s.kg||'?'}`).join('<br>')}</div>`:''}
        </div>
      </div>`;
    });
    bodyHtml+='</div>';
  } else {
    bodyHtml=`<div class="fit-empty">Séance "${sessId}" non trouvée dans fit_sessions</div>`;
  }
  el.innerHTML=`
    <div class="fit-section-lbl">AUJOURD'HUI — ${today}</div>
    <div class="fit-box">
      <div class="fit-today-hdr">
        <div>
          <div class="fit-tier-badge" style="color:${tc};background:${tb};border-color:${tc}55">TIER ${tier}</div>
          <div class="fit-today-title">${sess?sess.name:(sessId?sessId.replace(/_/g,' '):'Session')}</div>
          ${todayPlan.intMod?`<div class="fit-today-mod">⚙ ${todayPlan.intMod}</div>`:''}
          ${todayPlan.notes?`<div class="fit-today-notes">${todayPlan.notes}</div>`:''}
        </div>
        ${isLogged?`<div style="color:var(--green);font-family:'Space Mono',monospace;font-size:0.75rem;font-weight:700;flex-shrink:0">✓ COMPLÉTÉE</div>`:''}
      </div>
      ${bodyHtml}
    </div>`;
}

function renderFitLogger(todayPlan,sessions,exercises,log,today){
  const el=document.getElementById('fitLogger');
  if(!todayPlan||todayPlan.tier==='W'){el.innerHTML='';return;}
  const sess=sessions[todayPlan.sessId];
  if(!sess||!sess.exercises.length){el.innerHTML='';return;}
  const tc=FIT_TIER_COLOR[todayPlan.tier]||'var(--accent)';
  let rows='';
  sess.exercises.forEach(({exId})=>{
    const ex=exercises[exId];
    if(!ex)return;
    const exLog=log.filter(l=>l.date===today&&l.exId===exId&&l.setNum>0);
    const lastKg=exLog.length?exLog[exLog.length-1].kg:'';
    const lastReps=exLog.length?exLog[exLog.length-1].reps:ex.repsMin;
    rows+=`<div class="fit-log-row">
      <div class="fit-log-exname">${ex.name}</div>
      <div class="fit-log-sets">${exLog.map(s=>`<span class="fit-log-set-done" title="S${s.setNum}: ${s.reps} reps @ ${s.kg}kg RPE${s.rpe}">S${s.setNum} ✓</span>`).join('')}</div>
      <div class="fit-log-inputs">
        <input type="number" id="fitkg_${exId}" placeholder="kg" value="${lastKg}" step="0.5" min="0" class="fit-input" style="width:65px">
        <input type="number" id="fitreps_${exId}" placeholder="reps" value="${lastReps}" min="1" max="50" class="fit-input" style="width:60px">
        <input type="number" id="fitrpe_${exId}" placeholder="RPE" min="5" max="10" step="0.5" class="fit-input" style="width:55px">
        <button class="fit-btn" style="font-size:0.48rem" onclick="fitLogSet('${exId}','${todayPlan.sessId}','${today}',${exLog.length+1})">+ SÉRIE</button>
      </div>
    </div>`;
  });
  el.innerHTML=`
    <div class="fit-section-lbl">LOGGER LA SÉANCE</div>
    <div class="fit-box">
      <div class="fit-log-table">${rows}</div>
      <div style="margin-top:1.2rem;border-top:1px solid var(--border);padding-top:1rem;display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
        <div style="display:flex;gap:0.4rem;align-items:center">
          <label class="fit-form-lbl" style="margin:0">ÉNERGIE</label>
          <input type="number" id="fitEnergy" min="1" max="10" placeholder="7" class="fit-input" style="width:50px">
        </div>
        <div style="display:flex;gap:0.4rem;align-items:center">
          <label class="fit-form-lbl" style="margin:0">SOMMEIL (h)</label>
          <input type="number" id="fitSleep" min="3" max="12" step="0.5" placeholder="7.5" class="fit-input" style="width:60px">
        </div>
        <div style="display:flex;gap:0.4rem;align-items:center">
          <label class="fit-form-lbl" style="margin:0">DURÉE (min)</label>
          <input type="number" id="fitDur" min="1" max="120" placeholder="55" class="fit-input" style="width:60px">
        </div>
        <div style="flex:1;min-width:120px">
          <input type="text" id="fitNotes" placeholder="Notes séance..." class="fit-input" style="width:100%">
        </div>
        <button class="fit-btn" style="color:${tc};border-color:${tc}44" onclick="fitCompleteSession('${todayPlan.sessId}','${today}')">✓ TERMINER LA SÉANCE</button>
      </div>
    </div>`;
}

async function fitLogSet(exId,sessId,date,setNum){
  const kg=parseFloat(document.getElementById('fitkg_'+exId)?.value)||0;
  const reps=parseInt(document.getElementById('fitreps_'+exId)?.value)||0;
  const rpe=parseFloat(document.getElementById('fitrpe_'+exId)?.value)||0;
  if(!reps){alert('Renseigne le nombre de répétitions.');return;}
  const logId=`${date}_${sessId}_${exId}_s${setNum}_${Date.now()}`;
  showLoad(true);
  const ok=await fitAppendRow('fit_session_log',[logId,date,sessId,'in_progress','','',exId,setNum,reps,kg||'',rpe||'','','','','']);
  showLoad(false);
  if(ok){
    fitLoaded=false;await loadFitData();
    const plan=parseFitWeeklyPlan();const sessions=parseFitSessions();
    const exercises=parseFitExercises();const log=parseFitSessionLog();
    const today=td();const todayPlan=plan.find(p=>p.date===today);
    renderFitToday(todayPlan,sessions,exercises,log.filter(l=>l.date===today),today);
    renderFitLogger(todayPlan,sessions,exercises,log,today);
  } else {alert('Erreur lors de l\'enregistrement de la série.');}
}

async function fitCompleteSession(sessId,date){
  const energy=document.getElementById('fitEnergy')?.value||'';
  const sleep=document.getElementById('fitSleep')?.value||'';
  const dur=document.getElementById('fitDur')?.value||'';
  const notes=document.getElementById('fitNotes')?.value||'';
  const logId=`${date}_${sessId}_done_${Date.now()}`;
  showLoad(true);
  const ok=await fitAppendRow('fit_session_log',[logId,date,sessId,'completed','',dur,'','','','','','',energy,sleep,notes]);
  showLoad(false);
  if(ok){fitLoaded=false;await renderFitPage();}else{alert('Erreur lors de la finalisation.');}
}

async function fitQuickLog(tier,sessId,date){
  const dur=tier==='W'?'30':tier==='M'?'10':'';
  const logId=`${date}_${sessId}_${Date.now()}`;
  showLoad(true);
  const ok=await fitAppendRow('fit_session_log',[logId,date,sessId,'completed','',dur,'','','','','','','','',`Quick log ${tier}`]);
  showLoad(false);
  if(ok){fitLoaded=false;await renderFitPage();}else{alert('Erreur lors de l\'enregistrement.');}
}

function renderFitStats(stats){
  const el=document.getElementById('fitStats');
  const sorted=[...stats].sort((a,b)=>a.date.localeCompare(b.date));
  const last5=sorted.slice(-5).reverse();
  el.innerHTML=`
    <div class="fit-section-lbl">STATS CORPORELLES</div>
    <div class="fit-box">
      <div class="fit-box-hdr">
        <span class="fit-box-ttl">MESURES RÉCENTES</span>
        <button class="fit-btn" style="font-size:0.46rem" onclick="document.getElementById('fitStatsForm').style.display='block'">+ NOUVELLE MESURE</button>
      </div>
      ${last5.length?`<table class="fit-stats-table">
        <thead><tr><th>DATE</th><th>POIDS</th><th>%MG</th><th>TAILLE (cm)</th><th>NOTES</th></tr></thead>
        <tbody>${last5.map(s=>`<tr>
          <td>${s.date}</td>
          <td>${s.wt?s.wt+' kg':'—'}</td>
          <td>${s.bf?s.bf+'%':'—'}</td>
          <td>${s.waist?s.waist:'—'}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)">${s.notes||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`:`<div class="fit-empty">Aucune mesure enregistrée</div>`}
      <div id="fitStatsForm" style="display:none;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:0.6rem;margin-bottom:0.8rem">
          <div><label class="fit-form-lbl">DATE</label><input type="date" id="fstatDate" value="${td()}" class="fit-input" style="width:100%"></div>
          <div><label class="fit-form-lbl">POIDS (kg)</label><input type="number" id="fstatWt" step="0.1" placeholder="75.5" class="fit-input" style="width:100%"></div>
          <div><label class="fit-form-lbl">%MG (est.)</label><input type="number" id="fstatBf" step="0.5" placeholder="18" class="fit-input" style="width:100%"></div>
          <div><label class="fit-form-lbl">TAILLE (cm)</label><input type="number" id="fstatWaist" step="0.5" placeholder="85" class="fit-input" style="width:100%"></div>
        </div>
        <div style="margin-bottom:0.8rem"><label class="fit-form-lbl">NOTES</label><input type="text" id="fstatNotes" placeholder="Notes, photos..." class="fit-input" style="width:100%"></div>
        <div style="display:flex;gap:0.5rem">
          <button class="fit-btn" style="color:var(--accent);border-color:rgba(124,106,255,0.4)" onclick="saveFitBodyStat()">ENREGISTRER</button>
          <button class="fit-btn" onclick="document.getElementById('fitStatsForm').style.display='none'">ANNULER</button>
        </div>
      </div>
    </div>`;
}

function renderFitPrograms(sessions,exercises){
  const el=document.getElementById('fitPrograms');
  // Group sessions by tier
  const byTier={S:[],H:[],M:[]};
  Object.values(sessions).forEach(s=>{
    const t=(s.tier||'').toUpperCase();
    if(byTier[t])byTier[t].push(s);
  });
  const TIER_TITLES={S:'TIER S — SALLE (50–60 min)',H:'TIER H — HOME KB (25–30 min)',M:'TIER M — MINIMAL (10 min, anti-zéro)'};
  const renderSess=s=>{
    const exHtml=s.exercises.map(({exId},i)=>{
      const ex=exercises[exId];
      if(!ex)return `<div class="fit-prog-ex"><span class="fit-prog-num">${i+1}</span><span style="color:var(--danger)">${exId} (introuvable)</span></div>`;
      const restMin=Math.floor(ex.restS/60),restSec=ex.restS%60;
      const restTxt=restMin>0?`${restMin}min${restSec>0?' '+restSec+'s':''}`:`${ex.restS}s`;
      return `<div class="fit-prog-ex">
        <span class="fit-prog-num">${i+1}</span>
        <div style="flex:1;min-width:0">
          <div class="fit-prog-exname">${ex.name}${ex.muscles?`<span class="fit-prog-muscles">${ex.muscles}</span>`:''}</div>
          <div class="fit-prog-pres"><b>${ex.sets}×${ex.repsMin}–${ex.repsMax}</b> · RPE ${ex.tgtRpe} · ${restTxt}${ex.tempo?` · tempo ${ex.tempo}`:''}${ex.eq?` · ${ex.eq}`:''}</div>
          ${ex.cues?`<div class="fit-prog-cues">💡 ${ex.cues}</div>`:''}
        </div>
      </div>`;
    }).join('');
    return `<div class="fit-prog-card">
      <div class="fit-prog-card-hdr">${s.name||s.id}</div>
      <div class="fit-prog-card-id">${s.id}</div>
      ${s.exercises.length?`<div class="fit-prog-ex-list">${exHtml}</div>`:`<div class="fit-empty" style="padding:1rem 0">Aucun exercice défini</div>`}
    </div>`;
  };
  const tierBlocks=['S','H','M'].map(t=>{
    const tc=FIT_TIER_COLOR[t];
    const list=byTier[t];
    if(!list.length)return '';
    return `<div class="fit-prog-tier" style="border-left:3px solid ${tc}">
      <div class="fit-prog-tier-hdr" style="color:${tc}">${TIER_TITLES[t]}</div>
      <div class="fit-prog-grid">${list.map(renderSess).join('')}</div>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="fit-section-lbl">PROGRAMMES — DÉTAIL DES SÉANCES</div>
    <div class="fit-box" style="padding:0.85rem 1.1rem">
      ${tierBlocks||'<div class="fit-empty">Aucun programme S/H/M trouvé</div>'}
    </div>`;
}

async function saveFitBodyStat(){
  const date=document.getElementById('fstatDate')?.value||td();
  const wt=document.getElementById('fstatWt')?.value||'';
  const bf=document.getElementById('fstatBf')?.value||'';
  const waist=document.getElementById('fstatWaist')?.value||'';
  const notes=document.getElementById('fstatNotes')?.value||'';
  showLoad(true);
  const ok=await fitAppendRow('fit_body_stats',[date,wt,bf,waist,'','','','','','','','',notes]);
  showLoad(false);
  if(ok){fitLoaded=false;await renderFitPage();}else{alert('Erreur lors de l\'enregistrement.');}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeHabitModal();}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    if(document.getElementById('taskModal').classList.contains('open'))saveTask();
    if(document.getElementById('habitModal').classList.contains('open'))saveHabit();
  }
});
document.getElementById('taskModal').addEventListener('click',e=>{if(e.target===document.getElementById('taskModal'))closeModal();});
document.getElementById('habitModal').addEventListener('click',e=>{if(e.target===document.getElementById('habitModal'))closeHabitModal();});

init();
