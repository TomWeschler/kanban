    const r = await fetch(`${sheetsBase()}/values/${encodeURIComponent(cfg.sheetName+'!A1')}?valueInputOption=RAW`, {
      method:'PUT', headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'}, body:JSON.stringify({values})
    });
    if (!r.ok) throw new Error(r.status);
    localStorage.setItem(LS_CACHE, JSON.stringify(allTasks));
    setSyncStatus('ok','SYNCED');
    toast('💾 Sauvegardé','ok');

}

// ════════════════════════════════════════════════════
// FREQUENCY LOGIC
// ════════════════════════════════════════════════════
function isHabitDueOnDate(freq, date) {
  const dow = date.getDay();
  const dom = date.getDate();
  const year = date.getFullYear(), month = date.getMonth();
  if (freq === 'daily') return true;
  if (freq.startsWith('weekly:')) {
    return freq.slice(7).split(',').map(Number).includes(dow);
  }
  if (freq.startsWith('monthly:')) {
    const parts = freq.split(':');
    if (parts[1] === 'day') return dom === parseInt(parts[2]);
    if (parts[1] === 'first') {
      const targetDow = parseInt(parts[2]);
      const firstOfMonth = new Date(year, month, 1);
      const firstOcc = 1 + ((targetDow - firstOfMonth.getDay() + 7) % 7);
      return dom === firstOcc;
    }
  }
  return false;
}

function isHabitDueToday(freq) {
  const today = new Date(); today.setHours(0,0,0,0);
  return isHabitDueOnDate(freq, today);
}

function getStreak(habitId, freq) {
  const todayStr = td();
  const completionDates = new Set(habitsLog.filter(l => String(l.habit_id) === String(habitId)).map(l => l.date));
  const scheduled = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    if (isHabitDueOnDate(freq, d)) scheduled.push(d.toISOString().split('T')[0]);
    if (scheduled.length >= 90) break;
  }
  let streak = 0, started = false;
  for (const date of scheduled) {
    if (completionDates.has(date)) { streak++; started = true; }
    else if (!started && date === todayStr) continue;
    else break;
  }
  return streak;
}

  if (/anglais|espagnol|allemand|langue|vocabul/.test(t)) return '🌍';
  if (/réseau|network|linkedin|contact/.test(t)) return '🤝';
  if (/planif|agenda|to.do|tâche|revue/.test(t)) return '📋';
  if (/email|mail|inbox/.test(t)) return '📧';
  if (/objectif|goal|cible/.test(t)) return '🎯';
  if (/nettoy|ménage|rangement/.test(t)) return '🧹';
  if (/cuisine|repas|manger|cuisson/.test(t)) return '🍳';
  if (/légume|fruit|salade|healthy/.test(t)) return '🥗';
  if (/protéine|protein/.test(t)) return '🥩';
  if (/café|thé|infusion/.test(t)) return '☕';
  if (/famille|parent|enfant|ami|appel|téléphon/.test(t)) return '📞';
  if (/no.sugar|sucre|sans sucre/.test(t)) return '🚫';
  if (/no.alcool|alcool|sans alcool/.test(t)) return '🍷';
  if (/soleil|air.frais|dehors|nature/.test(t)) return '☀️';
  if (/créat|dessiner|sketch|art/.test(t)) return '🎨';
  return '✦';
}

function freqLabel(freq) {
  const found = FREQ_OPTS.find(([v]) => v === freq);
  return found ? found[1] : freq;
}

// ── Week helpers (Monday-based) ──────────────────────
const HAB_CAT_COLOR = {Finance:'var(--cat-finance)',Esprit:'var(--cat-esprit)','Santé':'var(--cat-sante)','Productivité':'var(--cat-prod)','Autre':'var(--cat-autre)'};
function habDateToYmd(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function habWeekStart(offset){
  const d = new Date(); d.setHours(0,0,0,0);
  const dow = (d.getDay()+6)%7; // 0 = Monday
  d.setDate(d.getDate() - dow + offset*7);
  return d;
}
function habWeekDates(offset){
  const start = habWeekStart(offset);
  return Array.from({length:7}, (_,i) => { const x = new Date(start); x.setDate(start.getDate()+i); return x; });
}
function habChangeWeek(dir){
  if (dir === 'today') habWeekOffset = 0;
  else habWeekOffset += dir;
  renderHabToolbar();
  renderHabGrid();
}

function renderHabHeader(){
  const TODAY = habDateToYmd(new Date());
  const thisMonth = TODAY.slice(0,7);
  const monthEarned = habitsLog.filter(l => l.date.startsWith(thisMonth)).reduce((s,l) => s + l.reward_eur, 0);
  const totalEarned = habitsLog.reduce((s,l) => s + l.reward_eur, 0);
  const dueToday = habits.filter(h => h.active && isHabitDueToday(h.frequency));
  const doneToday = dueToday.filter(h => habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===TODAY));
  const bestStreak = habits.filter(h=>h.active).reduce((m,h)=>Math.max(m, getStreak(h.id,h.frequency)), 0);

  document.getElementById('habHeader').innerHTML = `
    <div class="hg-header">
      <div class="hg-title">◆ HABITUDES</div>
      <div class="hg-kpis">
        <div><div class="hg-kpi-lbl">Aujourd'hui</div><div class="hg-kpi-val accent">${doneToday.length}/${dueToday.length}</div></div>
        <div><div class="hg-kpi-lbl">Meilleur streak</div><div class="hg-kpi-val gold">🔥 ${bestStreak}</div></div>
        <div><div class="hg-kpi-lbl">Ce mois</div><div class="hg-kpi-val green">+${monthEarned.toFixed(2)}€</div></div>
        <div><div class="hg-kpi-lbl">Total</div><div class="hg-kpi-val">${totalEarned.toFixed(0)}€</div></div>
      </div>
    </div>`;
}

function renderHabToolbar() {
  const week = habWeekDates(habWeekOffset);
  const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const a = week[0], b = week[6];
  const label = a.getMonth() === b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`
    : `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  const dayFilters = [['remaining',"Restantes"],['today',"Aujourd'hui"],['all','Toute']];
  const pills = dayFilters.map(([v,l]) =>
    `<button class="hg-pill${habDayFilter===v?' active':''}" onclick="setHabDayFilter('${v}')">${l}</button>`
  ).join('');
  document.getElementById('habToolbar').innerHTML = `
    <div class="hg-toolbar">
      <div class="hg-day-filters">${pills}</div>
      <div class="hg-weeknav">
        <button class="hg-nav-btn" onclick="habChangeWeek(-1)" title="Semaine précédente">‹</button>
        <span class="hg-week-label">${label}</span>
        <button class="hg-nav-btn" onclick="habChangeWeek(1)" title="Semaine suivante">›</button>
        ${habWeekOffset!==0?`<button class="hg-today-btn" onclick="habChangeWeek('today')">Cette semaine</button>`:''}
      </div>
      <div class="hg-spacer"></div>
      <button class="hg-add-btn" onclick="openHabitModal()">+ Habitude</button>
    </div>`;
}

function renderHabGrid() {
  const TODAY = habDateToYmd(new Date());
  const week = habWeekDates(habWeekOffset);
  const DOW = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const el = document.getElementById('habGrid');

  function applyDayFilter(list) {
    if (habDayFilter === 'today') return list.filter(h => h.active && isHabitDueToday(h.frequency));
    if (habDayFilter === 'remaining') return list.filter(h => h.active && isHabitDueToday(h.frequency) && !habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===TODAY));
    return list;
  }

  let head = `<tr><th class="hg-th-name">Habitude</th>`;
  week.forEach((d,i) => {
    const isToday = habDateToYmd(d) === TODAY;
    head += `<th class="hg-day-head${isToday?' hg-col-today':''}"><div class="hg-day-dow">${DOW[i]}</div><div class="hg-day-num">${d.getDate()}</div></th>`;
  });
  head += `<th class="hg-th-week">Sem.</th></tr>`;

  const CAT_ORDER = ['Santé','Productivité','Esprit','Finance','Autre'];
  let body = '';
  let hasAny = false;

  CAT_ORDER.forEach(cat => {
    const catColor = HAB_CAT_COLOR[cat] || 'var(--text-mid)';
    const filtered = applyDayFilter(habits.filter(h => h.category === cat));
    if (!filtered.length) return;
    hasAny = true;
    filtered.sort((a,b) => a.id - b.id);

    body += `<tr class="hg-sec-row"><td colspan="9" style="color:${catColor}">◆ ${cat.toUpperCase()}</td></tr>`;

    filtered.forEach(h => {
      const color = HAB_CAT_COLOR[h.category] || 'var(--text-mid)';
      const streak = getStreak(h.id, h.frequency);
      const icon = habitIcon(h.title);
      let weekDone = 0;
      const cells = week.map(d => {
        const ds = habDateToYmd(d);
        const done = habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===ds);
        const due = isHabitDueOnDate(h.frequency, d);
        const isFuture = ds > TODAY;
        const isToday = ds === TODAY;
        if (done) weekDone++;
        let cls = 'hg-dot';
        if (done) cls += ' done';
        if (!due) cls += ' notdue';
        if (isFuture) cls += ' future';
        const style = done ? `style="background:${color};border-color:${color}"` : '';
        const onclick = isFuture ? '' : `onclick="toggleHabit(${h.id},'${ds}')"`;
        return `<td class="hg-cell${isToday?' hg-col-today':''}"><div class="${cls}" ${style} ${onclick}></div></td>`;
      }).join('');
      body += `<tr class="hg-row${h.active?'':' paused'}">
      <td class="hg-name-cell" onclick="openHabitModal(${h.id})" title="Éditer">
        <div class="hg-name-inner">
          <span class="hg-name-icon">${icon}</span>
          <div class="hg-name-txt">
            <div class="hg-name-title"><span class="hg-cat-dot" style="background:${color}"></span>${h.title}${h.active?'':' <span class="hg-paused-tag">pause</span>'}</div>
            <div class="hg-name-meta"><span class="hg-name-reward">+${h.reward_eur.toFixed(2)}€</span>${streak>0?`<span class="hg-name-streak">🔥 ${streak}</span>`:''}<span>${freqLabel(h.frequency)}</span></div>
          </div>
        </div>
      </td>
      ${cells}
      <td class="hg-week-cell"><span class="done-cnt">${weekDone}</span></td>
    </tr>`;
    });

    let foot = `<tr class="hg-foot"><td class="hg-foot-lbl"></td>`;
    week.forEach(d => {
      const ds = habDateToYmd(d);
      const cnt = filtered.reduce((s,h) => s + (habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===ds)?1:0), 0);
      const isToday = ds === TODAY;
      foot += `<td class="hg-foot-day${isToday?' hg-col-today':''}"><b>${cnt}</b></td>`;
    });
    const weekEur = filtered.reduce((s,h) =>
      s + week.reduce((ss,d) => ss + (habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===habDateToYmd(d))?h.reward_eur:0), 0), 0);
    foot += `<td class="hg-foot-eur">+${weekEur.toFixed(0)}€</td></tr>`;
    body += foot;
  });

  if (!hasAny) {
    el.innerHTML = `<div class="hg-empty">Aucune habitude pour ce filtre.</div>`;
    return;
  }
  el.innerHTML = `<table class="hg-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// HABIT TOGGLE
// ════════════════════════════════════════════════════
async function toggleHabit(habitId, dateStr) {
  const day = dateStr || td();
  const h = habits.find(h => h.id === habitId);
  if (!h) return;
  const existing = habitsLog.findIndex(l => String(l.habit_id)===String(habitId) && l.date===day);

  if (existing >= 0) {
    // Uncheck — remove from log and rewrite sheet
    habitsLog.splice(existing, 1);
    renderHabitsPage();
    await rewriteHabitsLog();
  } else {
    // Check — append to log
    const entry = { id: Date.now(), habit_id: habitId, date: day, reward_eur: h.reward_eur, category: h.category };
    habitsLog.push(entry);
    renderHabitsPage();
    await appendHabitsLog(entry);
    toast(`✓ +${h.reward_eur.toFixed(2)}€ · ${h.title}`,'ok');
  }
}

function setBoardFilter(f) {
  boardFilter = f;
  document.querySelectorAll('.board-filter').forEach(b => {
    const isActive = (f === 'all' && b.classList.contains('f-all')) ||
                     (f === 'DCB' && b.classList.contains('f-dcb')) ||
                     (f === 'GLD' && b.classList.contains('f-gld')) ||
                     (f === 'Airside' && b.classList.contains('f-air')) ||
                     (f === 'Perso' && b.classList.contains('f-perso'));
    b.classList.toggle('active', isActive);
  });
  render();
}

function filterTasksByBoard(list) {
  if (boardFilter === 'all') return list;
  return list.filter(t => {
    const proj = PROJECTS.find(p => t.title.startsWith(p+' :') || t.title.startsWith(p+':'));
    return proj === boardFilter;
  });
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const now = new Date(); now.setHours(0,0,0,0);
  COLUMNS.forEach(col => {
    const ct = filterTasksByBoard(tasks.filter(t=>t.column===col));
    const el = document.createElement('div');
    el.className='column'; el.dataset.col=col;
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');dropOnCol(col)});
    el.innerHTML=`<div class="col-header"><span class="col-title">${col}</span><span class="col-count">${ct.length}</span></div><div class="col-body" id="cb-${col.replace(/[^a-z]/gi,'X')}"></div>`;
    board.appendChild(el);
    const body=el.querySelector('.col-body');
    if(!ct.length){
      const gifIdx = (Math.abs(col.charCodeAt(0)+col.charCodeAt(col.length-1)) % 3) + 1;
      body.innerHTML = `<div class="col-empty">
        <img class="col-empty-gif" src="gifs/zen${gifIdx}.gif" alt="" loading="lazy">
        <div class="col-empty-txt">VIDE — RESPIRE</div>
      </div>`;
    }
    else ct.forEach(t=>body.appendChild(mkCard(t,now)));
  });
  updateHStats();
}

function mkCard(t, now) {
  const c = document.createElement('div');
  c.className='card'; c.dataset.id=t.id; c.dataset.imp=t.importance; c.draggable=true;
  const proj=PROJECTS.find(p=>t.title.startsWith(p+' :')||t.title.startsWith(p+':'));
  const cls=proj?(proj==='Airside'?'air':proj.toLowerCase()):'';
  const tag=proj?`<div class="card-tag ${cls}">${proj.toUpperCase()}</div>`:'';
  let badge='',ac='';
  if(t.due_date){
    const due=new Date(t.due_date);due.setHours(0,0,0,0);
    const diff=Math.ceil((due-now)/86400000);
    let bc='normal',bl=`J-${diff}`;
    if(diff<0){bc='overdue';bl='EN RETARD';ac='a-danger'}
    else if(diff===0){bc='danger';bl='AUJ.';ac='a-danger'}
    else if(diff===1){bc='danger';bl='DEMAIN';ac='a-danger'}
    else if(diff<=3){bc='warn';bl=`J-${diff}`;ac='a-warn'}
    badge=`<span class="due-badge ${bc}">${bl}</span>`;
  }
  if(ac)c.classList.add(ac);
  let dots='';for(let i=1;i<=5;i++)dots+=`<div class="idot idot-${i}${i<=t.importance?' on':''}"></div>`;
  const notes=t.notes?`<div class="card-notes">${t.notes}</div>`:'';
  c.innerHTML=`${tag}<div class="card-title">${t.title}</div><div class="card-meta"><div class="imp-dots">${dots}</div>${badge}</div>${notes}<div class="card-actions"><button class="btn-done" onclick="completeTask(${t.id})">✓ TERMINER</button><button class="btn-edit" onclick="openModal(${t.id})">ÉDITER</button></div>`;
  c.addEventListener('dragstart',()=>{dragSrcId=t.id;setTimeout(()=>c.classList.add('dragging'),0)});
  c.addEventListener('dragend',()=>{dragSrcId=null;c.classList.remove('dragging')});
  return c;
}

function updateHStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const todayStr=td();
  document.getElementById('hTotal').textContent=tasks.length;
  document.getElementById('hToday').textContent=tasks.filter(t=>t.column==="Aujourd'hui").length;
  document.getElementById('hDoneToday').textContent=allTasks.filter(t=>t.completed_at===todayStr).length;
  document.getElementById('hUrgent').textContent=tasks.filter(t=>{
    if(!t.due_date)return false;const d=new Date(t.due_date);d.setHours(0,0,0,0);return Math.ceil((d-now)/86400000)<=1;
  }).length;
}

function goalHorizonMeta(h){return GOAL_HORIZONS.find(x=>x[0]===h)||['','—','•'];}
function goalHorizonRank(h){const i=GOAL_HORIZONS.findIndex(x=>x[0]===h);return i<0?99:i;}
// Horizon DÉDUIT de la deadline (target_date) — pas de champ manuel
function goalHorizonFromDate(d){
  if(!d)return 'life';
  const today=new Date();today.setHours(0,0,0,0);
  const t=new Date(d+'T00:00:00');
  const days=(t-today)/86400000;
  if(days<=31)return 'month';
  if(days<=92)return 'quarter';
  if(days<=366)return 'annual';
  if(days<=1827)return '5y';
  return 'life';
}

function escapeHtmlG(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeAttrG(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

// checkpoints: texte "[x] titre | récompense" ↔ JSON [{t,d,r}]
function goalParseCheckpointsText(txt){
  return String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^\[([ xX])\]\s*(.*)$/);
    let done=false, body=l;
    if(m){done=m[1].toLowerCase()==='x';body=m[2];}
    const parts=body.split('|');
    return {t:parts[0].trim(), d:done, r:(parts[1]||'').trim()};
  }).filter(c=>c.t);
}
function goalCheckpointsToText(arr){return (arr||[]).map(c=>`[${c.d?'x':' '}] ${c.t}${c.r?` | ${c.r}`:''}`).join('\n');}
function goalCheckpoints(g){
  if(!g.checkpoints)return [];
  try{const a=JSON.parse(g.checkpoints);return Array.isArray(a)?a:[];}catch(e){return [];}
}
function goalProgress(g){
  const cps=goalCheckpoints(g);
  if(cps.length)return Math.round(cps.filter(c=>c.d).length/cps.length*100);
  return Math.max(0,Math.min(100,parseInt(g.progress)||0));
}

// ── Sheets I/O (append-only, dernière ligne par id, tombstone) ──
async function ensureGoalSheet(){
  const sid=cfg.spreadsheetId;
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}?fields=sheets.properties.title`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(r=>r.ok?r.json():{}).catch(()=>({}));
  const titles=(meta.sheets||[]).map(s=>s.properties.title);
  if(titles.includes('goals'))return;
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{method:'POST',headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:'goals'}}}]})});
  await sportPutValues('goals!A1',[GOAL_HEADER,...GOAL_SEED]);
}
async function loadGoals(){
  if(!accessToken)return;
  await ensureGoalSheet();
  const sid=cfg.spreadsheetId;
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/goals!A:M`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(r=>r.ok?r.json():{values:[]}).catch(()=>({values:[]}));
  const rows=r.values||[];
  const parsed=(rows.length<=1?[]:rows.slice(1)).filter(x=>x[0]).map(x=>({
    id:String(x[0]||'').trim(),parent_id:String(x[1]||'').trim(),horizon:String(x[2]||'').trim()||'month',
    category:String(x[3]||'').trim()||'Autre',title:String(x[4]||'').trim(),description:String(x[5]||'').trim(),
    progress:parseInt(x[6])||0,reward:String(x[7]||'').trim(),status:String(x[8]||'').trim()||'active',
    target_date:String(x[9]||'').trim(),icon:String(x[10]||'').trim(),checkpoints:String(x[11]||''),
    level:parseInt(x[12])||0
  }));
  const map={}; parsed.forEach(g=>{map[g.id]=g;});
  goals=Object.values(map).filter(g=>g.status!==GOAL_DELETED);
  goalsLoaded=true;
  await migrateGoalLevels();
}
function goalToRow(g){return [g.id,g.parent_id||'',g.horizon,g.category,g.title,g.description||'',String(g.progress||0),g.reward||'',g.status||'active',g.target_date||'',g.icon||'',g.checkpoints||'',String(g.level||1)];}
// Met à jour EN PLACE la dernière ligne dont la colonne A == key (id/date), sinon ajoute
// une nouvelle ligne. Évite les doublons d'id quand on édite, tout en tolérant les writers
// concurrents (la stratégie sport peut toujours appender ; le load garde la dernière ligne).
async function sheetUpsertByKey(sheet,key,row){
  if(!accessToken) return false;
  const sid=cfg.spreadsheetId;
  let rowNum=0;
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(sheet+'!A:A')}`,{headers:{Authorization:`Bearer ${accessToken}`}}).then(x=>x.ok?x.json():{values:[]});
    const vals=r.values||[];
    for(let i=1;i<vals.length;i++){ if(String((vals[i]||[])[0]||'').trim()===String(key).trim()) rowNum=i+1; }
  }catch(e){ rowNum=0; }
  if(rowNum>=2){
    const resp=await sportPutValues(`${sheet}!A${rowNum}`,[row]);
    return resp.ok;
  }
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(sheet)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const resp=await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({values:[row]})});
  return resp.ok;
}
async function goalUpsert(g){
  const i=goals.findIndex(x=>x.id===g.id);
  if(i>=0)goals[i]=g;else goals.push(g);
  await sheetUpsertByKey('goals',g.id,goalToRow(g));
}
async function goalDelete(id){
  goals=goals.filter(x=>x.id!==id);
  await sheetUpsertByKey('goals',id,[id,'','','','','','0','',GOAL_DELETED,'','','','']);
}

  const hcol=GOAL_HORIZON_COLOR[hz]||'var(--text-mid)';

  return `<div class="gl-card${isDone?' done':''}" style="--gcol:${col}" onclick="openGoalModal('${g.id}')">

      <span class="gl-c-icon">${g.icon||hm[2]}</span>

      <div class="gl-c-acts">
        <button class="gl-child" onclick="event.stopPropagation();openGoalModal(null,'${g.id}')" title="Créer un objectif enfant">+</button>
        ${isDone?'<span class="gl-c-done">✓</span>':`<button class="gl-edit" onclick="event.stopPropagation();openGoalModal('${g.id}')" title="Éditer">✎</button>`}
      </div>
    </div>
    <div class="gl-c-title">${escapeHtmlG(g.title)}</div>
    <div class="gl-c-cat" style="color:${col}">● ${escapeHtmlG(g.category)}</div>
    <div class="gl-prog"><div class="gl-prog-bar" style="width:${prog}%;background:${col}"></div></div>
    <div class="gl-c-foot"><span class="gl-prog-pct">${prog}%</span>${dots}</div>
    ${g.reward?`<div class="gl-reward-mini${isDone?' unlocked':''}" title="${escapeAttrG(g.reward)}">🎁 ${escapeHtmlG(g.reward)}</div>`:''}
  </div>`;
}
function renderGoalsTree(){
  const el=document.getElementById('glTree');
  let list=goals;
  if(goalCatFilter!=='all')list=goals.filter(g=>g.category===goalCatFilter);
  if(!list.length){el.innerHTML=`<div class="gl-empty">Aucun objectif${goalCatFilter!=='all'?' dans cette catégorie':''}. Crée ton premier avec « + Objectif ».</div>`;return;}
  const ids=new Set(list.map(g=>g.id));
  const hr=g=>goalHorizonRank(goalHorizonFromDate(g.target_date));
  const sortFn=(a,b)=>hr(a)-hr(b)||(a.target_date||'zzz').localeCompare(b.target_date||'zzz')||a.title.localeCompare(b.title);
  const childrenOf=pid=>list.filter(g=>g.parent_id===pid).sort(sortFn);
  const roots=list.filter(g=>!g.parent_id||!ids.has(g.parent_id)).sort(sortFn);
  const renderNode=g=>{
    const kids=childrenOf(g.id);
    return `<div class="gl-node">${goalCard(g)}${kids.length?`<div class="gl-link"></div><div class="gl-subtree">${kids.map(renderNode).join('')}</div>`:''}</div>`;
  };
  el.innerHTML=`<div class="gl-forest">${roots.map(renderNode).join('')}</div>`;
  // arbre inversé (racines à droite) → on positionne le scroll à droite
  const f=el.querySelector('.gl-forest');
  if(f)requestAnimationFrame(()=>{f.scrollLeft=f.scrollWidth;});
}

async function toggleGoalCp(id,idx){
  const g=goals.find(x=>x.id===id);if(!g)return;
  const cps=goalCheckpoints(g);if(!cps[idx])return;
  cps[idx].d=!cps[idx].d;
  g.checkpoints=JSON.stringify(cps);
  const prog=goalProgress(g);
  if(prog>=100&&g.status!=='done')g.status='done';
  if(prog<100&&g.status==='done')g.status='active';
  renderGoalsBanner();renderGoalsTree();
  await goalUpsert(g);
}

// niveau depuis la racine (racine = 1), déduit de la chaîne des parents
function goalComputeLevel(g,byId){
  let d=1,cur=g,guard=0;
  while(cur&&cur.parent_id&&guard++<64){
    const p=byId[cur.parent_id];
    if(!p)break;
    cur=p;d++;
  }
  return d;
}
// recalcule le niveau de tous les objectifs ; renvoie ceux dont la valeur a changé
function goalRecomputeLevels(){
  const byId={};goals.forEach(g=>{byId[g.id]=g;});
  const changed=[];
  goals.forEach(g=>{
    const lv=goalComputeLevel(g,byId);
    if(g.level!==lv){g.level=lv;changed.push(g);}
  });
  return changed;
}
// migration : retire l'ancien préfixe « 3 - » des titres et renseigne la colonne level.
// Ne réécrit que les lignes réellement modifiées, donc ne fait rien passé le 1er chargement.
async function migrateGoalLevels(){
  const dirty=new Set();
  goals.forEach(g=>{
    const clean=String(g.title||'').replace(/^\s*\d+\s*[-–—]\s*/,'').trim();
    if(clean&&clean!==g.title){g.title=clean;dirty.add(g);}
  });
  goalRecomputeLevels().forEach(g=>dirty.add(g));
  for(const g of dirty){await sheetUpsertByKey('goals',g.id,goalToRow(g));}
}
// id de l'objectif + tous ses descendants (empêche de choisir un parent qui créerait un cycle)
function goalSubtreeIds(id){
  const out=new Set();if(!id)return out;
  const stack=[id];
  while(stack.length){
    const cur=stack.pop();
    if(out.has(cur))continue;
    out.add(cur);
    goals.forEach(x=>{if(x.parent_id===cur)stack.push(x.id);});
  }
  return out;
}
function openGoalModal(id,parentId){
  const g=id?goals.find(x=>x.id===id):null;
  const pp=(!g&&parentId)?goals.find(x=>x.id===parentId):null;
  const excl=goalSubtreeIds(id);
  const sel=document.getElementById('gfParent');
  sel.innerHTML='<option value="">— Aucun (racine) —</option>'+
    goals.filter(x=>!excl.has(x.id))
      .sort((a,b)=>(a.category||'Autre').localeCompare(b.category||'Autre','fr')||(a.level||1)-(b.level||1)||(a.title||'').localeCompare(b.title||'','fr'))
      .map(x=>`<option value="${x.id}">${escapeAttrG(x.category||'Autre')} - ${x.level||1} - ${escapeAttrG(x.title)}</option>`).join('');
  const cur=g?g.icon:'';
  document.getElementById('gfEmojiGrid').innerHTML=GOAL_EMOJIS.map(e=>`<button type="button" class="gl-emoji${e===cur?' sel':''}" onclick="goalPickEmoji('${e}',this)">${e}</button>`).join('');
  document.getElementById('gfId').value=g?g.id:'';
  document.getElementById('gfTitle').value=g?g.title:'';
  document.getElementById('gfCategory').value=g?g.category:(pp?(pp.category||'Autre'):'Autre');
  document.getElementById('gfParent').value=g?g.parent_id:(pp?pp.id:'');
  document.getElementById('gfIcon').value=cur;
  document.getElementById('gfDesc').value=g?g.description:'';
  document.getElementById('gfProgress').value=g?(g.progress||''):'';
  document.getElementById('gfStatus').value=g?g.status:'active';
  document.getElementById('gfTarget').value=g?g.target_date:(pp?(pp.target_date||''):'');
  document.getElementById('gfReward').value=g?g.reward:'';
  document.getElementById('gfCheckpoints').value=g?goalCheckpointsToText(goalCheckpoints(g)):'';
  document.getElementById('gbtnDel').style.display=g?'block':'none';
  document.getElementById('goalModalTitle').textContent=g?"ÉDITER L'OBJECTIF":(pp?'NOUVEL OBJECTIF ENFANT':'NOUVEL OBJECTIF');
  document.getElementById('goalModal').classList.add('open');
  setTimeout(()=>{
    const t=document.getElementById('gfTitle');
    t.focus();
    t.setSelectionRange(t.value.length,t.value.length);
  },70);
}

async function saveGoal(){
  const title=document.getElementById('gfTitle').value.trim();
  if(!title){document.getElementById('gfTitle').focus();return;}
  const id=document.getElementById('gfId').value||('g'+Date.now());
  const cps=goalParseCheckpointsText(document.getElementById('gfCheckpoints').value);
  const target=document.getElementById('gfTarget').value;
  const parentId=document.getElementById('gfParent').value;
  const par=goals.find(x=>x.id===parentId);
  const g={id,
    parent_id:parentId,
    level:(par?(par.level||1):0)+1,
    horizon:goalHorizonFromDate(target),
    category:document.getElementById('gfCategory').value.trim()||'Autre',
    title,
    description:document.getElementById('gfDesc').value.trim(),
    progress:parseInt(document.getElementById('gfProgress').value)||0,
    reward:document.getElementById('gfReward').value.trim(),
    status:document.getElementById('gfStatus').value,
    target_date:document.getElementById('gfTarget').value,
    icon:document.getElementById('gfIcon').value.trim(),
    checkpoints:cps.length?JSON.stringify(cps):''};
  closeGoalModal();
  showLoad(true);
  await goalUpsert(g);
  // re-rattacher un objectif décale aussi le niveau de tous ses descendants
  for(const c of goalRecomputeLevels()){await sheetUpsertByKey('goals',c.id,goalToRow(c));}
  showLoad(false);
  toast('Objectif enregistré ✓','ok');
  renderGoalsBanner();renderGoalsToolbar();renderGoalsTree();
}
async function deleteGoal(){
  const id=document.getElementById('gfId').value;if(!id)return;
  if(!confirm('Supprimer cet objectif ? (ses sous-objectifs deviendront des racines)'))return;
  closeGoalModal();

function renderHeatmaps() {
  const el = document.getElementById('dashHeatmaps');
  if (!el) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 364);

  // Align start to the Monday on or before cutoff
  const start = new Date(cutoff);
  const dow = start.getDay();
  start.setDate(start.getDate() - (dow === 0 ? 6 : dow - 1));

  // Count completions per category per date
  const catCounts = {};
  CATEGORIES.forEach(c => { catCounts[c] = {}; });
  habitsLog.forEach(l => {
    if (catCounts[l.category]) {
      catCounts[l.category][l.date] = (catCounts[l.category][l.date] || 0) + 1;
    }
  });

  const catRGB = {
    Finance:[252,211,77], Esprit:[167,139,250], Santé:[74,222,128], Productivité:[56,189,248]
  };

  el.innerHTML = CATEGORIES.filter(c => c !== 'Autre').map(cat => {
    const [r,g,b] = catRGB[cat];
    const counts = catCounts[cat];

    const cells = [];
    const d = new Date(start);
    while (d <= today) {
      const ds = d.toISOString().split('T')[0];
      const inRange = d >= cutoff;
      cells.push({ ds, count: inRange ? (counts[ds] || 0) : -1 });
      d.setDate(d.getDate() + 1);
    }
    while (cells.length % 7 !== 0) cells.push({ ds:'', count:-1 });

    const cellsHtml = cells.map(({ds, count}) => {
      let bg;
      if (count < 0) bg = 'transparent';
      else if (count === 0) bg = 'rgba(255,255,255,0.04)';
      else { const t = Math.min((count-1)/3, 1); bg = `rgba(${r},${g},${b},${0.25 + t*0.75})`; }
      const tip = ds ? (count > 0 ? `${ds} · ${count} habitude${count>1?'s':''}` : ds) : '';
      return `<div class="hm-cell" style="background:${bg}" title="${tip}"></div>`;
    }).join('');

    const legendHtml = [0,1,2,3,4].map(n => {
      const bg = n === 0 ? 'rgba(255,255,255,0.04)' : `rgba(${r},${g},${b},${0.25+(n-1)/3*0.75})`;
      return `<div class="hm-cell" style="background:${bg}"></div>`;
    }).join('');

    return `<div class="hm-box">
      <div class="hm-header">
        <span class="hm-title" style="color:rgba(${r},${g},${b},0.9)">${cat.toUpperCase()}</span>
        <div class="hm-legend">${legendHtml}<span class="hm-legend-label">1 → 4+</span></div>
      </div>
      <div class="hm-scroll"><div class="hm-grid">${cellsHtml}</div></div>
    </div>`;
  }).join('');
}

function parseTradeDate(raw) {
  // Returns "YYYY-MM-DD HH:mm:ss" for correct lexicographic sort (or "YYYY-MM-DD" if no time)
  if (!raw) return '';
  const s = String(raw).trim();
  // DD/MM/YYYY, HH:mm:ss  or  DD/MM/YYYY HH:mm:ss  (confirmed format for cols C & E)
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m1) {
    const [,d,mo,y,h,min,sec='00'] = m1;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')} ${h.padStart(2,'0')}:${min}:${sec}`;
  }
  // Excel serial number (e.g. 45123)
  if (/^\d{5}$/.test(s)) {
    const d = new Date((parseInt(s) - 25569) * 86400000);
    return d.toISOString().split('T')[0];
  }
  // DD/MM/YYYY (without time)
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
    const [d,mo,y] = s.split('/'); return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // Already ISO-like
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,19);
  const d = new Date(s);
  return isNaN(d) ? s.slice(0,19) : d.toISOString().replace('T',' ').slice(0,19);
}
// Display-only: strips time part for chart labels

async function loadCryptoData() {
  if (!accessToken) return;
  try {
    const r = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${CRYPTO_SHEET_ID}/values/Data!A:Z`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const rows = data.values || [];
    if (rows.length < 2) { cryptoTrades = []; cryptoLoaded = true; return; }

    // Confirmed column layout (user):
    //   B=1  buy price  |  C=2  open datetime  |  E=4  close datetime
    //   F=5  qty/amount |  G=6  net P&L (after tax) |  H=7 % gain/loss
    //   M=12 current qty | "Position Finale" = auto-detected by header
    const hdr = rows[0].map(h => String(h).toLowerCase().trim());
    const colIdx = (...names) => { for (const n of names) { const i = hdr.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
    const colMap = {
      date:      2,  // col C — confirmed DD/MM/YYYY, HH:mm:ss
      symbol:    colIdx('symbol','crypto','coin','pair','asset','devise','paire'),
      action:    colIdx('action','side','type','direction','sens','order'),
      invested:  colIdx('invest','amount','capital','montant','buy_amount','mise'),
      net:       6,  // col G — net P&L after tax
      pct:       7,  // col H — % gain/loss (confirmed by user)
      posFinale: colIdx('position finale','pos finale','final position','valeur finale','position_finale','pos_finale'),
    };

    const parseNum = raw => parseFloat(String(raw||'').replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;

    // Detect SellingDate & SellingPrice columns to filter out placeholder "X" rows
    const iSellingDate  = colIdx('sellingdate','selling date','closedate','close date','date de vente','date vente','date_close','date_vente');
    const iSellingPrice = colIdx('sellingprice','selling price','closeprice','close price','prix de vente','prix vente','prix_vente','close price');
    const cellIsX = (r, col) => col >= 0 && String(r[col] || '').trim().toUpperCase() === 'X';

    cryptoTrades = rows.slice(1)
      .filter(r => r.some(c => c !== ''))
      .filter(r => !cellIsX(r, iSellingDate) && !cellIsX(r, iSellingPrice))
      .map((r, i) => {
      // Symbol: clean up pair notation (ADA/USDT → ADA)
      const rawSym = (colMap.symbol >= 0 ? r[colMap.symbol] || '' : '').toUpperCase().replace(/[\/-]?USDT?$|[\/-]?BUSD$|[\/-]?USD$/,'').trim();
      const sym = CRYPTOS.find(c => rawSym.includes(c.sym))?.sym || (rawSym || 'ADA');
      const posFinaleRaw = colMap.posFinale >= 0 ? r[colMap.posFinale] : '';
      const posFinale = posFinaleRaw !== '' && posFinaleRaw != null ? parseNum(posFinaleRaw) : null;
      return {
        idx:       i,
        date:      parseTradeDate(r[2] || ''),   // col C — open datetime
        dateClose: parseTradeDate(r[4] || ''),   // col E — close datetime
        symbol:    sym,
        action:    colMap.action >= 0 ? r[colMap.action] || '' : '',
        price:     parseNum(r[1]),               // col B — NbAction (quantity bought)
        colD:      parseNum(r[3]),               // col D — Buying Price (price per coin) — B×D = initial investment
        colF:      parseNum(r[5]),               // col F — current qty/amount
        net:       parseNum(r[6]),               // col G — net P&L after tax
        pct:       parseNum(r[7]),               // col H — % gain/loss
        invested:  colMap.invested >= 0 ? parseNum(r[colMap.invested]) : 0,
        colM:      parseNum(r[12]),              // col M — current qty (M×F = current position value)
        posFinale,                               // "Position Finale" column (auto-detected)
      };
    }).filter(t => t.symbol);

    cryptoLoaded = true;
  } catch(e) {
    console.error('Crypto load error', e);
    toast('Erreur chargement données CryptoBot', 'err');
    cryptoLoaded = true;
  }
}

// ════════════════════════════════════════════════════
// CRYPTOBOT — UTILITIES
// ════════════════════════════════════════════════════
// P&L for one crypto (or global):
//   last_row(M × F)  −  first_row(B × D)
//   = current position value − initial investment value
//   Falls back to summing col G if both sides are 0 (missing data)
function calcNetPnL(sym) {
  if (!sym) return CRYPTOS.reduce((s, c) => s + calcNetPnL(c.sym), 0);
  const trades = cryptoTrades.filter(t => t.symbol === sym && t.date);
  if (!trades.length) return 0;
  const sorted = [...trades].sort((a,b) => a.date < b.date ? -1 : 1);
  const first = sorted[0];
  const last  = sorted[sorted.length - 1];
  const initialVal  = (first.price || 0) * (first.colD || 0);  // B × D — first row
  const currentVal  = (last.colM  || 0) * (last.colF  || 0);   // M × F — last row
  if (currentVal > 0 || initialVal > 0) return currentVal - initialVal;
  // Fallback: sum col G
  return trades.reduce((s, t) => s + t.net, 0);
}

function getCryptoStats(sym) {
  const list = sym ? cryptoTrades.filter(t => t.symbol === sym) : cryptoTrades;

  // Win / loss determined by col H (%)
  const winList  = list.filter(t => t.pct > 0);
  const lossList = list.filter(t => t.pct < 0);

  // Avg % gain / loss — col H as confirmed
  const avgGainPct = winList.length  ? winList.reduce((s,t)  => s + t.pct, 0) / winList.length  : null;
  const avgLossPct = lossList.length ? lossList.reduce((s,t) => s + t.pct, 0) / lossList.length : null;

  // P&L via Position Finale
  const totalNet = calcNetPnL(sym || null);

  // P&L % from first to last Buying Price (col D) of recorded trades
  let pricePct = null;
  const withPrice = list.filter(t => t.colD > 0);
  if (withPrice.length >= 2) {
    const sortedP = [...withPrice].sort((a,b) => a.idx - b.idx);
    const p0 = sortedP[0].colD, pn = sortedP[sortedP.length - 1].colD;
    if (p0 > 0) pricePct = (pn - p0) / p0 * 100;
  }

  const totalInvested = list.reduce((s, t) => s + t.invested, 0);
  return {
    count: list.length, wins: winList.length, losses: lossList.length,
    winRate: list.length ? Math.round(winList.length / list.length * 100) : 0,
    totalNet, totalInvested,
    pct: totalInvested > 0 ? totalNet / totalInvested * 100 : null,
    avgNet: list.length ? list.reduce((s,t) => s + t.net, 0) / list.length : 0,
    avgGainPct, avgLossPct, pricePct,
  };
}

function calcPortfolioValue() {
  // For each crypto: last row (by date) → col M × col F = position value
  let total = 0;
  CRYPTOS.forEach(c => {
    const trades = cryptoTrades.filter(t => t.symbol === c.sym && t.date);
    if (!trades.length) return;
    const last = [...trades].sort((a,b) => a.date < b.date ? -1 : 1).at(-1);
    const val = (last.colM || 0) * (last.colF || 0);
    if (val > 0 && isFinite(val)) total += val;
  });
  return total;
}

function calcFirstPosFinale() {
  // Total initial investment = Σ first_row(B×D) per crypto (matches calcNetPnL reference)
  let total = 0;
  CRYPTOS.forEach(c => {
    const trades = cryptoTrades.filter(t => t.symbol === c.sym && t.date);
    if (!trades.length) return;
    const first = [...trades].sort((a,b) => a.date < b.date ? -1 : 1)[0];
    const val = (first.price || 0) * (first.colD || 0);
    if (val > 0 && isFinite(val)) total += val;
  });
  return total > 0 ? total : null;
}

let cryptoTradesAll = []; // master copy (untouched)
const LS_CRP_FILTER = 'kanban_crp_filter';
const CRP_FILTERS = [
  { id:'intro',  label:'INTRO',  from:'',                      to:'2026-05-23 00:00:00' },
  { id:'2026',   label:'2026',   from:'2026-05-23 00:00:00',   to:'2026-12-31 23:59:59' },
  { id:'2027',   label:'2027',   from:'2027-01-01 00:00:00',   to:'2027-12-31 23:59:59' },
  { id:'2028',   label:'2028',   from:'2028-01-01 00:00:00',   to:'2028-12-31 23:59:59' },
  { id:'2029',   label:'2029',   from:'2029-01-01 00:00:00',   to:'2029-12-31 23:59:59' },
  { id:'all',    label:'TOUT',   from:'',                      to:'' },
];
let cryptoFilter = null;

function detectDefaultCryptoFilter() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const nowStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  for (const f of CRP_FILTERS) {
    if (f.id === 'all') continue;
    const okFrom = !f.from || nowStr >= f.from;
    const okTo   = !f.to   || nowStr <= f.to;
    if (okFrom && okTo) return f.id;
  }
  return 'all';
}

function tradeInFilter(t, f) {
  if (f.id === 'all') return true;
  const d = t.date || '';
  if (!d) return false;
  if (f.from && d < f.from) return false;
  if (f.to   && d > f.to)   return false;
  return true;
}

function applyCryptoFilter() {
  const f = CRP_FILTERS.find(x => x.id === cryptoFilter) || CRP_FILTERS[CRP_FILTERS.length-1];
  cryptoTrades = cryptoTradesAll.filter(t => tradeInFilter(t, f));
}

function setCryptoFilter(id) {
  cryptoFilter = id;
  localStorage.setItem(LS_CRP_FILTER, id);
  applyCryptoFilter();
  // Destroy charts to force rebuild on new dataset
  Object.values(cryptoCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  cryptoCharts = {};
  renderCryptoBanner();
  renderCryptoCards();
  renderCryptoChartsA();
  renderCryptoChartsB();
  renderCryptoTable();
  renderCryptoFilters();
}

function renderCryptoFilters() {
  const el = document.getElementById('crpFilters');
  if (!el) return;
  const buttons = CRP_FILTERS.map(f => {
    const count = cryptoTradesAll.filter(t => tradeInFilter(t, f)).length;
    const cls = cryptoFilter === f.id ? 'crp-filter active' : 'crp-filter';
    return `<button class="${cls}" onclick="setCryptoFilter('${f.id}')">${f.label}<span class="crp-filter-count">(${count})</span></button>`;
  }).join('');
  el.innerHTML = `<span class="crp-filter-lbl">PÉRIODE</span>${buttons}`;
}

async function renderCryptoBot() {
  if (!cryptoLoaded) {
    showLoad(true);
    await loadCryptoData();
    // Capture master copy + init filter
    cryptoTradesAll = cryptoTrades.slice();
    cryptoFilter = localStorage.getItem(LS_CRP_FILTER) || detectDefaultCryptoFilter();
    applyCryptoFilter();
    await fetchCryptoPrices();
    showLoad(false);
    // HODL comparison in background (may be slow / rate-limited)
    fetchHodlComparison().then(() => { try { renderCryptoChartsB(); } catch(e){} });
  }
  renderCryptoFilters();
  renderCryptoBanner();
  renderCryptoCards();
  renderCryptoChartsA();
  renderCryptoChartsB();
  renderCryptoTable();
}

async function reloadCryptoData() {
  cryptoLoaded = false; cryptoPrices = {}; cryptoTrades = []; cryptoTradesAll = [];
  Object.values(cryptoCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  cryptoCharts = {};
  renderCryptoBot();
}

// First actual purchase price (col D = Buying Price of the first chronological trade)
// Note: in the source sheet, col B = NbAction (quantity), col D = Buying Price.
// Sorted by row index in the sheet (user enters trades chronologically) — robust
// vs broken date parsing on some rows.
function firstBuyPrice(sym) {
  const buys = cryptoTrades.filter(t => t.symbol === sym && t.colD > 0 && t.price > 0);
  if (!buys.length) return null;
  buys.sort((a, b) => a.idx - b.idx);
  return buys[0].colD;
}

// ────────────────────────────────────────────────────
// Shared helper: annotate every posFinale-bearing trade
// with its P&L delta (posFinale − prev posFinale for that crypto,
// prev = 0 for the very first trade of each crypto).
// Falls back to t.net when posFinale column absent from sheet.
// ────────────────────────────────────────────────────
function computeTradePnLs() {
  const withPF = cryptoTrades.filter(t => t.posFinale !== null && t.date)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if (!withPF.length) {
    // Fallback: annotate all dated trades with t.net as delta
    return [...cryptoTrades].filter(t => t.date)
      .sort((a,b) => a.date < b.date ? -1 : 1)
      .map(t => ({ ...t, pnlDelta: t.net, usingFallback: true }));
  }
  const prevPF = {};
  return withPF.map(t => {
    let prev;
    if (prevPF[t.symbol] === undefined) {
      // First trade of this crypto: use initial investment (B × D) as reference
      // so the delta reflects the real gain/loss vs the purchase price, not vs 0
      prev = (t.price || 0) * (t.colD || 0);
    } else {
      prev = prevPF[t.symbol];
    }
    const pnlDelta = t.posFinale - prev;
    prevPF[t.symbol] = t.posFinale;
    return { ...t, pnlDelta };
  });
}

// Bot ROI% for chart B2: calcNetPnL / first posFinale for that crypto
function calcBotRoiPct(sym) {
  const trades = cryptoTrades.filter(t => t.symbol === sym && t.posFinale !== null && t.date)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if (!trades.length) { const g = getCryptoStats(sym); return g.pct; }
  const firstPF = trades[0].posFinale;
  if (!firstPF) return null;
  return calcNetPnL(sym) / Math.abs(firstPF) * 100;
}

function renderCryptoChartsA() {
  // Chart A: Cumulative P&L line (+ gif on the right)
  ['cCrpCumul'].forEach(id => { if (cryptoCharts[id]) { try { cryptoCharts[id].destroy(); } catch(e){} } });

  document.getElementById('crpChartsA').innerHTML = `
    <div class="crp-evol-row">
      <div class="crp-box">
        <div class="crp-box-hdr"><span class="crp-box-ttl">ÉVOLUTION CUMULATIVE DU P&L (POSITION FINALE)</span></div>
        <div class="crp-wrap tall"><canvas id="cCrpCumul"></canvas></div>
      </div>
      <div class="crp-evol-gif"><img src="gifs/zen1.gif" alt="" loading="lazy"></div>
    </div>`;

  // A1 — Cumulative: walk through pnlDelta in chronological order
  const tradePnLs = computeTradePnLs();
  let cumul = 0;
  const cumulLabels = [], cumulVals = [], cumulPtColors = [];
  tradePnLs.forEach(t => {
    cumul = parseFloat((cumul + t.pnlDelta).toFixed(4));
    cumulLabels.push(dateLabel(t.date));
    cumulVals.push(parseFloat(cumul.toFixed(2)));
    const cc = CRYPTOS.find(x => x.sym === t.symbol);
    cumulPtColors.push(cc ? `rgba(${cc.rgb},0.9)` : 'rgba(124,106,255,0.9)');
  });

  if (cumulVals.length) {
    cryptoCharts.cCrpCumul = new Chart(document.getElementById('cCrpCumul'), {
      type: 'line',
      data: { labels: cumulLabels, datasets: [{ data: cumulVals,
        borderColor: 'rgba(124,106,255,0.9)', backgroundColor: 'rgba(124,106,255,0.06)',
        borderWidth: 2, fill: true, tension: 0.3,
        pointBackgroundColor: cumulPtColors,
        pointRadius: cumulVals.length > 80 ? 2 : 4, pointHoverRadius: 6 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip:{ callbacks:{
          label: i => ` Cumul P&L: ${i.raw>=0?'+':''}${i.raw.toFixed(2)}$`,
          afterLabel: i => {
            const t = tradePnLs[i.dataIndex];
            if (!t) return '';
            const delta = t.pnlDelta >= 0 ? `+${t.pnlDelta.toFixed(2)}` : t.pnlDelta.toFixed(2);
            const pf = t.posFinale != null ? ` · Pos: ${t.posFinale.toFixed(2)}$` : '';
            return ` Δ ${delta}$${pf}`;
          },
          title: items => { const t = tradePnLs[items[0].dataIndex]; return t ? `${t.symbol} · ${t.date||''}` : ''; },
        }}},
        scales: {
          x: { ticks:{font:{family:'Space Mono',size:8},maxTicksLimit:10}, grid:{color:'#1c1c28'} },
          y: { ticks:{font:{family:'Space Mono',size:9},callback:v=>`${v}$`}, grid:{color:'#1c1c28'} }
        }
      }
    });
  }

}

function renderCryptoTable() {
  const el = document.getElementById('crpTradeTable');
  if (!cryptoTrades.length) {
    el.innerHTML = '<div class="crp-empty">AUCUN TRADE CHARGÉ</div>'; return;
  }
  const sorted = [...cryptoTrades].sort((a,b) => {
    if (!a.date&&!b.date) return 0; if (!a.date) return 1; if (!b.date) return -1;
    return a.date > b.date ? -1 : 1;
  });
  const rows = sorted.slice(0, 100).map(t => {
    const cc = CRYPTOS.find(x => x.sym === t.symbol);
    const cls = t.net >= 0 ? 'crp-pos' : 'crp-neg';
    return `<tr>
      <td>${t.date ? dateLabel(t.date) : '—'}</td>
      <td style="color:${cc?.hex||'var(--text)'};font-weight:700">${t.symbol}</td>
      <td style="color:var(--text-dim)">${t.action||'—'}</td>
      <td>${t.invested > 0 ? t.invested.toFixed(2)+'$' : '—'}</td>
      <td class="${cls}">${crpFmt(t.net)}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="crp-table">
    <thead><tr><th>DATE</th><th>CRYPTO</th><th>ACTION</th><th>INVESTI</th><th>NET P&L</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>${sorted.length > 100 ? `<div class="crp-hodl-note" style="text-align:right;margin-top:0.5rem">Affichage des 100 trades les plus récents sur ${sorted.length}</div>` : ''}`;
}

let finDebugInfo = { sheetTitles: [], comptesSheet: null, financeSheet: null, error: null };

async function loadFinancesData() {
  if (!accessToken) return;
  try {
    // Step 1: fetch spreadsheet metadata to get real sheet names
    const metaR = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}?fields=sheets.properties.title`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!metaR.ok) {
      finDebugInfo.error = `Spreadsheet inaccessible (HTTP ${metaR.status}) — vérifie l'ID et les permissions`;
      finLoaded = true; return;
    }
    const meta = await metaR.json();
    const titles = (meta.sheets || []).map(s => s.properties.title);
    finDebugInfo.sheetTitles = titles;

    // Step 2: fuzzy-match sheet names
    const findSheet = (...names) =>
      titles.find(t => names.some(n => t.toLowerCase().trim() === n.toLowerCase().trim())) ||
      titles.find(t => names.some(n => t.toLowerCase().includes(n.toLowerCase()))) ||
      null;
    const comptesSheet  = findSheet('Comptes','Compte','Accounts','comptes');
    const financeSheet  = findSheet('Finances','Finance','Dépenses','Depenses','depenses','Expenses','Budget');
    finDebugInfo.comptesSheet = comptesSheet;
    finDebugInfo.financeSheet = financeSheet;

    if (!comptesSheet && !financeSheet) {
      finDebugInfo.error = `Aucun onglet "Comptes" ou "Finance" trouvé`;
      finLoaded = true; return;
    }

    // Step 3: fetch data from matched sheets
    const fetches = [];
    if (comptesSheet) fetches.push(
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}/values/${encodeURIComponent(comptesSheet)}!A:Z`,
        { headers: { Authorization: `Bearer ${accessToken}` } })
    );
    if (financeSheet) fetches.push(
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${FIN_SHEET_ID}/values/${encodeURIComponent(financeSheet)}!A:Z`,
        { headers: { Authorization: `Bearer ${accessToken}` } })
    );
    const results = await Promise.all(fetches);
    let ri = 0;
    if (comptesSheet) { const r = results[ri++]; if (r.ok) { const d = await r.json(); finComptes  = d.values || []; } }
    if (financeSheet) { const r = results[ri++]; if (r.ok) { const d = await r.json(); finDepenses = d.values || []; } }
    finLoaded = true;
  } catch(e) {
    finDebugInfo.error = String(e);
    console.error('Finances load error', e);
    toast('Erreur chargement données Finances', 'err');
    finLoaded = true;
  }
}

// ════════════════════════════════════════════════════
// FINANCES — PARSING
// ════════════════════════════════════════════════════
function finParseNum(raw) {
  return parseFloat(String(raw||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;
}

function finParseDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY (common in French sheets)
  const m1 = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if (m1) return `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
  // YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // Excel/Sheets serial number with optional decimal time part (e.g. "45993" or "45993.5")
  if (/^\d{4,6}(\.\d+)?$/.test(s)) {
    const d = new Date((parseFloat(s) - 25569) * 86400000);
    if (!isNaN(d)) return d.toISOString().split('T')[0];
  }
  // Generic fallback
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().split('T')[0];
}

function parseComptes() {
  if (!finComptes.length) return [];
  // Always skip row 0 (confirmed header: "Compte / Valeur init. / Valeur 2026")
  // col A (0)=nom, col B (1)=valeur initiale début 2026, col C (2)=valeur actuelle
  return finComptes.slice(1)
    .filter(r => r.some(c => c !== ''))
    .map(r => ({
      name:    String(r[0] || '').trim(),
      initial: finParseNum(r[1]),   // col B — référence début 2026
      current: finParseNum(r[2]),   // col C — valeur actuelle
      type:    String(r[3] || '').trim(),
    }))
    .filter(c => c.name && !/^total$/i.test(c.name));
}

function parseDepenses() {
  if (!finDepenses.length) return [];
  // Confirmed column layout (user):
  //   A (0) = Date | B (1) = Description | C (2) = Montant (€)
  //   D (3) = Type/Catégorie | E (4) = Compte | F (5) = Mois
  // Always skip row 0 (header row)
  return finDepenses.slice(1)
    .filter(r => r.some(c => c !== ''))
    .map(r => ({
      date:   finParseDate(r[0]) || '',
      desc:   String(r[1] || '').trim(),
      amount: finParseNum(r[2]),
      cat:    String(r[3] || '').trim() || 'Autre',
      compte: String(r[4] || '').trim(),
      mois:   String(r[5] || '').trim(),
    }))
    .filter(d => d.date);
}

// ════════════════════════════════════════════════════
// FINANCES — RENDER ORCHESTRATOR
// ════════════════════════════════════════════════════
async function renderFinancesPage() {
  if (!finLoaded) {
    showLoad(true);
    // Load Finances sheet + crypto data (needed for portfolio value) in parallel
    await Promise.all([
      loadFinancesData(),
      cryptoLoaded ? Promise.resolve() : loadCryptoData(),
      // Fetch live USD→EUR rate
      fetch('https://open.er-api.com/v6/latest/USD')
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d?.rates?.EUR) usdToEur = d.rates.EUR; })
        .catch(() => {}), // keep fallback 0.92 on error
    ]);
    showLoad(false);
  }
  const comptes  = parseComptes();
  const depenses = parseDepenses();

  // Override the crypto account's current value with CryptoBot portfolio (USD → EUR)
  const cryptoPortfolioEur = calcPortfolioValue() * usdToEur;
  if (cryptoPortfolioEur > 0) {
    const cryptoCompte = comptes.find(c =>
      /crypto/i.test(c.name) || /bot/i.test(c.name)
    );
    if (cryptoCompte) cryptoCompte.current = parseFloat(cryptoPortfolioEur.toFixed(2));
  }

  renderFinBanner(comptes, depenses);
  renderFinAccounts(comptes);
  renderFinCharts(comptes, depenses);
  renderFinMilestone(comptes, depenses);
  renderFinTable(depenses);
}

// FINANCES — BANNER KPIs
// ════════════════════════════════════════════════════
function renderFinBanner(comptes, depenses) {
  const totalCurrent = comptes.reduce((s, c) => s + c.current, 0);
  const totalInitial = comptes.reduce((s, c) => s + c.initial, 0);
  const deltaEur = totalCurrent - totalInitial;
  const deltaPct = totalInitial > 0 ? deltaEur / totalInitial * 100 : 0;

  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  // If current month has no data, fall back to the most recent month present
  // Dépenses = negative amounts only
  let monthDeps = depenses.filter(d => d.date.startsWith(thisMonth) && d.amount < 0);
  let shownMonth = thisMonth;
  if (!monthDeps.length && depenses.length) {
    const months = [...new Set(depenses.filter(d => d.amount < 0).map(d => d.date.slice(0,7)))].filter(Boolean).sort();
    shownMonth = months[months.length - 1] || thisMonth;
    monthDeps  = depenses.filter(d => d.date.startsWith(shownMonth) && d.amount < 0);
  }
  const totalMonthDep = monthDeps.reduce((s, d) => s + Math.abs(d.amount), 0);
  const MONTHS_FR2 = ['janv.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];
  const shownMonthLabel = (() => { const [y,m] = shownMonth.split('-'); return `${MONTHS_FR2[parseInt(m)-1]} ${y}`; })();

  const monthsElapsed = Math.max(1, (now - FIN_START_DATE) / (1000*60*60*24*30.44));
  const mthSavings = deltaEur / monthsElapsed;

  const fmtEur = (v, sign=true) => {
    const s = sign && v >= 0 ? '+' : '';
    return `${s}${v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})} €`;
  };
  const pct1M  = Math.min(100, totalCurrent / FIN_GOAL * 100);
  const remain = FIN_GOAL - totalCurrent;

  document.getElementById('finBanner').innerHTML = `
    <div class="fin-banner">
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Patrimoine Total</div>
        <div class="fin-kpi-val" style="color:var(--accent)">${fmtEur(totalCurrent,false)}</div>
        <div class="fin-kpi-sub">Ref. janv. 2026 : ${fmtEur(totalInitial,false)}</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Plus-value depuis janv. 2026</div>
        <div class="fin-kpi-val" style="color:${deltaEur>=0?'var(--green)':'var(--danger)'}">${fmtEur(deltaEur)}</div>
        <div class="fin-kpi-sub">${deltaEur>=0?'+':''}${deltaPct.toFixed(1)}% · moy. ${fmtEur(mthSavings)}/mois</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Dépenses · ${shownMonthLabel}</div>
        <div class="fin-kpi-val" style="color:var(--warn)">${fmtEur(totalMonthDep,false)}</div>
        <div class="fin-kpi-sub">${monthDeps.length} opération${monthDeps.length>1?'s':''}${shownMonth!==thisMonth?' · (dernier mois avec données)':''}</div>
      </div>
      <div class="fin-kpi">
        <div class="fin-kpi-lbl">Objectif 1 000 000 €</div>
        <div class="fin-kpi-val" style="color:var(--accent)">${pct1M.toFixed(2)}%</div>
        <div class="fin-kpi-sub">${fmtEur(remain,false)} restants${mthSavings>0?' · ~'+Math.round(remain/mthSavings)+' mois':''}</div>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════
// FINANCES — CHARTS
// ════════════════════════════════════════════════════
function renderFinCharts(comptes, depenses) {
  Object.values(finCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  finCharts = {};

  const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

  // Map each compte name → palette color (same as account cards)
  const compteColorMap = {};
  comptes.forEach((c, i) => { compteColorMap[c.name] = FIN_PALETTE[i % FIN_PALETTE.length]; });
  // Fuzzy match: find color for a compte string from depenses
  const compteColor = name => {
    if (compteColorMap[name]) return compteColorMap[name];
    const found = Object.keys(compteColorMap).find(k =>
      k.toLowerCase().includes(name.toLowerCase()) || name.toLowerCase().includes(k.toLowerCase())
    );
    return found ? compteColorMap[found] : '#94a3b8';
  };

  // All individual dates sorted ascending (col A — no aggregation)
  const allDates   = [...new Set(depenses.map(d => d.date).filter(Boolean))].sort();
  // All unique comptes (each = one stacked area)
  const allComptes = [...new Set(depenses.map(d => d.compte).filter(Boolean))];
  // Category totals split by sign: negative = dépense, positive = gain
  const byCatDep = {}, byCatGain = {};
  depenses.forEach(d => {
    const cat = d.cat || 'Autre';
    if (d.amount < 0) byCatDep[cat]  = (byCatDep[cat]  || 0) + Math.abs(d.amount);
    if (d.amount > 0) byCatGain[cat] = (byCatGain[cat] || 0) + d.amount;
  });
  const catsDep  = Object.keys(byCatDep).sort((a,b)  => byCatDep[b]  - byCatDep[a]);
  const catsGain = Object.keys(byCatGain).sort((a,b) => byCatGain[b] - byCatGain[a]);

  // Short label for X axis: "14 jan", "2 fév" etc.
  const shortDateLabel = iso => {
    const [,mo,day] = iso.split('-');
    return `${parseInt(day)} ${MONTHS_FR[parseInt(mo)-1]}`;
  };

  // Build account breakdown HTML — sorted descending by current value
  const totalCurrent  = comptes.reduce((s,c) => s + (c.current||0), 0);
  const sortedComptes = [...comptes].filter(c => c.current > 0)
                          .sort((a,b) => b.current - a.current);
  // Assign stable colors based on sorted order
  const breakdownBar = sortedComptes.map((c, i) => {
    const pct = totalCurrent > 0 ? c.current / totalCurrent * 100 : 0;
    const col  = FIN_PALETTE[i % FIN_PALETTE.length];
    return `<div title="${c.name}: ${c.current.toLocaleString('fr-FR',{maximumFractionDigits:0})} € (${pct.toFixed(1)}%)"
                 style="width:${pct}%;background:${col};transition:width 0.4s"></div>`;
  }).join('');
  const breakdownLegend = sortedComptes.map((c, i) => {
    const pct = totalCurrent > 0 ? c.current / totalCurrent * 100 : 0;
    const col  = FIN_PALETTE[i % FIN_PALETTE.length];
    return `<div style="display:flex;align-items:center;gap:0.35rem;min-width:0">
      <div style="width:8px;height:8px;flex-shrink:0;background:${col};border-radius:2px"></div>
      <span style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
            title="${c.name}">${c.name}</span>
      <span style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text);margin-left:auto;flex-shrink:0">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');

  document.getElementById('finCharts').innerHTML = `
    <div class="fin-section-lbl">ANALYSE DES DÉPENSES</div>
    <div class="fin-charts">
      <div class="fin-box" style="display:flex;flex-direction:column">
        <div class="fin-box-hdr">
          <span class="fin-box-ttl">ÉVOLUTION DU PATRIMOINE</span>
          <button class="crp-btn" onclick="reloadFinancesData()">↻ RAFRAÎCHIR</button>
        </div>
        <div class="fin-wrap" style="flex:1;min-height:0"><canvas id="finChartArea"></canvas></div>
      </div>
      <div class="fin-box" style="display:flex;flex-direction:column">
        <div class="fin-box-hdr"><span class="fin-box-ttl">RÉPARTITION DES COMPTES</span></div>
        <div style="height:14px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:1rem">${breakdownBar}</div>
        <div style="display:flex;flex-direction:column;gap:0.55rem;flex:1">${breakdownLegend}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.85rem">
        <div class="fin-box" style="flex:1">
          <div class="fin-box-hdr"><span class="fin-box-ttl" style="color:var(--danger)">▼ DÉPENSES PAR CATÉGORIE</span></div>
          <div class="fin-wrap" style="height:155px"><canvas id="finChartDep"></canvas></div>
        </div>
        <div class="fin-box" style="flex:1">
          <div class="fin-box-hdr"><span class="fin-box-ttl" style="color:var(--green)">▲ GAINS PAR CATÉGORIE</span></div>
          <div class="fin-wrap" style="height:155px"><canvas id="finChartGain"></canvas></div>
        </div>
      </div>
    </div>`;

  Chart.defaults.color = '#60607a';

  // ── Single-line patrimoine evolution (total across all comptes) ──
  const ctxArea = document.getElementById('finChartArea')?.getContext('2d');
  if (ctxArea && allDates.length) {
    const getInitial = compteName => {
      const exact = comptes.find(c => c.name === compteName);
      if (exact) return exact.initial;
      const fuzzy = comptes.find(c =>
        c.name.toLowerCase().includes(compteName.toLowerCase()) ||
        compteName.toLowerCase().includes(c.name.toLowerCase())
      );
      return fuzzy ? fuzzy.initial : 0;
    };

    // Starting point = ALL comptes from the Comptes sheet (not just those in Finance col E).
    // Accounts that have no transactions are still part of the patrimoine.
    const runningMap = {};
    comptes.forEach(c => { runningMap[c.name] = c.initial || 0; });
    // Also seed any compte present in Finance but not in Comptes sheet (initial = 0)
    allComptes.forEach(c => { if (!(c in runningMap)) runningMap[c] = 0; });
    const totalInitialAll = Object.values(runningMap).reduce((s,v) => s+v, 0);

    const chartLabels = ['Début', ...allDates.map(shortDateLabel)];
    const totalData   = [parseFloat(totalInitialAll.toFixed(2))];

    allDates.forEach(date => {
      // Apply transactions for every compte that appears in Finance
      allComptes.forEach(compte => {
        const dayDelta = depenses
          .filter(d => d.date === date && d.compte === compte)
          .reduce((s,d) => s + d.amount, 0);
        runningMap[compte] = (runningMap[compte] || 0) + dayDelta;
      });
      // Total = sum of all comptes (including those with no transactions)
      const total = Object.values(runningMap).reduce((s,v) => s+v, 0);
      totalData.push(parseFloat(total.toFixed(2)));
    });

    finCharts.area = new Chart(ctxArea, {
      type: 'line',
      data: {
        labels: chartLabels,
        datasets: [{
          label: 'Patrimoine total',
          data: totalData,
          borderColor: '#7c6aff',
          backgroundColor: 'rgba(124,106,255,0.12)',
          fill: true,
          tension: 0.3,
          pointRadius: ctx => ctx.dataIndex === 0 ? 0 : 3,
          pointHoverRadius: 5,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: i => ` Total : ${i.raw.toLocaleString('fr-FR',{maximumFractionDigits:0})} €`,
              afterBody: items => {
                const di = items[0]?.dataIndex;
                if (!di) return [' Point de départ (valeurs initiales)'];
                const date = allDates[di - 1];
                if (!date) return [];
                const txns = depenses.filter(d => d.date === date);
                if (!txns.length) return [];
                return txns.map(d => {
                  const sign = d.amount >= 0 ? '+' : '';
                  return ` ${d.desc || d.compte || '—'} : ${sign}${d.amount.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
                });
              },
              footer: items => {
                const di = items[0]?.dataIndex;
                if (!di) return '';
                const date = allDates[di - 1];
                const net  = depenses.filter(d => d.date === date).reduce((s,d) => s+d.amount, 0);
                const sign = net >= 0 ? '+' : '';
                return ` Net du jour : ${sign}${net.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
              }
            }
          }
        },
        scales: {
          x: { ticks:{ font:{family:'Space Mono',size:8}, maxRotation:40, maxTicksLimit:20 }, grid:{ color:'rgba(37,37,53,0.5)' } },
          y: { ticks:{ font:{family:'Space Mono',size:9}, callback: v => v.toLocaleString('fr-FR',{maximumFractionDigits:0})+'€' }, grid:{ color:'rgba(37,37,53,0.5)' } }
        }
      }
    });
  } else if (ctxArea) {
    ctxArea.canvas.parentElement.innerHTML = '<div class="fin-empty">Aucune dépense trouvée</div>';
  }

  // ── Two doughnuts: dépenses (negative) and gains (positive) ──
  const CAT_COLORS = FIN_PALETTE.concat(['#94a3b8']);
  const fmtK = v => v >= 1000
    ? (v/1000).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'K€'
    : v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+'€';

  const makePie = (id, cats, byMap, key, centerColor) => {
    const ctx = document.getElementById(id)?.getContext('2d');
    if (!ctx) return;
    if (!cats.length) { ctx.canvas.parentElement.innerHTML = `<div class="fin-empty" style="font-size:0.5rem">Aucun ${key}</div>`; return; }
    const total = cats.reduce((s,c) => s + byMap[c], 0);

    // Inline plugin: draw total in the center of the ring
    const centerPlugin = {
      id: 'center_' + key,
      afterDraw(chart) {
        const { width, ctx: c, chartArea } = chart;
        if (!chartArea) return;
        const cx = (chartArea.left + chartArea.right) / 2;
        const cy = (chartArea.top  + chartArea.bottom) / 2;
        c.save();
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = `bold 11px "Space Mono", monospace`;
        c.fillStyle = centerColor;
        c.fillText(fmtK(total), cx, cy);
        c.restore();
      }
    };

    finCharts[key] = new Chart(ctx, {
      type: 'doughnut',
      // Labels include the category name + its amount
      data: {
        labels: cats.map(c => `${c}  ${fmtK(byMap[c])}`),
        datasets: [{ data: cats.map(c => parseFloat(byMap[c].toFixed(2))),
          backgroundColor: cats.map((_,i) => CAT_COLORS[i % CAT_COLORS.length]),
          borderColor: '#09090e', borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '58%',
        plugins: {
          legend: { position:'bottom', labels:{ font:{family:'Space Mono',size:7}, boxWidth:7, padding:4 } },
          tooltip: { callbacks: { label: i => ` ${cats[i.dataIndex]}  ${i.raw.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €` } }
        }
      },
      plugins: [centerPlugin]
    });
  };
  makePie('finChartDep',  catsDep,  byCatDep,  'dep',  '#f87171');
  makePie('finChartGain', catsGain, byCatGain, 'gain', '#4ade80');
}

// ════════════════════════════════════════════════════
// FINANCES — SAVINGS MILESTONE TRACKER
// ════════════════════════════════════════════════════
function renderFinMilestone(comptes, depenses) {
  const totalCurrent = comptes.reduce((s,c) => s + c.current, 0);
  const totalInitial = comptes.reduce((s,c) => s + c.initial, 0);
  const deltaEur     = totalCurrent - totalInitial;
  const now          = new Date();
  const monthsElapsed = Math.max(1, (now - FIN_START_DATE) / (1000*60*60*24*30.44));
  const mthSavings   = deltaEur / monthsElapsed;  // avg monthly savings since Jan 2026

  const pct1M = Math.min(100, totalCurrent / FIN_GOAL * 100);

  const fmtDate = d => {
    const mo = d.getMonth()+1;
    const MONTHS_SHORT = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
    return `${MONTHS_SHORT[mo-1]} ${d.getFullYear()}`;
  };

  const nodes = FIN_MILESTONES.map((ms, i) => {
    const done   = totalCurrent >= ms.val;
    const isNext = !done && FIN_MILESTONES.findIndex(m => totalCurrent < m.val) === i;
    let dateStr  = '';
    if (done) {
      dateStr = '✓ ATTEINT';
    } else if (mthSavings > 0) {
      const months = Math.ceil((ms.val - totalCurrent) / mthSavings);
      const proj   = new Date(now);
      proj.setMonth(proj.getMonth() + months);
      dateStr = `~${fmtDate(proj)}`;
    }
    return `
      <div class="fin-ms-node ${done?'done':''} ${isNext?'active-next':''}">
        <div class="fin-ms-icon">${ms.icon}</div>
        <div class="fin-ms-node-lbl">${ms.label}</div>
        <div class="fin-ms-node-date">${dateStr}</div>
      </div>`;
  }).join('');

  // Monthly savings needed from now to hit 1M in N years (aspirational targets)
  const targets = [
    {years:5,  rate: Math.ceil((FIN_GOAL - totalCurrent)/(5*12))},
    {years:10, rate: Math.ceil((FIN_GOAL - totalCurrent)/(10*12))},
    {years:15, rate: Math.ceil((FIN_GOAL - totalCurrent)/(15*12))},
  ];
  const targetHtml = targets.map(t =>
    `<span style="margin-right:1.2rem"><b style="color:var(--text)">${t.years} ans</b> → ${t.rate.toLocaleString('fr-FR')} €/mois</span>`
  ).join('');

  const fmtEur = v => v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';

  document.getElementById('finMilestone').innerHTML = `
    <div class="fin-section-lbl">PLAN D'ÉPARGNE · OBJECTIF 1 MILLION €</div>
    <div class="fin-milestone">
      <div class="fin-ms-top">
        <div>
          <div class="fin-ms-title">PROGRESSION VERS 1 000 000 €</div>
          <div style="font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-dim);margin-top:0.35rem;line-height:1.7">
            Patrimoine : <b style="color:var(--text)">${fmtEur(totalCurrent)}</b>
            &nbsp;·&nbsp; Épargne moy. : <b style="color:var(--green)">${mthSavings>=0?'+':''}${fmtEur(mthSavings)}/mois</b>
            ${mthSavings>0 ? `&nbsp;·&nbsp; Projection : <b style="color:var(--accent)">~${Math.round((FIN_GOAL-totalCurrent)/mthSavings)} mois</b>` : ''}
          </div>
          <div style="font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-top:0.5rem">
            Pour atteindre 1M€ en : ${targetHtml}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="fin-ms-pct">${pct1M.toFixed(2)}%</div>
          <div class="fin-ms-proj">${fmtEur(FIN_GOAL - totalCurrent)} restants</div>
        </div>
      </div>
      <div class="fin-ms-track">
        <div class="fin-ms-bar" style="width:${pct1M}%"></div>
      </div>
      <div class="fin-milestones">${nodes}</div>
    </div>`;
}

function renderFinTable(depenses) {
  const CAT_PALETTE = [
    ['logement','loyer','#38bdf8'],['transport','carburant','#fbbf24'],
    ['alimentation','courses','nourriture','#4ade80'],['restaurant','café','#a3e635'],
    ['santé','médecin','pharmacie','#22d3ee'],['loisirs','sport','jeux','#a855f7'],
    ['épargne','livret','#7c6aff'],['investissement','bourse','crypto','#eab308'],
    ['abonnement','streamin','#fb923c'],['voyage','vacances','#e879f9'],
  ];
  const catColor = cat => {
    const c = cat.toLowerCase();
    for (const [,,col,...rest] of CAT_PALETTE) {
      const terms = CAT_PALETTE.find(p => p.slice(0,-1).some(t => c.includes(t)));
      if (terms && terms.slice(0,-1).some(t => c.includes(t))) return terms[terms.length-1];
    }
    return '#94a3b8';
  };
  // Simpler cat color approach
  const getCatColor = cat => {
    const c = (cat||'').toLowerCase();
    if (c.includes('logement')||c.includes('loyer')) return '#38bdf8';
    if (c.includes('transport')||c.includes('carburant')) return '#fbbf24';
    if (c.includes('aliment')||c.includes('course')||c.includes('nourrit')) return '#4ade80';
    if (c.includes('restaurant')||c.includes('café')||c.includes('cafe')) return '#a3e635';
    if (c.includes('santé')||c.includes('sante')||c.includes('médecin')||c.includes('pharma')) return '#22d3ee';
    if (c.includes('loisir')||c.includes('sport')||c.includes('jeux')||c.includes('jeu')) return '#a855f7';
    if (c.includes('épargne')||c.includes('epargne')||c.includes('livret')) return '#7c6aff';
    if (c.includes('invest')||c.includes('bourse')||c.includes('crypto')) return '#eab308';
    if (c.includes('abonn')||c.includes('stream')) return '#fb923c';
    if (c.includes('voyage')||c.includes('vacance')) return '#e879f9';
    return '#94a3b8';
  };

  const sorted  = [...depenses].sort((a,b) => b.date.localeCompare(a.date));
  const recent  = sorted.slice(0, 50);
  const fmtAmt  = v => v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';

  const rows = recent.map(d => {
    const catCol = getCatColor(d.cat);
    const amtColor = d.amount >= 0 ? 'var(--green)' : 'var(--danger)'; // positive=gain(green), negative=dépense(red)
    return `<tr>
      <td style="white-space:nowrap">${d.date}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.desc||'—'}</td>
      <td><span class="fin-cat-pill" style="color:${catCol};border-color:${catCol}44;background:${catCol}11">${d.cat||'—'}</span></td>
      <td style="color:var(--text-dim);white-space:nowrap">${d.compte||'—'}</td>
      <td style="text-align:right;font-weight:700;color:${amtColor}">${fmtAmt(d.amount)}</td>
    </tr>`;
  }).join('');

  document.getElementById('finTable').innerHTML = `
    <div class="fin-section-lbl">TRANSACTIONS RÉCENTES</div>
    <div class="fin-box">
      ${recent.length
        ? `<table class="fin-table">
            <thead><tr><th>DATE</th><th>DESCRIPTION</th><th>CATÉGORIE</th><th>COMPTE</th><th style="text-align:right">MONTANT</th></tr></thead>
            <tbody>${rows}</tbody>
           </table>
           ${sorted.length > 50 ? `<div style="font-family:'Space Mono',monospace;font-size:0.46rem;color:var(--text-dim);text-align:right;margin-top:0.5rem">Affichage des 50 transactions les plus récentes sur ${sorted.length}</div>` : ''}`
        : `<div class="fin-empty">0 transaction parsée depuis l'onglet "Finance"</div>
           <div style="font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-top:0.75rem;padding:0.75rem;background:var(--surface2);border:1px solid var(--border2);line-height:1.9">
             <div style="color:var(--warn);font-weight:700;margin-bottom:0.4rem">⚠ DIAGNOSTIC</div>
             ${finDebugInfo.error ? `<div style="color:var(--danger)">Erreur : ${finDebugInfo.error}</div>` : ''}
             <div>Onglets trouvés dans le spreadsheet : <b style="color:var(--text)">${finDebugInfo.sheetTitles.join(' · ') || '—'}</b></div>
             <div>Onglet "Comptes" détecté : <b style="color:${finDebugInfo.comptesSheet?'var(--green)':'var(--danger)'}">${finDebugInfo.comptesSheet||'NON TROUVÉ'}</b></div>
             <div>Onglet "Finance" détecté : <b style="color:${finDebugInfo.financeSheet?'var(--green)':'var(--danger)'}">${finDebugInfo.financeSheet||'NON TROUVÉ'}</b></div>
             <div>Lignes brutes reçues (Finance) : <b style="color:var(--text)">${finDepenses.length}</b></div>
             ${finDepenses.length ? finDepenses.slice(0,4).map((r,i)=>`<div style="margin-top:0.2rem;opacity:${i===0?'0.5':'1'}">
               [${i===0?'header':'L'+i}] ${r.slice(0,6).map(c=>`<span style="border:1px solid var(--border);padding:0 4px;margin-right:2px">${String(c||'∅')}</span>`).join('')}
             </div>`).join('') : ''}
             <div style="margin-top:0.4rem;opacity:0.5">Attendu : col A=date · B=description · C=montant · D=catégorie · E=compte</div>
           </div>`}
    </div>`;
}
