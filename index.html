<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANBAN OPS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2309090e'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='%237c6aff' opacity='0.15'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='none' stroke='%237c6aff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237c6aff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#09090e;--surface:#0f0f17;--surface2:#16161f;--surface3:#1c1c28;
  --border:#252535;--border2:#32324a;
  --accent:#7c6aff;--accent-dim:rgba(124,106,255,0.12);
  --text:#e4e4f0;--text-dim:#60607a;--text-mid:#9898b8;
  --green:#4ade80;--warn:#fbbf24;--danger:#f87171;
  --dcb:#38bdf8;--gld:#fcd34d;--air:#6ee7b7;--perso:#c084fc;
  --imp1:#4ade80;--imp2:#a3e635;--imp3:#fbbf24;--imp4:#fb923c;--imp5:#f87171;
  --cat-finance:#fcd34d;--cat-esprit:#a78bfa;--cat-sante:#4ade80;--cat-prod:#38bdf8;--cat-autre:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;display:flex;flex-direction:column}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}

/* HEADER */
header{flex-shrink:0;height:56px;background:rgba(9,9,14,0.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:0.75rem;z-index:200;position:relative}
.logo{font-family:'Space Mono',monospace;font-size:0.68rem;font-weight:700;letter-spacing:0.3em;color:var(--accent);white-space:nowrap;flex-shrink:0}
.nav-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.nav-tabs{display:flex;gap:0.1rem;flex-shrink:0}
.nav-tab{background:none;border:none;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;padding:0.3rem 0.65rem;border-bottom:2px solid transparent;transition:color 0.13s,border-color 0.13s;white-space:nowrap}
.nav-tab:hover{color:var(--text-mid)}
.nav-tab.active{color:var(--accent);border-color:var(--accent)}
.proj-shortcuts{display:flex;gap:0.35rem;flex-shrink:0}
.proj-btn{font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;letter-spacing:0.1em;padding:0.28rem 0.6rem;border:1px solid;cursor:pointer;transition:all 0.13s;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%)}
.proj-btn.dcb{color:var(--dcb);border-color:rgba(56,189,248,0.28);background:rgba(56,189,248,0.06)}.proj-btn.dcb:hover{background:rgba(56,189,248,0.14)}
.proj-btn.gld{color:var(--gld);border-color:rgba(252,211,77,0.28);background:rgba(252,211,77,0.06)}.proj-btn.gld:hover{background:rgba(252,211,77,0.14)}
.proj-btn.air{color:var(--air);border-color:rgba(110,231,183,0.28);background:rgba(110,231,183,0.06)}.proj-btn.air:hover{background:rgba(110,231,183,0.14)}
.proj-btn.perso{color:var(--perso);border-color:rgba(192,132,252,0.28);background:rgba(192,132,252,0.06)}.proj-btn.perso:hover{background:rgba(192,132,252,0.14)}
.header-right{display:flex;align-items:center;gap:0.75rem;margin-left:auto;flex-shrink:0}
.sync-status{font-family:'Space Mono',monospace;font-size:0.56rem;letter-spacing:0.07em;color:var(--text-dim);display:flex;align-items:center;gap:0.3rem;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.ok{animation:pulse 2.5s infinite}.sync-dot.syncing{background:var(--warn);animation:blink 0.5s infinite}.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.hstat{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.07em;color:var(--text-dim);display:flex;align-items:center;gap:0.25rem;white-space:nowrap}
.hstat b{color:var(--text);font-size:0.72rem}
.btn-nav{background:var(--accent);color:#fff;border:none;font-family:'Syne',sans-serif;font-size:0.73rem;font-weight:700;padding:0.3rem 0.8rem;cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:background 0.13s;white-space:nowrap}
.btn-nav:hover{background:#9585ff}
.btn-nav.out{background:transparent;clip-path:none;border:1px solid var(--border);color:var(--text-dim)}.btn-nav.out:hover{color:var(--text);border-color:var(--text-mid)}

/* PAGES */
.page{display:none;flex:1;overflow:hidden;position:relative;z-index:1}
.page.active{display:flex;flex-direction:column}

/* BOARD */
#pageboard{overflow:hidden}
.board-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;flex-direction:column}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:0.65rem;padding:0.9rem 1rem 2rem;min-width:1080px;height:100%}
.column{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:border-color 0.17s}
.column.drag-over{border-color:var(--accent);box-shadow:inset 0 0 28px rgba(124,106,255,0.05)}
.col-header{padding:0.65rem 0.8rem 0.55rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.col-title{font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-mid)}
.col-count{font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.column[data-col="BackLog"] .col-header{border-left:2px solid #3a3a55}
.column[data-col="Ce mois"] .col-header{border-left:2px solid #6366f1}
.column[data-col="Cette semaine"] .col-header{border-left:2px solid #8b5cf6}
.column[data-col="Demain"] .col-header{border-left:2px solid var(--warn)}
.column[data-col="Aujourd'hui"] .col-header{border-left:2px solid var(--danger)}
.col-body{padding:0.55rem;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.45rem}
.col-body::-webkit-scrollbar{width:3px}.col-body::-webkit-scrollbar-thumb{background:var(--border2)}

/* CARDS */
.card{background:var(--surface2);border:1px solid var(--border);padding:0.6rem 0.6rem 0.45rem;cursor:grab;transition:transform 0.12s,box-shadow 0.12s,border-color 0.14s,opacity 0.18s;position:relative;overflow:hidden;animation:cardIn 0.17s ease-out;flex-shrink:0}
@keyframes cardIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(124,106,255,0.33);box-shadow:0 4px 18px rgba(0,0,0,0.42);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:0.2;transform:rotate(1.5deg)}
.card-tag{position:absolute;top:0;right:0;font-family:'Space Mono',monospace;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;padding:4px 10px}
.card-tag.dcb{background:rgba(56,189,248,0.18);color:var(--dcb);border-bottom:1px solid rgba(56,189,248,0.4);border-left:1px solid rgba(56,189,248,0.4)}.card-tag.gld{background:rgba(252,211,77,0.18);color:var(--gld);border-bottom:1px solid rgba(252,211,77,0.4);border-left:1px solid rgba(252,211,77,0.4)}.card-tag.air{background:rgba(110,231,183,0.18);color:var(--air);border-bottom:1px solid rgba(110,231,183,0.4);border-left:1px solid rgba(110,231,183,0.4)}.card-tag.perso{background:rgba(192,132,252,0.18);color:var(--perso);border-bottom:1px solid rgba(192,132,252,0.4);border-left:1px solid rgba(192,132,252,0.4)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px}
.card[data-imp="1"]::before{background:var(--imp1)}.card[data-imp="2"]::before{background:var(--imp2)}.card[data-imp="3"]::before{background:var(--imp3)}.card[data-imp="4"]::before{background:var(--imp4)}.card[data-imp="5"]::before{background:var(--imp5)}
.card.a-warn{border-color:rgba(251,191,36,0.43)}.card.a-danger{border-color:rgba(248,113,113,0.62);box-shadow:0 0 9px rgba(248,113,113,0.11)}
.card-title{font-size:0.78rem;font-weight:600;line-height:1.35;color:var(--text);padding-left:10px;margin-bottom:0.45rem;word-break:break-word;padding-right:2rem}
.card-meta{display:flex;align-items:center;justify-content:space-between;padding-left:10px}
.imp-dots{display:flex;gap:3px}
.idot{width:7px;height:7px;border-radius:50%;opacity:0.18}.idot.on{opacity:1}
.idot-1{background:var(--imp1)}.idot-2{background:var(--imp2)}.idot-3{background:var(--imp3)}.idot-4{background:var(--imp4)}.idot-5{background:var(--imp5)}
.due-badge{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.05em;padding:2px 5px}
.due-badge.normal{color:var(--text-dim);background:rgba(255,255,255,0.03)}.due-badge.warn{color:var(--warn);background:rgba(251,191,36,0.09)}.due-badge.danger{color:var(--danger);background:rgba(248,113,113,0.09)}.due-badge.overdue{color:#fff;background:var(--danger)}
.card-notes{font-size:0.65rem;color:var(--text-dim);font-style:italic;padding:0.28rem 0 0 6px;margin-top:0.35rem;border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:0.3rem;margin-top:0.45rem;padding-left:6px}
.btn-done{background:rgba(74,222,128,0.07);border:1px solid rgba(74,222,128,0.22);color:var(--green);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;padding:2px 7px;cursor:pointer;text-transform:uppercase;transition:background 0.11s}.btn-done:hover{background:rgba(74,222,128,0.17)}
.btn-edit{background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--text-dim);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;padding:2px 7px;cursor:pointer;text-transform:uppercase;transition:background 0.11s,color 0.11s}.btn-edit:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.col-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.12em;opacity:0.38}

/* BOARD FILTER BAR */
.board-filters{flex-shrink:0;display:flex;align-items:center;gap:0.35rem;padding:0.5rem 1rem;border-bottom:1px solid var(--border);background:rgba(9,9,14,0.7)}
.board-filter{font-family:'Space Mono',monospace;font-size:0.56rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.26rem 0.7rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);transition:all 0.13s}
.board-filter:hover{color:var(--text);border-color:var(--text-mid)}
.board-filter.active{color:var(--bg);border-color:transparent;background:var(--text-mid)}
.board-filter.active.f-all{background:var(--accent)}
.board-filter.active.f-dcb{background:var(--dcb);color:#09090e}
.board-filter.active.f-gld{background:var(--gld);color:#09090e}
.board-filter.active.f-air{background:var(--air);color:#09090e}
.board-filter.active.f-perso{background:var(--perso)}

/* DASHBOARD */
#pagedash{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1.1rem;flex-direction:column}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem;margin-bottom:1.1rem}
.kpi{background:var(--surface);border:1px solid var(--border);padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:0.35rem}
.kpi-label{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim)}
.kpi-value{font-family:'Space Mono',monospace;font-size:1.9rem;font-weight:700;line-height:1}
.kpi-sub{font-size:0.7rem;color:var(--text-dim)}
.kpi.c-accent .kpi-value{color:var(--accent)}.kpi.c-green .kpi-value{color:var(--green)}.kpi.c-warn .kpi-value{color:var(--warn)}.kpi.c-danger .kpi-value{color:var(--danger)}
.proj-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.85rem;margin-bottom:1.1rem}
.proj-kpi{background:var(--surface);border:1px solid var(--border);padding:0.9rem 1.1rem;display:flex;flex-direction:column;gap:0.3rem}
.proj-kpi-label{font-family:'Space Mono',monospace;font-size:0.63rem;font-weight:700;letter-spacing:0.14em}
.proj-kpi-label.dcb{color:var(--dcb)}.proj-kpi-label.gld{color:var(--gld)}.proj-kpi-label.air{color:var(--air)}
.proj-kpi-val{font-family:'Space Mono',monospace;font-size:1.55rem;font-weight:700;color:var(--text)}
.proj-kpi-sub{font-size:0.68rem;color:var(--text-dim)}
.charts-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.85rem}
.chart-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}
.chart-title{font-family:'Space Mono',monospace;font-size:0.57rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-mid);margin-bottom:0.9rem}
.chart-wrap{position:relative;height:190px}.chart-wrap.tall{height:220px}

/* ═══════════════════════════════
   HABITUDES PAGE
═══════════════════════════════ */
#pagehabits{overflow-y:auto;flex-direction:column}
.hab-portfolio{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0.9rem 1.5rem;display:grid;grid-template-columns:auto 1fr repeat(4,auto);align-items:center;gap:1.5rem}
.hab-port-title{font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;letter-spacing:0.25em;color:var(--accent)}
.hab-port-progress{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.hab-port-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s}
.hab-port-stat{display:flex;flex-direction:column;gap:0.15rem;text-align:right}
.hab-port-stat-label{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim)}
.hab-port-stat-val{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700}
.hab-port-stat-val.gold{color:var(--gld)}
.hab-port-stat-val.accent{color:var(--accent)}
.hab-port-stat-val.green{color:var(--green)}

.hab-toolbar{flex-shrink:0;display:flex;align-items:center;gap:0.5rem;padding:0.7rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(9,9,14,0.6)}
.hab-filter{font-family:'Space Mono',monospace;font-size:0.56rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.28rem 0.65rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.13s}
.hab-filter:hover{color:var(--text);border-color:var(--text-mid)}
.hab-filter.active{color:var(--bg);border-color:transparent}
.hab-filter.active.all{background:var(--accent)}
.hab-filter.active.Finance{background:var(--cat-finance);color:#09090e}
.hab-filter.active.Esprit{background:var(--cat-esprit)}
.hab-filter.active.Santé{background:var(--cat-sante);color:#09090e}
.hab-filter.active.Productivité{background:var(--cat-prod);color:#09090e}
.hab-filter.active.Autre{background:var(--cat-autre);color:#09090e}
.hab-toolbar-sep{flex:1}

.hab-body{flex:1;padding:1.1rem 1.5rem 3rem;overflow-y:auto}
.hab-date-label{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.85rem}
.hab-empty{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;color:var(--text-dim);opacity:0.45;text-align:center;padding:3rem 0}

.hab-item{display:flex;align-items:center;gap:0.85rem;padding:0.7rem 0.9rem 0.7rem 1.2rem;background:var(--surface);border:1px solid var(--border);margin-bottom:0.4rem;transition:border-color 0.15s,opacity 0.2s;position:relative;overflow:hidden;animation:cardIn 0.15s ease-out}
.hab-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px}
.hab-item.Finance::before{background:var(--cat-finance)}
.hab-item.Esprit::before{background:var(--cat-esprit)}
.hab-item.Santé::before{background:var(--cat-sante)}
.hab-item.Productivité::before{background:var(--cat-prod)}
.hab-item.Autre::before{background:var(--cat-autre)}
.hab-item:hover{border-color:var(--border2)}
.hab-item.done{opacity:0.42}
.hab-item.done .hab-title{text-decoration:line-through;text-decoration-color:var(--text-dim)}

.hab-check{width:22px;height:22px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;background:var(--surface2)}
.hab-check:hover{border-color:var(--accent)}
.hab-check.checked{background:var(--accent);border-color:var(--accent)}
.hab-check.checked::after{content:'✓';font-size:0.72rem;color:#fff;font-weight:700}

.hab-title{flex:1;font-size:0.82rem;font-weight:600;color:var(--text);min-width:0}
.hab-streak{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--text-dim);white-space:nowrap;display:flex;align-items:center;gap:0.2rem}
.hab-streak b{color:var(--warn)}
.hab-freq{font-family:'Space Mono',monospace;font-size:0.52rem;background:var(--surface2);border:1px solid var(--border);padding:2px 7px;color:var(--text-dim);white-space:nowrap}
.hab-cat-badge{font-family:'Space Mono',monospace;font-size:0.5rem;font-weight:700;letter-spacing:0.08em;padding:2px 7px;white-space:nowrap}
.hab-cat-badge.Finance{background:rgba(252,211,77,0.1);color:var(--cat-finance)}
.hab-cat-badge.Esprit{background:rgba(167,139,250,0.1);color:var(--cat-esprit)}
.hab-cat-badge.Santé{background:rgba(74,222,128,0.1);color:var(--cat-sante)}
.hab-cat-badge.Productivité{background:rgba(56,189,248,0.1);color:var(--cat-prod)}
.hab-cat-badge.Autre{background:rgba(148,163,184,0.1);color:var(--cat-autre)}
.hab-reward{font-family:'Space Mono',monospace;font-size:0.7rem;font-weight:700;color:var(--green);white-space:nowrap;min-width:52px;text-align:right}
.hab-edit-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.75rem;padding:0.2rem 0.35rem;transition:color 0.12s;opacity:0;flex-shrink:0}
.hab-item:hover .hab-edit-btn{opacity:1}
.hab-edit-btn:hover{color:var(--text)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);align-items:center;justify-content:center}
.modal-bg.open{display:flex;animation:fadein 0.11s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border2);padding:1.6rem;width:410px;max-width:95vw;position:relative;animation:slideup 0.17s ease-out}
@keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.3rem}
.modal-close{position:absolute;top:0.9rem;right:0.9rem;background:none;border:none;color:var(--text-dim);font-size:1.05rem;cursor:pointer;line-height:1;transition:color 0.1s}.modal-close:hover{color:var(--text)}
.field{margin-bottom:0.85rem}
.field label{display:block;font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.3rem}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:0.83rem;padding:0.42rem 0.65rem;outline:none;transition:border-color 0.12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:50px}
.imp-row{display:flex;gap:0.35rem}
.imp-btn{flex:1;padding:0.42rem 0;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Space Mono',monospace;font-size:0.6rem;font-weight:700;transition:all 0.1s}
.imp-btn[data-v="1"]{color:var(--imp1)}.imp-btn[data-v="2"]{color:var(--imp2)}.imp-btn[data-v="3"]{color:var(--imp3)}.imp-btn[data-v="4"]{color:var(--imp4)}.imp-btn[data-v="5"]{color:var(--imp5)}
.imp-btn.sel[data-v="1"]{background:rgba(74,222,128,0.11);border-color:var(--imp1)}.imp-btn.sel[data-v="2"]{background:rgba(163,230,53,0.11);border-color:var(--imp2)}.imp-btn.sel[data-v="3"]{background:rgba(251,191,36,0.11);border-color:var(--imp3)}.imp-btn.sel[data-v="4"]{background:rgba(251,146,60,0.11);border-color:var(--imp4)}.imp-btn.sel[data-v="5"]{background:rgba(248,113,113,0.11);border-color:var(--imp5)}
.modal-footer{display:flex;gap:0.55rem;margin-top:1.1rem}
.btn-primary{flex:1;background:var(--accent);border:none;color:#fff;font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:700;padding:0.52rem;cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:background 0.12s}.btn-primary:hover{background:#9585ff}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-family:'Syne',sans-serif;font-size:0.78rem;padding:0.52rem 0.9rem;cursor:pointer;transition:color 0.12s,border-color 0.12s}.btn-secondary:hover{color:var(--text);border-color:var(--text-mid)}
.btn-del{background:rgba(248,113,113,0.07);border:1px solid rgba(248,113,113,0.22);color:var(--danger);font-family:'Syne',sans-serif;font-size:0.78rem;padding:0.52rem 0.85rem;cursor:pointer;transition:background 0.12s}.btn-del:hover{background:rgba(248,113,113,0.16)}

/* CAT RADIO BUTTONS */
.cat-row{display:flex;gap:0.35rem}
.cat-btn{flex:1;padding:0.42rem 0;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Space Mono',monospace;font-size:0.54rem;font-weight:700;letter-spacing:0.06em;transition:all 0.1s;color:var(--text-dim)}
.cat-btn.sel.Finance{background:rgba(252,211,77,0.12);border-color:var(--cat-finance);color:var(--cat-finance)}
.cat-btn.sel.Esprit{background:rgba(167,139,250,0.12);border-color:var(--cat-esprit);color:var(--cat-esprit)}
.cat-btn.sel.Santé{background:rgba(74,222,128,0.12);border-color:var(--cat-sante);color:var(--cat-sante)}
.cat-btn.sel.Productivité{background:rgba(56,189,248,0.12);border-color:var(--cat-prod);color:var(--cat-prod)}
.cat-btn.sel.Autre{background:rgba(148,163,184,0.12);border-color:var(--cat-autre);color:var(--cat-autre)}

/* AUTH SCREEN */
#authScreen{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
.auth-box{background:var(--surface);border:1px solid var(--border2);padding:2.25rem 2.75rem;width:440px;max-width:94vw;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.auth-logo{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;letter-spacing:0.3em;color:var(--accent);margin-bottom:0.5rem}
.auth-desc{font-size:0.82rem;color:var(--text-mid);line-height:1.65;text-align:left}

/* LOADING */
#loadOverlay{position:fixed;inset:0;z-index:350;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;color:var(--accent);animation:pulse 1s infinite}

/* TOASTS */
.toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:500;display:flex;flex-direction:column;gap:0.35rem;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);padding:0.55rem 0.85rem;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.07em;animation:tin 0.16s ease-out,tout 0.22s ease-in 2.8s forwards}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--danger)}.toast.info{border-left:3px solid var(--accent)}
@keyframes tin{from{transform:translateX(12px);opacity:0}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(12px)}}
/* HEATMAPS */
.heatmaps-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.85rem;margin-top:0.85rem}
.hm-box{background:var(--surface);border:1px solid var(--border);padding:1rem 1.1rem}
.hm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem}
.hm-title{font-family:'Space Mono',monospace;font-size:0.57rem;letter-spacing:0.18em;font-weight:700}
.hm-legend{display:flex;align-items:center;gap:3px}
.hm-legend-label{font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-left:4px}
.hm-scroll{overflow-x:auto}
.hm-scroll::-webkit-scrollbar{height:3px}
.hm-grid{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:2px;min-width:max-content;padding-bottom:2px}
.hm-cell{border-radius:2px;cursor:default}
.hm-cell:hover{filter:brightness(1.3)}

::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2)}

/* ═══════════════════════════════
   CRYPTOBOT PAGE
═══════════════════════════════ */
#pagecrypto{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1rem;flex-direction:column}
.crp-banner{display:grid;grid-template-columns:repeat(5,1fr);gap:0.85rem}

.crp-kpi-val{font-family:'Space Mono',monospace;font-size:1.65rem;font-weight:700;line-height:1}
.crp-kpi-sub{font-size:0.67rem;color:var(--text-dim);margin-top:0.25rem}
.crp-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:0.85rem}
.crp-card{background:var(--surface);border:1px solid var(--border);padding:1rem 1.1rem;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.15s}
.crp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.crp-card.ada::before{background:#3b82f6}.crp-card.sol::before{background:#a855f7}
.crp-card.eth::before{background:#818cf8}.crp-card.xrp::before{background:#22d3ee}
.crp-card.bnb::before{background:#eab308}

.crp-sym{font-family:'Space Mono',monospace;font-size:0.82rem;font-weight:700;letter-spacing:0.22em;margin-bottom:0.12rem}

.crp-sep{height:1px;background:var(--border);margin:0.55rem 0}

.crp-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}

.crp-box-ttl{font-family:'Space Mono',monospace;font-size:0.53rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-mid)}
.crp-wrap{position:relative;height:190px}.crp-wrap.tall{height:220px}
.crp-table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:0.57rem}
.crp-table th{text-align:left;color:var(--text-dim);letter-spacing:0.1em;font-weight:400;padding:0.28rem 0.6rem;border-bottom:1px solid var(--border)}
.crp-table td{padding:0.32rem 0.6rem;border-bottom:1px solid rgba(37,37,53,0.4);color:var(--text)}
.crp-table tr:last-child td{border-bottom:none}
.crp-pos{color:var(--green)}.crp-neg{color:var(--danger)}
.crp-btn{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.08em;padding:0.2rem 0.55rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.12s}
.crp-btn:hover{color:var(--text);border-color:var(--text-mid)}
.crp-empty{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;color:var(--text-dim);opacity:0.42;text-align:center;padding:2.5rem 0}
.crp-hodl-note{font-family:'Space Mono',monospace;font-size:0.46rem;letter-spacing:0.07em;color:var(--text-dim);margin-top:0.4rem}
</style>
</head>
<body>

<!-- AUTH SCREEN -->

  <div class="auth-box">
    <div class="auth-logo">◆ KANBAN OPS</div>

<!-- HEADER -->

<script>
// ════════════════════════════════════════════════════
// CONFIG & CONSTANTS
// ════════════════════════════════════════════════════
const COLUMNS  = ["Aujourd'hui",'Demain','Cette semaine','Ce mois','BackLog'];
const PROJECTS = ['DCB','GLD','Airside','Perso'];
const CATEGORIES = ['Finance','Esprit','Santé','Productivité','Autre'];
const LS_CACHE = 'kanban_cache_v3';

const FREQ_OPTS = [
  ['daily',             'Tous les jours'],
  ['weekly:1,2,3,4,5',  'Lun – Ven'],
  ['weekly:0,6',        'Sam & Dim'],
  ['weekly:1','Lundi'],['weekly:2','Mardi'],['weekly:3','Mercredi'],
  ['weekly:4','Jeudi'], ['weekly:5','Vendredi'],['weekly:6','Samedi'],['weekly:0','Dimanche'],
  ['monthly:day:1',    '1er du mois'],
  ['monthly:first:0',  '1er dimanche du mois'],
  ['monthly:first:1',  '1er lundi du mois'],
  ['monthly:first:2',  '1er mardi du mois'],
  ['monthly:first:3',  '1er mercredi du mois'],
  ['monthly:first:4',  '1er jeudi du mois'],
  ['monthly:first:5',  '1er vendredi du mois'],
  ['monthly:first:6',  '1er samedi du mois'],
  ['weekly:1,3,5',     'Lun, Mer, Ven'],
  ['weekly:3,6',       'Mer, Sam'],
  ['weekly:2,4',       'Mar, Jeu'],
];

const cfg = {
  clientId:      '43084703914-45j926vjo82u4k2tcj9enbtftvtqalul.apps.googleusercontent.com',
  spreadsheetId: '1W3S_g5SjFo9Dx2rpVgx35mD_fWq1bC3NEG6DF3lbdJA',
  sheetName:     'tasks'
};

const SHEET_HEADER      = ['id','title','column','importance','due_date','created_at','completed_at','notes'];
const HABITS_HEADER     = ['id','title','frequency','reward_eur','category','active'];
const HABITS_LOG_HEADER = ['id','habit_id','date','reward_eur','category'];

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let accessToken = null;
let allTasks = [], tasks = [];
let habits = [], habitsLog = [];
let selImp = 3, selCat = 'Finance';
let dragSrcId = null, charts = {}, curPage = 'board';
let gisLoaded = false, tokenClient = null;
let habCatFilter = 'all';
let boardFilter = 'all';

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
function init() {
  try {
    const cached = JSON.parse(localStorage.getItem(LS_CACHE) || '[]');
    allTasks = cached; tasks = allTasks.filter(t => !t.completed_at);
    render();
  } catch(e){}
  buildHabitModalSelects();
  document.getElementById('authScreen').style.display = 'none';
  preloadGIS();
}

function buildHabitModalSelects() {
  // Frequency select
  const sel = document.getElementById('hfFreq');
  FREQ_OPTS.forEach(([v,l]) => {
    const o = document.createElement('option'); o.value=v; o.textContent=l; sel.appendChild(o);
  });
  // Category row
  const row = document.getElementById('catRow');
  CATEGORIES.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (c === selCat ? ' sel '+c : '');
    b.textContent = c; b.dataset.cat = c;
    b.onclick = () => setCat(c);
    row.appendChild(b);
  });
}

function preloadGIS() {
  if (!cfg.clientId) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => { gisLoaded = true; initTokenClient(); tokenClient.requestAccessToken({ prompt: '' }); };
  document.head.appendChild(s);
}

function initTokenClient() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: async (resp) => {
      if (resp.error) { document.getElementById('authScreen').style.display='flex'; return; }
      accessToken = resp.access_token;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'block';
      showLoad(true);
      await Promise.all([loadFromSheets(), loadHabits(), loadHabitsLog()]);
      showLoad(false);
      render();
      if (curPage === 'habits') renderHabitsPage();
    }
  });
}

async function startAuth() {
  if (!gisLoaded) { toast('Google Auth en cours de chargement, réessaie dans 2s','info'); return; }
  if (!tokenClient) initTokenClient();
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function logout() {
  accessToken = null;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('btnLogout').style.display = 'none';
  toast('Déconnecté','info');
}

// ════════════════════════════════════════════════════
// GOOGLE SHEETS — TASKS
// ════════════════════════════════════════════════════
const sheetsBase = () => `https://sheets.googleapis.com/v4/spreadsheets/${cfg.spreadsheetId}`;

async function loadFromSheets() {
  try {
    const r = await fetch(`${sheetsBase()}/values/${cfg.sheetName}!A:H`, { headers:{Authorization:`Bearer ${accessToken}`} });
    if (!r.ok) throw new Error(r.status);

// FREQUENCY LOGIC
// ════════════════════════════════════════════════════
function isHabitDueOnDate(freq, date) {
  const dow = date.getDay();
  const dom = date.getDate();
  const year = date.getFullYear(), month = date.getMonth();
  if (freq === 'daily') return true;
  if (freq.startsWith('weekly:')) {
    return freq.slice(7).split(',').map(Number).includes(dow);
  }
  if (freq.startsWith('monthly:')) {
    const parts = freq.split(':');
    if (parts[1] === 'day') return dom === parseInt(parts[2]);
    if (parts[1] === 'first') {
      const targetDow = parseInt(parts[2]);
      const firstOfMonth = new Date(year, month, 1);
      const firstOcc = 1 + ((targetDow - firstOfMonth.getDay() + 7) % 7);
      return dom === firstOcc;
    }
  }
  return false;
}

function isHabitDueToday(freq) {
  const today = new Date(); today.setHours(0,0,0,0);
  return isHabitDueOnDate(freq, today);
}

function getStreak(habitId, freq) {
  const todayStr = td();
  const completionDates = new Set(habitsLog.filter(l => String(l.habit_id) === String(habitId)).map(l => l.date));
  const scheduled = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    if (isHabitDueOnDate(freq, d)) scheduled.push(d.toISOString().split('T')[0]);
    if (scheduled.length >= 90) break;
  }
  let streak = 0, started = false;
  for (const date of scheduled) {
    if (completionDates.has(date)) { streak++; started = true; }
    else if (!started && date === todayStr) continue;
    else break;
  }
  return streak;
}

function renderHabPortfolio() {

  const monthEarned = habitsLog.filter(l => l.date.startsWith(thisMonth)).reduce((s,l) => s + l.reward_eur, 0);
  const todayEarned = habitsLog.filter(l => l.date === todayStr).reduce((s,l) => s + l.reward_eur, 0);
  const dueToday = habits.filter(h => h.active && isHabitDueToday(h.frequency));
  const doneToday = dueToday.filter(h => habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===todayStr));
  const pct = dueToday.length ? Math.round(doneToday.length/dueToday.length*100) : 0;

  document.getElementById('habPortfolio').innerHTML = `
    <div class="hab-port-title">◆ PORTEFEUILLE</div>

function renderHabToolbar() {
  const filters = [['all','Toutes'], ...CATEGORIES.map(c=>[c,c])];
  const btns = filters.map(([v,l]) => {
    const active = habCatFilter === v ? ` active ${v}` : '';
    return `<button class="hab-filter${active}" onclick="setHabFilter('${v}')">${l}</button>`;
  }).join('');
  document.getElementById('habToolbar').innerHTML = `
    ${btns}
    <div class="hab-toolbar-sep"></div>
    <button class="btn-nav" onclick="openHabitModal()">+ HABITUDE</button>
  `;
}

function renderHabBody() {
  const todayStr = td();
  const dayNames = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const now = new Date();
  const dateLabel = `${dayNames[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

  const filtered = habits.filter(h => {
    if (!h.active) return false;
    if (!isHabitDueToday(h.frequency)) return false;
    if (habCatFilter !== 'all' && h.category !== habCatFilter) return false;
    return true;
  });

  // Sort: undone first, then done
  filtered.sort((a,b) => {
    const aDone = habitsLog.some(l => String(l.habit_id)===String(a.id) && l.date===todayStr);
    const bDone = habitsLog.some(l => String(l.habit_id)===String(b.id) && l.date===todayStr);
    if (aDone !== bDone) return aDone ? 1 : -1;
    return a.category.localeCompare(b.category);
  });

  const body = document.getElementById('habBody');
  if (!filtered.length) {
    body.innerHTML = `<div class="hab-date-label">AUJOURD'HUI — ${dateLabel.toUpperCase()}</div><div class="hab-empty">AUCUNE HABITUDE PRÉVUE AUJOURD'HUI</div>`;
    return;
  }

  body.innerHTML = `<div class="hab-date-label">AUJOURD'HUI — ${dateLabel.toUpperCase()}</div>`;
  filtered.forEach(h => {
    const isDone = habitsLog.some(l => String(l.habit_id)===String(h.id) && l.date===todayStr);
    const streak = getStreak(h.id, h.frequency);
    const item = document.createElement('div');
    item.className = `hab-item ${h.category}${isDone?' done':''}`;
    item.innerHTML = `
      <div class="hab-check${isDone?' checked':''}" onclick="toggleHabit(${h.id})"></div>
      <div class="hab-title"><span style="margin-right:0.4rem;font-size:0.95rem">${habitIcon(h.title)}</span>${h.title}</div>
      <div class="hab-streak">${streak > 0 ? `🔥 <b>${streak}</b>` : '—'}</div>
      <div class="hab-freq">${freqLabel(h.frequency)}</div>
      <div class="hab-cat-badge ${h.category}">${h.category}</div>
      <div class="hab-reward">+${h.reward_eur.toFixed(2)}€</div>
      <button class="hab-edit-btn" onclick="openHabitModal(${h.id})">✎</button>
    `;
    body.appendChild(item);
  });
}

// HABIT TOGGLE
// ════════════════════════════════════════════════════
async function toggleHabit(habitId) {
  const todayStr = td();
  const h = habits.find(h => h.id === habitId);
  if (!h) return;
  const existing = habitsLog.findIndex(l => String(l.habit_id)===String(habitId) && l.date===todayStr);

  if (existing >= 0) {
    // Uncheck — remove from log and rewrite sheet
    habitsLog.splice(existing, 1);
    renderHabitsPage();
    await rewriteHabitsLog();
    toast('Habitude décochée','info');
  } else {
    // Check — append to log
    const entry = { id: Date.now(), habit_id: habitId, date: todayStr, reward_eur: h.reward_eur, category: h.category };
    habitsLog.push(entry);
    renderHabitsPage();
    await appendHabitsLog(entry);
    toast(`✓ +${h.reward_eur.toFixed(2)}€ · ${h.title}`,'ok');
  }
}

async function saveHabit() {
  const title = document.getElementById('hfTitle').value.trim();
  if (!title) { document.getElementById('hfTitle').focus(); return; }

  const data = {
    title, frequency: document.getElementById('hfFreq').value,

  };

async function deleteHabit() {

function setBoardFilter(f) {
  boardFilter = f;
  document.querySelectorAll('.board-filter').forEach(b => {
    const isActive = (f === 'all' && b.classList.contains('f-all')) ||
                     (f === 'DCB' && b.classList.contains('f-dcb')) ||
                     (f === 'GLD' && b.classList.contains('f-gld')) ||
                     (f === 'Airside' && b.classList.contains('f-air')) ||
                     (f === 'Perso' && b.classList.contains('f-perso'));
    b.classList.toggle('active', isActive);
  });
  render();
}

function filterTasksByBoard(list) {
  if (boardFilter === 'all') return list;
  return list.filter(t => {
    const proj = PROJECTS.find(p => t.title.startsWith(p+' :') || t.title.startsWith(p+':'));
    return proj === boardFilter;
  });
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const now = new Date(); now.setHours(0,0,0,0);
  COLUMNS.forEach(col => {
    const ct = filterTasksByBoard(tasks.filter(t=>t.column===col));
    const el = document.createElement('div');
    el.className='column'; el.dataset.col=col;
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');dropOnCol(col)});
    el.innerHTML=`<div class="col-header"><span class="col-title">${col}</span><span class="col-count">${ct.length}</span></div><div class="col-body" id="cb-${col.replace(/[^a-z]/gi,'X')}"></div>`;
    board.appendChild(el);
    const body=el.querySelector('.col-body');
    if(!ct.length){body.innerHTML='<div class="col-empty">VIDE</div>'}
    else ct.forEach(t=>body.appendChild(mkCard(t,now)));
  });
  updateHStats();
}

function mkCard(t, now) {
  const c = document.createElement('div');
  c.className='card'; c.dataset.id=t.id; c.dataset.imp=t.importance; c.draggable=true;
  const proj=PROJECTS.find(p=>t.title.startsWith(p+' :')||t.title.startsWith(p+':'));
  const cls=proj?(proj==='Airside'?'air':proj.toLowerCase()):'';
  const tag=proj?`<div class="card-tag ${cls}">${proj.toUpperCase()}</div>`:'';
  let badge='',ac='';
  if(t.due_date){
    const due=new Date(t.due_date);due.setHours(0,0,0,0);
    const diff=Math.ceil((due-now)/86400000);
    let bc='normal',bl=`J-${diff}`;
    if(diff<0){bc='overdue';bl='EN RETARD';ac='a-danger'}
    else if(diff===0){bc='danger';bl='AUJ.';ac='a-danger'}
    else if(diff===1){bc='danger';bl='DEMAIN';ac='a-danger'}
    else if(diff<=3){bc='warn';bl=`J-${diff}`;ac='a-warn'}
    badge=`<span class="due-badge ${bc}">${bl}</span>`;
  }
  if(ac)c.classList.add(ac);
  let dots='';for(let i=1;i<=5;i++)dots+=`<div class="idot idot-${i}${i<=t.importance?' on':''}"></div>`;
  const notes=t.notes?`<div class="card-notes">${t.notes}</div>`:'';
  c.innerHTML=`${tag}<div class="card-title">${t.title}</div><div class="card-meta"><div class="imp-dots">${dots}</div>${badge}</div>${notes}<div class="card-actions"><button class="btn-done" onclick="completeTask(${t.id})">✓ TERMINER</button><button class="btn-edit" onclick="openModal(${t.id})">ÉDITER</button></div>`;
  c.addEventListener('dragstart',()=>{dragSrcId=t.id;setTimeout(()=>c.classList.add('dragging'),0)});
  c.addEventListener('dragend',()=>{dragSrcId=null;c.classList.remove('dragging')});
  return c;
}

function updateHStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const todayStr=td();
  document.getElementById('hTotal').textContent=tasks.length;
  document.getElementById('hToday').textContent=tasks.filter(t=>t.column==="Aujourd'hui").length;
  document.getElementById('hDoneToday').textContent=allTasks.filter(t=>t.completed_at===todayStr).length;
  document.getElementById('hUrgent').textContent=tasks.filter(t=>{
    if(!t.due_date)return false;const d=new Date(t.due_date);d.setHours(0,0,0,0);return Math.ceil((d-now)/86400000)<=1;
  }).length;
}

// ════════════════════════════════════════════════════
// DRAG & DROP
// ════════════════════════════════════════════════════
function dropOnCol(col){

function renderHeatmaps() {
  const el = document.getElementById('dashHeatmaps');
  if (!el) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 364);

  // Align start to the Monday on or before cutoff
  const start = new Date(cutoff);
  const dow = start.getDay();
  start.setDate(start.getDate() - (dow === 0 ? 6 : dow - 1));

  // Count completions per category per date
  const catCounts = {};
  CATEGORIES.forEach(c => { catCounts[c] = {}; });
  habitsLog.forEach(l => {
    if (catCounts[l.category]) {
      catCounts[l.category][l.date] = (catCounts[l.category][l.date] || 0) + 1;
    }
  });

  const catRGB = {
    Finance:[252,211,77], Esprit:[167,139,250], Santé:[74,222,128], Productivité:[56,189,248]
  };

  el.innerHTML = CATEGORIES.filter(c => c !== 'Autre').map(cat => {
    const [r,g,b] = catRGB[cat];
    const counts = catCounts[cat];

    const cells = [];
    const d = new Date(start);
    while (d <= today) {
      const ds = d.toISOString().split('T')[0];
      const inRange = d >= cutoff;
      cells.push({ ds, count: inRange ? (counts[ds] || 0) : -1 });
      d.setDate(d.getDate() + 1);
    }
    while (cells.length % 7 !== 0) cells.push({ ds:'', count:-1 });

    const cellsHtml = cells.map(({ds, count}) => {
      let bg;
      if (count < 0) bg = 'transparent';
      else if (count === 0) bg = 'rgba(255,255,255,0.04)';
      else { const t = Math.min((count-1)/3, 1); bg = `rgba(${r},${g},${b},${0.25 + t*0.75})`; }
      const tip = ds ? (count > 0 ? `${ds} · ${count} habitude${count>1?'s':''}` : ds) : '';
      return `<div class="hm-cell" style="background:${bg}" title="${tip}"></div>`;
    }).join('');

    const legendHtml = [0,1,2,3,4].map(n => {
      const bg = n === 0 ? 'rgba(255,255,255,0.04)' : `rgba(${r},${g},${b},${0.25+(n-1)/3*0.75})`;
      return `<div class="hm-cell" style="background:${bg}"></div>`;
    }).join('');

    return `<div class="hm-box">
      <div class="hm-header">
        <span class="hm-title" style="color:rgba(${r},${g},${b},0.9)">${cat.toUpperCase()}</span>
        <div class="hm-legend">${legendHtml}<span class="hm-legend-label">1 → 4+</span></div>
      </div>
      <div class="hm-scroll"><div class="hm-grid">${cellsHtml}</div></div>
    </div>`;
  }).join('');
}

function parseTradeDate(raw) {
  // Returns "YYYY-MM-DD HH:mm:ss" for correct lexicographic sort (or "YYYY-MM-DD" if no time)
  if (!raw) return '';
  const s = String(raw).trim();
  // DD/MM/YYYY, HH:mm:ss  or  DD/MM/YYYY HH:mm:ss  (confirmed format for cols C & E)
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m1) {
    const [,d,mo,y,h,min,sec='00'] = m1;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')} ${h.padStart(2,'0')}:${min}:${sec}`;
  }
  // Excel serial number (e.g. 45123)
  if (/^\d{5}$/.test(s)) {
    const d = new Date((parseInt(s) - 25569) * 86400000);
    return d.toISOString().split('T')[0];
  }
  // DD/MM/YYYY (without time)
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
    const [d,mo,y] = s.split('/'); return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // Already ISO-like
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,19);
  const d = new Date(s);
  return isNaN(d) ? s.slice(0,19) : d.toISOString().replace('T',' ').slice(0,19);
}
// Display-only: strips time part for chart labels
const dateLabel = dt => dt ? dt.slice(0,10) : '';

async function loadCryptoData() {
  if (!accessToken) return;
  try {
    const r = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${CRYPTO_SHEET_ID}/values/Data!A:Z`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const rows = data.values || [];
    if (rows.length < 2) { cryptoTrades = []; cryptoLoaded = true; return; }

    // Confirmed column layout (user):
    //   B=1  buy price  |  C=2  open datetime  |  E=4  close datetime
    //   F=5  qty/amount |  G=6  net P&L (after tax) |  M=12 current qty
    const hdr = rows[0].map(h => String(h).toLowerCase().trim());
    const colIdx = (...names) => { for (const n of names) { const i = hdr.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
    const colMap = {
      date:     2,  // col C — confirmed DD/MM/YYYY, HH:mm:ss
      symbol:   colIdx('symbol','crypto','coin','pair','asset','devise','paire'),
      action:   colIdx('action','side','type','direction','sens','order'),
      invested: colIdx('invest','amount','capital','montant','buy_amount','mise'),
      net:      6,  // col G — confirmed
    };

    const parseNum = raw => parseFloat(String(raw||'').replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;

    cryptoTrades = rows.slice(1).filter(r => r.some(c => c !== '')).map((r, i) => {
      // Symbol: clean up pair notation (ADA/USDT → ADA)
      const rawSym = (colMap.symbol >= 0 ? r[colMap.symbol] || '' : '').toUpperCase().replace(/[\/-]?USDT?$|[\/-]?BUSD$|[\/-]?USD$/,'').trim();
      const sym = CRYPTOS.find(c => rawSym.includes(c.sym))?.sym || (rawSym || 'ADA');
      return {
        idx:      i,
        date:     parseTradeDate(r[2] || ''),   // col C — open datetime
        dateClose:parseTradeDate(r[4] || ''),   // col E — close datetime
        symbol:   sym,
        action:   colMap.action >= 0 ? r[colMap.action] || '' : '',
        price:    parseNum(r[1]),               // col B — buy price
        colF:     parseNum(r[5]),               // col F — qty/amount
        net:      parseNum(r[6]),               // col G — net P&L after tax
        invested: colMap.invested >= 0 ? parseNum(r[colMap.invested]) : 0,
        colM:     parseNum(r[12]),              // col M — current qty
      };
    }).filter(t => t.net !== 0 || t.symbol);

    cryptoLoaded = true;
  } catch(e) {
    console.error('Crypto load error', e);
    toast('Erreur chargement données CryptoBot', 'err');
    cryptoLoaded = true;
  }
}

      if (data[c.gecko]) cryptoPrices[c.sym] = { price: data[c.gecko].usd, change24h: data[c.gecko].usd_24h_change };
    });

}

async function fetchHodlComparison() {
  // For each active crypto: fetch price at first trade date → compute HODL % vs bot ROI
  const active = CRYPTOS.filter(c => cryptoTrades.some(t => t.symbol === c.sym && t.date));
  for (const c of active) {
    try {
      const dates = cryptoTrades.filter(t => t.symbol === c.sym && t.date).map(t => t.date).sort();
      const firstDate = dateLabel(dates[0]); // date part only for CoinGecko
      if (!firstDate || !cryptoPrices[c.sym]?.price) continue;
      const [y,m,d] = firstDate.split('-');
      const geckoDate = `${d}-${m}-${y}`;
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/${c.gecko}/history?date=${geckoDate}&localization=false`);
      if (!r.ok) continue;
      const data = await r.json();
      const histPrice = data.market_data?.current_price?.usd;
      if (histPrice) {
        const nowPrice = cryptoPrices[c.sym].price;
        cryptoPrices[c.sym].firstPrice = histPrice;
        cryptoPrices[c.sym].firstDate = firstDate;
        cryptoPrices[c.sym].hodlPct = (nowPrice - histPrice) / histPrice * 100;
      }
    } catch(e) { /* rate limit / offline — skip */ }
  }
}

function getCryptoStats(sym) {
  const list = sym ? cryptoTrades.filter(t => t.symbol === sym) : cryptoTrades;
  const winList  = list.filter(t => t.net > 0);
  const lossList = list.filter(t => t.net < 0);
  const totalNet = list.reduce((s, t) => s + t.net, 0);
  const totalInvested = list.reduce((s, t) => s + t.invested, 0);

  // Avg % gain / loss based on col G values directly (treated as % by user request)
  const avgGainPct = winList.length  ? winList.reduce((s,t)  => s + t.net, 0) / winList.length  : null;
  const avgLossPct = lossList.length ? lossList.reduce((s,t) => s + t.net, 0) / lossList.length : null;

  // P&L % from first to last price in col B (buy price tracked internally)
  let pricePct = null;
  const withPrice = list.filter(t => t.price > 0 && t.date);
  if (withPrice.length >= 2) {
    const sortedP = [...withPrice].sort((a,b) => a.date < b.date ? -1 : 1);
    const p0 = sortedP[0].price;
    const pn = sortedP[sortedP.length - 1].price;
    if (p0 > 0) pricePct = (pn - p0) / p0 * 100;
  }

  return {
    count: list.length, wins: winList.length, losses: lossList.length,
    winRate: list.length ? Math.round(winList.length / list.length * 100) : 0,
    totalNet, totalInvested,
    pct: totalInvested > 0 ? totalNet / totalInvested * 100 : null,
    avgNet: list.length ? totalNet / list.length : 0,
    avgGainPct, avgLossPct, pricePct,
  };
}

function calcPortfolioValue() {
  // For each crypto: last row (by date) → col M × col F = position value
  let total = 0;
  CRYPTOS.forEach(c => {
    const trades = cryptoTrades.filter(t => t.symbol === c.sym && t.date);
    if (!trades.length) return;
    const last = [...trades].sort((a,b) => a.date < b.date ? -1 : 1).at(-1);
    const val = (last.colM || 0) * (last.colF || 0);
    if (val > 0 && isFinite(val)) total += val;
  });
  return total;
}

  renderCryptoChartsA();
  renderCryptoChartsB();
  renderCryptoTable();
}

async function reloadCryptoData() {
  cryptoLoaded = false; cryptoPrices = {}; cryptoTrades = [];
  Object.values(cryptoCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  cryptoCharts = {};
  renderCryptoBot();
}

function renderCryptoBanner() {
  const g = getCryptoStats(null);
  const active = CRYPTOS.map(c => ({ c, n: getCryptoStats(c.sym).totalNet })).filter(x => x.n !== 0);
  const best = [...active].sort((a,b) => b.n - a.n)[0];
  const portfolio = calcPortfolioValue();
  const portfolioStr = portfolio > 0 ? portfolio.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'$' : '—';

  document.getElementById('crpBanner').innerHTML = `
    <div class="crp-kpi">
      <div class="crp-kpi-lbl">P&L NET TOTAL</div>
      <div class="crp-kpi-val" style="color:${crpCol(g.totalNet)}">${crpFmt(g.totalNet)}</div>
      <div class="crp-kpi-sub">après taxes · moy. ${crpFmt(g.avgNet)} / trade</div>
    </div>
    <div class="crp-kpi">
      <div class="crp-kpi-lbl">TRADES TOTAL</div>
      <div class="crp-kpi-val" style="color:var(--accent)">${g.count}</div>
      <div class="crp-kpi-sub">${g.wins} gagnants · ${g.losses} perdants</div>
    </div>
    <div class="crp-kpi">
      <div class="crp-kpi-lbl">WIN RATE</div>
      <div class="crp-kpi-val" style="color:${g.winRate>=50?'var(--green)':'var(--warn)'}">${g.winRate}%</div>
      <div class="crp-kpi-sub">
        ${g.avgGainPct!=null?`moy. gain ${crpSign(g.avgGainPct)}${g.avgGainPct.toFixed(2)}%`:''}&nbsp;
        ${g.avgLossPct!=null?`· perte ${g.avgLossPct.toFixed(2)}%`:''}
      </div>
    </div>
    <div class="crp-kpi">
      <div class="crp-kpi-lbl">PORTEFEUILLE GLOBAL</div>
      <div class="crp-kpi-val" style="color:var(--gld);font-size:1.3rem">${portfolioStr}</div>
      <div class="crp-kpi-sub">Σ (dernière ligne · col M × col F)</div>
    </div>
    <div class="crp-kpi">
      <div class="crp-kpi-lbl">MEILLEURE CRYPTO</div>
      <div class="crp-kpi-val" style="color:${best ? CRYPTOS.find(c=>c.sym===best.c.sym).hex : 'var(--text-dim)'}">${best ? best.c.sym : '—'}</div>
      <div class="crp-kpi-sub">${best ? crpFmt(best.n)+' net' : 'aucune donnée'}</div>
    </div>`;
}

function renderCryptoCards() {
  document.getElementById('crpCards').innerHTML = CRYPTOS.map(c => {
    const g = getCryptoStats(c.sym);
    const hasData = g.count > 0;
    const price = cryptoPrices[c.sym];

    const priceBlock = price ? `
      <div class="crp-sep"></div>
      <div class="crp-stat"><span class="crp-stat-l">PRIX USD</span>
        <span class="crp-stat-v" style="font-size:0.6rem">$${price.price < 1 ? price.price.toFixed(4) : price.price.toLocaleString('en-US',{maximumFractionDigits:2})}</span></div>
      <div class="crp-stat"><span class="crp-stat-l">24H</span>
        <span class="crp-stat-v" style="color:${price.change24h>=0?'var(--green)':'var(--danger)'};font-size:0.6rem">${crpSign(price.change24h??0)}${(price.change24h??0).toFixed(2)}%</span></div>
      ${price.hodlPct!=null ? `<div class="crp-stat"><span class="crp-stat-l">HODL (période)</span><span class="crp-stat-v" style="color:${price.hodlPct>=0?'var(--green)':'var(--danger)'};font-size:0.6rem">${crpSign(price.hodlPct)}${price.hodlPct.toFixed(2)}%</span></div>` : ''}
    ` : '';

    const statsBlock = hasData ? `
      <div class="crp-stat"><span class="crp-stat-l">P&L NET</span>
        <span class="crp-stat-v" style="color:${crpCol(g.totalNet)}">${crpFmt(g.totalNet)}</span></div>
      <div class="crp-stat"><span class="crp-stat-l">TRADES</span>
        <span class="crp-stat-v">${g.count} <span style="color:var(--text-dim);font-size:0.52rem">(${g.wins}W/${g.losses}L)</span></span></div>
      <div class="crp-stat"><span class="crp-stat-l">WIN RATE</span>
        <span class="crp-stat-v" style="color:${g.winRate>=50?'var(--green)':'var(--warn)'}">${g.winRate}%</span></div>
      ${g.avgGainPct!=null?`<div class="crp-stat"><span class="crp-stat-l">MOY. GAINS %</span>
        <span class="crp-stat-v" style="color:var(--green);font-size:0.62rem">${crpSign(g.avgGainPct)}${g.avgGainPct.toFixed(2)}%</span></div>`:''}
      ${g.avgLossPct!=null?`<div class="crp-stat"><span class="crp-stat-l">MOY. PERTES %</span>
        <span class="crp-stat-v" style="color:var(--danger);font-size:0.62rem">${g.avgLossPct.toFixed(2)}%</span></div>`:''}
      ${g.pricePct!=null?`<div class="crp-stat"><span class="crp-stat-l">P&L PRIX (B)</span>
        <span class="crp-stat-v" style="color:${crpCol(g.pricePct)};font-size:0.62rem">${crpSign(g.pricePct)}${g.pricePct.toFixed(2)}%</span></div>`:''}
    ` : `<div class="crp-empty" style="padding:1.2rem 0;font-size:0.5rem">AUCUN TRADE</div>`;

    return `<div class="crp-card ${c.sym.toLowerCase()}${!hasData?' nodata':''}">
      <div class="crp-sym" style="color:${c.hex}">${c.sym}</div>
      <div class="crp-name">${c.name}</div>
      ${statsBlock}${priceBlock}
    </div>`;
  }).join('');
}

function renderCryptoChartsA() {
  // Chart A1: Cumulative P&L line  |  Chart A2: P&L total par crypto bar
  ['cCrpCumul','cCrpComp'].forEach(id => { if (cryptoCharts[id]) { try { cryptoCharts[id].destroy(); } catch(e){} } });

  document.getElementById('crpChartsA').innerHTML = `
    <div class="crp-box">
      <div class="crp-box-hdr"><span class="crp-box-ttl">ÉVOLUTION CUMULATIVE DU P&L NET</span></div>
      <div class="crp-wrap tall"><canvas id="cCrpCumul"></canvas></div>
    </div>
    <div class="crp-box">
      <div class="crp-box-hdr"><span class="crp-box-ttl">P&L TOTAL PAR CRYPTO</span></div>
      <div class="crp-wrap tall"><canvas id="cCrpComp"></canvas></div>
    </div>`;

  // Cumulative P&L — sorted by date
  const sorted = [...cryptoTrades].sort((a,b) => {
    if (!a.date && !b.date) return 0; if (!a.date) return 1; if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });
  let cumul = 0;
  const cumulLabels = [], cumulVals = [], cumulPtColors = [];
  sorted.forEach(t => {
    cumul += t.net; cumul = parseFloat(cumul.toFixed(2));
    cumulLabels.push(t.date ? dateLabel(t.date) : `#${t.idx+1}`);
    cumulVals.push(cumul);
    const cc = CRYPTOS.find(x => x.sym === t.symbol);
    cumulPtColors.push(cc ? `rgba(${cc.rgb},0.9)` : 'rgba(124,106,255,0.9)');
  });

  if (cumulVals.length) {
    cryptoCharts.cCrpCumul = new Chart(document.getElementById('cCrpCumul'), {
      type: 'line',
      data: { labels: cumulLabels, datasets: [{ data: cumulVals,
        borderColor: 'rgba(124,106,255,0.9)', backgroundColor: 'rgba(124,106,255,0.06)',
        borderWidth: 2, fill: true, tension: 0.3,
        pointBackgroundColor: cumulPtColors, pointRadius: cumulVals.length > 60 ? 2 : 4, pointHoverRadius: 6 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip:{ callbacks:{
          label: i => ` Cumul: ${i.raw>=0?'+':''}${i.raw.toFixed(2)}$`,
          title: items => { const t = sorted[items[0].dataIndex]; return t ? `${t.symbol} · ${t.date||''}` : ''; },
        }}},
        scales: {
          x: { ticks:{font:{family:'Space Mono',size:8},maxTicksLimit:10}, grid:{color:'#1c1c28'} },
          y: { ticks:{font:{family:'Space Mono',size:9},callback:v=>`${v}$`}, grid:{color:'#1c1c28'} }
        }
      }
    });
  }

  // P&L par crypto bar
  const compVals = CRYPTOS.map(c => parseFloat(getCryptoStats(c.sym).totalNet.toFixed(2)));
  cryptoCharts.cCrpComp = new Chart(document.getElementById('cCrpComp'), {
    type: 'bar',
    data: { labels: CRYPTOS.map(c=>c.sym), datasets: [{
      data: compVals,
      backgroundColor: CRYPTOS.map(c => compVals[CRYPTOS.indexOf(c)] >= 0 ? `rgba(${c.rgb},0.72)` : `rgba(${c.rgb},0.35)`),
      borderColor: CRYPTOS.map(c=>c.hex), borderWidth:1, borderRadius:3
    }]},
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: i => ` ${i.raw>=0?'+':''}${i.raw.toFixed(2)}$` }}},
      scales:{
        x:{ticks:{font:{family:'Space Mono',size:9}},grid:{display:false}},
        y:{ticks:{font:{family:'Space Mono',size:9},callback:v=>`${v}$`},grid:{color:'#1c1c28'}}
      }
    }
  });
}

function renderCryptoChartsB() {
  // Chart B1: P&L par trade (last 50)  |  Chart B2: Bot ROI vs HODL
  ['cCrpTrades','cCrpHodl'].forEach(id => { if (cryptoCharts[id]) { try { cryptoCharts[id].destroy(); } catch(e){} } });

  const hodlAvail = CRYPTOS.some(c => cryptoPrices[c.sym]?.hodlPct != null);
  const hodlNote = hodlAvail ? 'depuis le premier trade détecté' : 'chargement données marché...';

  document.getElementById('crpChartsB').innerHTML = `
    <div class="crp-box">
      <div class="crp-box-hdr"><span class="crp-box-ttl">P&L PAR TRADE (50 DERNIERS)</span></div>
      <div class="crp-wrap"><canvas id="cCrpTrades"></canvas></div>
    </div>
    <div class="crp-box">
      <div class="crp-box-hdr"><span class="crp-box-ttl">BOT ROI% vs HODL%</span></div>
      <div class="crp-wrap"><canvas id="cCrpHodl"></canvas></div>
      <div class="crp-hodl-note">HODL : ${hodlNote}</div>
    </div>`;

  // P&L per trade (last 50, sorted by date)
  const sorted50 = [...cryptoTrades].sort((a,b) => {
    if (!a.date&&!b.date) return 0; if (!a.date) return 1; if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  }).slice(-50);

  if (sorted50.length) {
    cryptoCharts.cCrpTrades = new Chart(document.getElementById('cCrpTrades'), {
      type: 'bar',
      data: { labels: sorted50.map((t,i) => t.date ? dateLabel(t.date).slice(5) : `#${i+1}`),
        datasets: [{ data: sorted50.map(t => parseFloat(t.net.toFixed(2))),
          backgroundColor: sorted50.map(t => { const cc=CRYPTOS.find(x=>x.sym===t.symbol); return t.net>=0 ? `rgba(${cc?.rgb||'124,106,255'},0.72)` : `rgba(${cc?.rgb||'248,113,113'},0.4)`; }),
          borderColor: sorted50.map(t => { const cc=CRYPTOS.find(x=>x.sym===t.symbol); return cc?.hex||'#7c6aff'; }),
          borderWidth:1, borderRadius:2
        }]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{
          label: i => ` ${sorted50[i.dataIndex].symbol} · ${i.raw>=0?'+':''}${i.raw.toFixed(2)}$`,
          title: items => sorted50[items[0].dataIndex]?.date || ''
        }}},
        scales:{
          x:{ticks:{font:{family:'Space Mono',size:7},maxRotation:45,maxTicksLimit:15},grid:{color:'#1c1c28'}},
          y:{ticks:{font:{family:'Space Mono',size:9},callback:v=>`${v}$`},grid:{color:'#1c1c28'}}
        }
      }
    });
  }

  // Bot ROI% vs HODL%
  const activeCryptos = CRYPTOS.filter(c => getCryptoStats(c.sym).count > 0);
  const botRoiVals = activeCryptos.map(c => { const g=getCryptoStats(c.sym); return g.pct !== null ? parseFloat(g.pct.toFixed(2)) : 0; });
  const hodlVals   = activeCryptos.map(c => cryptoPrices[c.sym]?.hodlPct != null ? parseFloat(cryptoPrices[c.sym].hodlPct.toFixed(2)) : null);

  cryptoCharts.cCrpHodl = new Chart(document.getElementById('cCrpHodl'), {
    type: 'bar',
    data: {
      labels: activeCryptos.map(c=>c.sym),
      datasets: [
        { label: 'Bot ROI %', data: botRoiVals,
          backgroundColor: activeCryptos.map(c=>`rgba(${c.rgb},0.75)`),
          borderColor: activeCryptos.map(c=>c.hex), borderWidth:1, borderRadius:3 },
        { label: 'HODL %', data: hodlVals,
          backgroundColor: 'rgba(255,255,255,0.1)', borderColor:'rgba(255,255,255,0.28)',
          borderWidth:1, borderRadius:3 }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:true, labels:{font:{family:'Space Mono',size:8},boxWidth:9,color:'#60607a',padding:8} },
        tooltip:{ callbacks:{ label: i => ` ${i.dataset.label}: ${i.raw!=null?(i.raw>=0?'+':'')+i.raw.toFixed(2)+'%':'N/A'}` }}
      },
      scales:{
        x:{ticks:{font:{family:'Space Mono',size:9}},grid:{display:false}},
        y:{ticks:{font:{family:'Space Mono',size:9},callback:v=>v+'%'},grid:{color:'#1c1c28'}}
      }
    }
  });
}

function renderCryptoTable() {
  const el = document.getElementById('crpTradeTable');
  if (!cryptoTrades.length) {
    el.innerHTML = '<div class="crp-empty">AUCUN TRADE CHARGÉ</div>'; return;
  }
  const sorted = [...cryptoTrades].sort((a,b) => {
    if (!a.date&&!b.date) return 0; if (!a.date) return 1; if (!b.date) return -1;
    return a.date > b.date ? -1 : 1;
  });
  const rows = sorted.slice(0, 100).map(t => {
    const cc = CRYPTOS.find(x => x.sym === t.symbol);
    const cls = t.net >= 0 ? 'crp-pos' : 'crp-neg';
    return `<tr>
      <td>${t.date ? dateLabel(t.date) : '—'}</td>
      <td style="color:${cc?.hex||'var(--text)'};font-weight:700">${t.symbol}</td>
      <td style="color:var(--text-dim)">${t.action||'—'}</td>
      <td>${t.invested > 0 ? t.invested.toFixed(2)+'$' : '—'}</td>
      <td class="${cls}">${crpFmt(t.net)}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="crp-table">
    <thead><tr><th>DATE</th><th>CRYPTO</th><th>ACTION</th><th>INVESTI</th><th>NET P&L</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>${sorted.length > 100 ? `<div class="crp-hodl-note" style="text-align:right;margin-top:0.5rem">Affichage des 100 trades les plus récents sur ${sorted.length}</div>` : ''}`;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeHabitModal();}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    if(document.getElementById('taskModal').classList.contains('open'))saveTask();
    if(document.getElementById('habitModal').classList.contains('open'))saveHabit();
  }
});
document.getElementById('taskModal').addEventListener('click',e=>{if(e.target===document.getElementById('taskModal'))closeModal();});
document.getElementById('habitModal').addEventListener('click',e=>{if(e.target===document.getElementById('habitModal'))closeHabitModal();});

init();
</script>
