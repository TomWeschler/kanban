<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANBAN OPS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2309090e'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='%237c6aff' opacity='0.15'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='none' stroke='%237c6aff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237c6aff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#09090e;--surface:#0f0f17;--surface2:#16161f;--surface3:#1c1c28;
  --border:#252535;--border2:#32324a;
  --accent:#7c6aff;--accent-dim:rgba(124,106,255,0.12);
  --text:#e4e4f0;--text-dim:#60607a;--text-mid:#9898b8;
  --green:#4ade80;--warn:#fbbf24;--danger:#f87171;
  --dcb:#38bdf8;--gld:#fcd34d;--air:#6ee7b7;--perso:#c084fc;
  --imp1:#4ade80;--imp2:#a3e635;--imp3:#fbbf24;--imp4:#fb923c;--imp5:#f87171;
  --cat-finance:#fcd34d;--cat-esprit:#a78bfa;--cat-sante:#4ade80;--cat-prod:#38bdf8;--cat-autre:#94a3b8;
  --font-body:'Syne',sans-serif;
  --font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;display:flex;flex-direction:column}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}

/* HEADER */
header{flex-shrink:0;height:56px;background:var(--bg);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:0.75rem;z-index:200;position:relative}
.logo{font-family:'Space Mono',monospace;font-size:0.68rem;font-weight:700;letter-spacing:0.3em;color:var(--accent);white-space:nowrap;flex-shrink:0}
.nav-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.nav-tabs{display:flex;gap:0.1rem;flex-shrink:0}
.nav-tab{background:none;border:none;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;padding:0.3rem 0.65rem;border-bottom:2px solid transparent;transition:color 0.13s,border-color 0.13s;white-space:nowrap}
.nav-tab:hover{color:var(--text-mid)}
.nav-tab.active{color:var(--accent);border-color:var(--accent)}
.proj-shortcuts{display:flex;gap:0.35rem;flex-shrink:0}
.proj-btn{font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;letter-spacing:0.1em;padding:0.28rem 0.6rem;border:1px solid;cursor:pointer;transition:all 0.13s;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%)}
.proj-btn.dcb{color:var(--dcb);border-color:rgba(56,189,248,0.28);background:rgba(56,189,248,0.06)}.proj-btn.dcb:hover{background:rgba(56,189,248,0.14)}
.proj-btn.gld{color:var(--gld);border-color:rgba(252,211,77,0.28);background:rgba(252,211,77,0.06)}.proj-btn.gld:hover{background:rgba(252,211,77,0.14)}
.proj-btn.air{color:var(--air);border-color:rgba(110,231,183,0.28);background:rgba(110,231,183,0.06)}.proj-btn.air:hover{background:rgba(110,231,183,0.14)}
.proj-btn.perso{color:var(--perso);border-color:rgba(192,132,252,0.28);background:rgba(192,132,252,0.06)}.proj-btn.perso:hover{background:rgba(192,132,252,0.14)}
.header-right{display:flex;align-items:center;gap:0.75rem;margin-left:auto;flex-shrink:0}
.sync-status{font-family:'Space Mono',monospace;font-size:0.56rem;letter-spacing:0.07em;color:var(--text-dim);display:flex;align-items:center;gap:0.3rem;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.ok{animation:pulse 2.5s infinite}.sync-dot.syncing{background:var(--warn);animation:blink 0.5s infinite}.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.hstat{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.07em;color:var(--text-dim);display:flex;align-items:center;gap:0.25rem;white-space:nowrap}
.hstat b{color:var(--text);font-size:0.72rem}
.btn-nav{background:var(--accent);color:#fff;border:none;font-family:'Syne',sans-serif;font-size:0.73rem;font-weight:700;padding:0.3rem 0.8rem;cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:background 0.13s;white-space:nowrap}
.btn-nav:hover{background:#9585ff}
.btn-nav.out{background:transparent;clip-path:none;border:1px solid var(--border);color:var(--text-dim)}.btn-nav.out:hover{color:var(--text);border-color:var(--text-mid)}
.app-version{font-family:'Space Mono',monospace;font-size:0.56rem;font-weight:700;letter-spacing:0.08em;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(124,106,255,0.3);border-radius:4px;padding:0.18rem 0.45rem;white-space:nowrap;user-select:none}

/* PAGES */
.page{display:none;flex:1;overflow:hidden;position:relative;z-index:1}
.page.active{display:flex;flex-direction:column}

/* BOARD */
#pageboard{overflow:hidden}
.board-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;flex-direction:column}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:0.65rem;padding:0.9rem 1rem 2rem;min-width:1080px;height:100%}
.column{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:border-color 0.17s}
.column.drag-over{border-color:var(--accent);box-shadow:inset 0 0 28px rgba(124,106,255,0.05)}
.col-header{padding:0.65rem 0.8rem 0.55rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.col-title{font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-mid)}
.col-count{font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.column[data-col="BackLog"] .col-header{border-left:2px solid #3a3a55}
.column[data-col="Ce mois"] .col-header{border-left:2px solid #6366f1}
.column[data-col="Cette semaine"] .col-header{border-left:2px solid #8b5cf6}
.column[data-col="Demain"] .col-header{border-left:2px solid var(--warn)}
.column[data-col="Aujourd'hui"] .col-header{border-left:2px solid var(--danger)}
.col-body{padding:0.55rem;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.45rem}
.col-body::-webkit-scrollbar{width:3px}.col-body::-webkit-scrollbar-thumb{background:var(--border2)}

/* CARDS */
.card{background:var(--surface2);border:1px solid var(--border);padding:0.6rem 0.6rem 0.45rem;cursor:grab;transition:transform 0.12s,box-shadow 0.12s,border-color 0.14s,opacity 0.18s;position:relative;overflow:hidden;animation:cardIn 0.17s ease-out;flex-shrink:0}
@keyframes cardIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(124,106,255,0.33);box-shadow:0 4px 18px rgba(0,0,0,0.42);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:0.2;transform:rotate(1.5deg)}
.card-tag{position:absolute;top:0;right:0;font-family:'Space Mono',monospace;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;padding:4px 10px}
.card-tag.dcb{background:rgba(56,189,248,0.18);color:var(--dcb);border-bottom:1px solid rgba(56,189,248,0.4);border-left:1px solid rgba(56,189,248,0.4)}.card-tag.gld{background:rgba(252,211,77,0.18);color:var(--gld);border-bottom:1px solid rgba(252,211,77,0.4);border-left:1px solid rgba(252,211,77,0.4)}.card-tag.air{background:rgba(110,231,183,0.18);color:var(--air);border-bottom:1px solid rgba(110,231,183,0.4);border-left:1px solid rgba(110,231,183,0.4)}.card-tag.perso{background:rgba(192,132,252,0.18);color:var(--perso);border-bottom:1px solid rgba(192,132,252,0.4);border-left:1px solid rgba(192,132,252,0.4)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px}
.card[data-imp="1"]::before{background:var(--imp1)}.card[data-imp="2"]::before{background:var(--imp2)}.card[data-imp="3"]::before{background:var(--imp3)}.card[data-imp="4"]::before{background:var(--imp4)}.card[data-imp="5"]::before{background:var(--imp5)}
.card.a-warn{border-color:rgba(251,191,36,0.43)}.card.a-danger{border-color:rgba(248,113,113,0.62);box-shadow:0 0 9px rgba(248,113,113,0.11)}
.card-title{font-size:0.78rem;font-weight:600;line-height:1.35;color:var(--text);padding-left:10px;margin-bottom:0.45rem;word-break:break-word;padding-right:2rem}
.card-meta{display:flex;align-items:center;justify-content:space-between;padding-left:10px}
.imp-dots{display:flex;gap:3px}
.idot{width:7px;height:7px;border-radius:50%;opacity:0.18}.idot.on{opacity:1}
.idot-1{background:var(--imp1)}.idot-2{background:var(--imp2)}.idot-3{background:var(--imp3)}.idot-4{background:var(--imp4)}.idot-5{background:var(--imp5)}
.due-badge{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.05em;padding:2px 5px}
.due-badge.normal{color:var(--text-dim);background:rgba(255,255,255,0.03)}.due-badge.warn{color:var(--warn);background:rgba(251,191,36,0.09)}.due-badge.danger{color:var(--danger);background:rgba(248,113,113,0.09)}.due-badge.overdue{color:#fff;background:var(--danger)}
.card-notes{font-size:0.65rem;color:var(--text-dim);font-style:italic;padding:0.28rem 0 0 6px;margin-top:0.35rem;border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:0.3rem;margin-top:0.45rem;padding-left:6px}
.btn-done{background:rgba(74,222,128,0.07);border:1px solid rgba(74,222,128,0.22);color:var(--green);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;padding:2px 7px;cursor:pointer;text-transform:uppercase;transition:background 0.11s}.btn-done:hover{background:rgba(74,222,128,0.17)}
.btn-edit{background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--text-dim);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;padding:2px 7px;cursor:pointer;text-transform:uppercase;transition:background 0.11s,color 0.11s}.btn-edit:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.col-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.85rem;color:var(--text-dim);font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.12em;padding:1rem}
.col-empty-gif{width:130px;height:130px;border-radius:8px;object-fit:cover;opacity:0.55;filter:saturate(1.05);box-shadow:0 4px 18px rgba(0,0,0,0.4);transition:opacity 0.25s,transform 0.25s}
.col-empty-gif:hover{opacity:0.85;transform:scale(1.04)}
.col-empty-txt{opacity:0.55;letter-spacing:0.18em}

/* BOARD FILTER BAR */
.board-filters{flex-shrink:0;display:flex;align-items:center;gap:0.35rem;padding:0.5rem 1rem;border-bottom:1px solid var(--border);background:rgba(9,9,14,0.7)}
.board-filter{font-family:'Space Mono',monospace;font-size:0.56rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.26rem 0.7rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);transition:all 0.13s}
.board-filter:hover{color:var(--text);border-color:var(--text-mid)}
.board-filter.active{color:var(--bg);border-color:transparent;background:var(--text-mid)}
.board-filter.active.f-all{background:var(--accent)}
.board-filter.active.f-dcb{background:var(--dcb);color:#09090e}
.board-filter.active.f-gld{background:var(--gld);color:#09090e}
.board-filter.active.f-air{background:var(--air);color:#09090e}
.board-filter.active.f-perso{background:var(--perso)}

/* DASHBOARD */
#pageobjectifs{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1.1rem;flex-direction:column}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem;margin-bottom:1.1rem}
.kpi{background:var(--surface);border:1px solid var(--border);padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:0.35rem}
.kpi-label{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim)}
.kpi-value{font-family:'Space Mono',monospace;font-size:1.9rem;font-weight:700;line-height:1}
.kpi-sub{font-size:0.7rem;color:var(--text-dim)}
.kpi.c-accent .kpi-value{color:var(--accent)}.kpi.c-green .kpi-value{color:var(--green)}.kpi.c-warn .kpi-value{color:var(--warn)}.kpi.c-danger .kpi-value{color:var(--danger)}
.proj-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.85rem;margin-bottom:1.1rem}
.proj-kpi{background:var(--surface);border:1px solid var(--border);padding:0.9rem 1.1rem;display:flex;flex-direction:column;gap:0.3rem}
.proj-kpi-label{font-family:'Space Mono',monospace;font-size:0.63rem;font-weight:700;letter-spacing:0.14em}
.proj-kpi-label.dcb{color:var(--dcb)}.proj-kpi-label.gld{color:var(--gld)}.proj-kpi-label.air{color:var(--air)}
.proj-kpi-val{font-family:'Space Mono',monospace;font-size:1.55rem;font-weight:700;color:var(--text)}
.proj-kpi-sub{font-size:0.68rem;color:var(--text-dim)}
.charts-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.85rem}
.chart-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}
.chart-title{font-family:'Space Mono',monospace;font-size:0.57rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-mid);margin-bottom:0.9rem}
.chart-wrap{position:relative;height:190px}.chart-wrap.tall{height:220px}

/* ═══════════════════════════════
   HABITUDES PAGE
═══════════════════════════════ */
#pagehabits{overflow-y:auto;flex-direction:column}
.hg-wrap{padding:1.4rem 1.6rem 3rem;display:flex;flex-direction:column;gap:1.15rem}

/* Header row: title + KPIs */
.hg-header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.hg-title{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.22em;font-weight:700;color:var(--accent);text-transform:uppercase}
.hg-kpis{display:flex;gap:1.8rem}
.hg-kpi-lbl{font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.15em;color:var(--text-mid);text-transform:uppercase;margin-bottom:0.2rem}
.hg-kpi-val{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;line-height:1}
.hg-kpi-val.gold{color:var(--gld)}.hg-kpi-val.green{color:var(--green)}.hg-kpi-val.accent{color:var(--accent)}

/* Toolbar: week nav + filters + add */
.hg-toolbar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
.hg-weeknav{display:flex;align-items:center;gap:0.5rem}
.hg-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-mid);width:28px;height:28px;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all 0.13s;border-radius:6px}
.hg-nav-btn:hover{color:var(--text);border-color:var(--text-mid)}
.hg-week-label{font-family:var(--font-mono);font-size:0.62rem;font-weight:700;letter-spacing:0.04em;color:var(--text);min-width:185px;text-align:center}
.hg-today-btn{font-family:var(--font-mono);font-size:0.52rem;letter-spacing:0.1em;padding:0.34rem 0.7rem;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;text-transform:uppercase;border-radius:6px}
.hg-today-btn:hover{color:var(--accent);border-color:var(--accent)}
.hg-spacer{flex:1}
.hg-pill{font-family:var(--font-mono);font-size:0.56rem;letter-spacing:0.08em;font-weight:700;padding:0.32rem 0.75rem;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.13s;text-transform:uppercase;border-radius:99px}
.hg-pill:hover{color:var(--text);border-color:var(--text-mid)}
.hg-pill.active{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.hg-pill.active.Finance{background:var(--cat-finance);color:#09090e}
.hg-pill.active.Esprit{background:var(--cat-esprit)}
.hg-pill.active.Santé{background:var(--cat-sante);color:#09090e}
.hg-pill.active.Productivité{background:var(--cat-prod);color:#09090e}
.hg-pill.active.Autre{background:var(--cat-autre);color:#09090e}
.hg-add-btn{font-family:var(--font-mono);font-size:0.56rem;letter-spacing:0.1em;font-weight:700;padding:0.36rem 0.85rem;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);cursor:pointer;transition:all 0.15s;text-transform:uppercase;border-radius:99px}
.hg-add-btn:hover{background:var(--accent);color:var(--bg)}

/* Weekly grid table */
.hg-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.hg-table th,.hg-table td{padding:0;text-align:center;vertical-align:middle}
.hg-table thead th{padding:0.7rem 0.3rem 0.6rem;border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.hg-th-name{text-align:left !important;padding-left:1rem !important;font-size:0.54rem;letter-spacing:0.18em;color:var(--text-mid);text-transform:uppercase}
.hg-day-head{width:62px}
.hg-day-dow{font-size:0.5rem;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase}
.hg-day-num{font-size:0.92rem;font-weight:700;color:var(--text-mid);margin-top:0.15rem;line-height:1}
.hg-col-today .hg-day-dow{color:var(--accent)}
.hg-col-today .hg-day-num{color:var(--accent)}
.hg-th-week{width:74px;font-size:0.5rem;letter-spacing:0.12em;color:var(--text-mid);text-transform:uppercase}
.hg-col-today{background:var(--accent-dim)}

.hg-row{border-bottom:1px solid var(--border)}
.hg-row:last-child td{border-bottom:none}
.hg-row td{border-bottom:1px solid rgba(37,37,53,0.45)}
.hg-name-cell{text-align:left !important;padding:0.55rem 0.5rem 0.55rem 1rem !important;cursor:pointer;transition:background 0.12s}
.hg-name-cell:hover{background:rgba(255,255,255,0.02)}
.hg-name-inner{display:flex;align-items:center;gap:0.6rem}
.hg-name-icon{font-size:1rem;width:1.3rem;text-align:center;flex-shrink:0}
.hg-name-txt{min-width:0}
.hg-name-title{font-family:var(--font-body);font-size:0.84rem;font-weight:600;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;display:flex;align-items:center;gap:0.45rem}
.hg-cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.hg-name-meta{font-family:var(--font-mono);font-size:0.52rem;color:var(--text-dim);margin-top:0.15rem;display:flex;align-items:center;gap:0.6rem}
.hg-name-streak{color:var(--warn);font-weight:700}
.hg-name-reward{color:var(--green)}
.hg-paused-tag{font-family:var(--font-mono);font-size:0.42rem;letter-spacing:0.1em;color:var(--text-dim);border:1px solid var(--border);padding:1px 5px;border-radius:4px;text-transform:uppercase}

/* Day cells */
.hg-cell{padding:0.4rem !important}
.hg-dot{width:26px;height:26px;border-radius:8px;margin:0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.14s;border:1.5px solid var(--border2);background:var(--surface2);color:transparent;font-size:0.7rem;font-weight:700}
.hg-dot:hover{border-color:var(--text-mid);transform:scale(1.12)}
.hg-dot.done{color:#fff;border-color:transparent}
.hg-dot.done::after{content:'✓'}
.hg-dot.notdue{opacity:0.3;cursor:pointer}
.hg-dot.notdue:not(.done){border-style:dashed}
.hg-dot.future{opacity:0.18;cursor:not-allowed;pointer-events:none;border-style:dotted}
.hg-cell.hg-col-today .hg-dot{box-shadow:0 0 0 2px var(--accent-dim)}

.hg-week-cell{font-family:var(--font-mono);font-size:0.62rem;font-weight:700;color:var(--text-mid)}
.hg-week-cell .done-cnt{color:var(--green)}

.hg-foot td{padding:0.55rem 0.3rem !important;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:0.56rem;color:var(--text-dim)}
.hg-foot .hg-foot-lbl{text-align:left !important;padding-left:1rem !important;letter-spacing:0.15em;text-transform:uppercase}
.hg-foot-day b{color:var(--text);font-size:0.72rem}
.hg-foot-eur{color:var(--green);font-weight:700}

.hg-empty{text-align:center;padding:3rem 0;font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.12em;color:var(--text-dim);opacity:0.5}
.hg-sec-row td{padding:1rem 1rem 0.35rem !important;text-align:left !important;font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.22em;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--border2)}
.hg-foot+.hg-sec-row td{border-top:1.5px solid var(--border)}
.hg-day-filters{display:flex;gap:0.35rem}

/* Heatmap section */
.hg-hm-section{margin-top:1rem}
.hg-hm-title{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.2em;color:var(--text-mid);margin-bottom:0.7rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);align-items:center;justify-content:center}
.modal-bg.open{display:flex;animation:fadein 0.11s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border2);padding:1.6rem;width:410px;max-width:95vw;position:relative;animation:slideup 0.17s ease-out}
@keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.3rem}
.modal-close{position:absolute;top:0.9rem;right:0.9rem;background:none;border:none;color:var(--text-dim);font-size:1.05rem;cursor:pointer;line-height:1;transition:color 0.1s}.modal-close:hover{color:var(--text)}
.field{margin-bottom:0.85rem}
.field label{display:block;font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.3rem}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:0.83rem;padding:0.42rem 0.65rem;outline:none;transition:border-color 0.12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:50px}
.imp-row{display:flex;gap:0.35rem}
.imp-btn{flex:1;padding:0.42rem 0;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Space Mono',monospace;font-size:0.6rem;font-weight:700;transition:all 0.1s}
.imp-btn[data-v="1"]{color:var(--imp1)}.imp-btn[data-v="2"]{color:var(--imp2)}.imp-btn[data-v="3"]{color:var(--imp3)}.imp-btn[data-v="4"]{color:var(--imp4)}.imp-btn[data-v="5"]{color:var(--imp5)}
.imp-btn.sel[data-v="1"]{background:rgba(74,222,128,0.11);border-color:var(--imp1)}.imp-btn.sel[data-v="2"]{background:rgba(163,230,53,0.11);border-color:var(--imp2)}.imp-btn.sel[data-v="3"]{background:rgba(251,191,36,0.11);border-color:var(--imp3)}.imp-btn.sel[data-v="4"]{background:rgba(251,146,60,0.11);border-color:var(--imp4)}.imp-btn.sel[data-v="5"]{background:rgba(248,113,113,0.11);border-color:var(--imp5)}
.modal-footer{display:flex;gap:0.55rem;margin-top:1.1rem}
.btn-primary{flex:1;background:var(--accent);border:none;color:#fff;font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:700;padding:0.52rem;cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:background 0.12s}.btn-primary:hover{background:#9585ff}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-family:'Syne',sans-serif;font-size:0.78rem;padding:0.52rem 0.9rem;cursor:pointer;transition:color 0.12s,border-color 0.12s}.btn-secondary:hover{color:var(--text);border-color:var(--text-mid)}
.btn-del{background:rgba(248,113,113,0.07);border:1px solid rgba(248,113,113,0.22);color:var(--danger);font-family:'Syne',sans-serif;font-size:0.78rem;padding:0.52rem 0.85rem;cursor:pointer;transition:background 0.12s}.btn-del:hover{background:rgba(248,113,113,0.16)}

/* CAT RADIO BUTTONS */
.cat-row{display:flex;gap:0.35rem}
.cat-btn{flex:1;padding:0.42rem 0;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Space Mono',monospace;font-size:0.54rem;font-weight:700;letter-spacing:0.06em;transition:all 0.1s;color:var(--text-dim)}
.cat-btn.sel.Finance{background:rgba(252,211,77,0.12);border-color:var(--cat-finance);color:var(--cat-finance)}
.cat-btn.sel.Esprit{background:rgba(167,139,250,0.12);border-color:var(--cat-esprit);color:var(--cat-esprit)}
.cat-btn.sel.Santé{background:rgba(74,222,128,0.12);border-color:var(--cat-sante);color:var(--cat-sante)}
.cat-btn.sel.Productivité{background:rgba(56,189,248,0.12);border-color:var(--cat-prod);color:var(--cat-prod)}
.cat-btn.sel.Autre{background:rgba(148,163,184,0.12);border-color:var(--cat-autre);color:var(--cat-autre)}

/* AUTH SCREEN */
#authScreen{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;overflow:hidden}
#authScreen::before{content:'';position:absolute;inset:0;background-image:url('gifs/zen1.gif');background-size:cover;background-position:center;opacity:0.18;filter:blur(1px) saturate(1.1);z-index:0;animation:authFade 1.4s ease-out}
#authScreen::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,var(--bg) 85%);z-index:1}
@keyframes authFade{from{opacity:0}to{opacity:0.18}}
.auth-box{background:var(--surface);border:1px solid var(--border2);padding:2.25rem 2.75rem;width:440px;max-width:94vw;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;position:relative;z-index:2;box-shadow:0 18px 60px rgba(0,0,0,0.5)}
.auth-logo{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;letter-spacing:0.3em;color:var(--accent);margin-bottom:0.5rem}
.auth-desc{font-size:0.82rem;color:var(--text-mid);line-height:1.65;text-align:left}

/* LOADING */
#loadOverlay{position:fixed;inset:0;z-index:350;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;overflow:hidden}
#loadOverlay::before{content:'';position:absolute;inset:0;background-image:url('gifs/zen2.gif');background-size:cover;background-position:center;opacity:0.55;filter:saturate(1.15);z-index:0}
#loadOverlay::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.55) 100%);z-index:1}
#loadOverlay>*{position:relative;z-index:2}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;color:var(--accent);animation:pulse 1s infinite}

/* TOASTS */
.toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:500;display:flex;flex-direction:column;gap:0.35rem;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);padding:0.55rem 0.85rem;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.07em;animation:tin 0.16s ease-out,tout 0.22s ease-in 2.8s forwards}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--danger)}.toast.info{border-left:3px solid var(--accent)}
@keyframes tin{from{transform:translateX(12px);opacity:0}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(12px)}}
/* HEATMAPS */
.heatmaps-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.85rem;margin-top:0.85rem}
.hm-box{background:var(--surface);border:1px solid var(--border);padding:1rem 1.1rem}
.hm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem}
.hm-title{font-family:'Space Mono',monospace;font-size:0.57rem;letter-spacing:0.18em;font-weight:700}
.hm-legend{display:flex;align-items:center;gap:3px}
.hm-legend-label{font-family:'Space Mono',monospace;font-size:0.48rem;color:var(--text-dim);margin-left:4px}
.hm-scroll{overflow-x:auto}
.hm-scroll::-webkit-scrollbar{height:3px}
.hm-grid{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:2px;min-width:max-content;padding-bottom:2px}
.hm-cell{border-radius:2px;cursor:default}
.hm-cell:hover{filter:brightness(1.3)}

::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2)}

/* ═══════════════════════════════
   CRYPTOBOT PAGE
═══════════════════════════════ */
#pagecrypto{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1rem;flex-direction:column}
.crp-filters{display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;padding:0.65rem 0.85rem;background:var(--surface);border:1px solid var(--border);margin-bottom:-0.2rem}
.crp-filter-lbl{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.18em;color:var(--text-dim);text-transform:uppercase;margin-right:0.45rem}
.crp-filter{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;font-weight:700;padding:0.32rem 0.85rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.12s;text-transform:uppercase}
.crp-filter:hover{color:var(--text);border-color:var(--text-mid)}
.crp-filter.active{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.crp-filter-count{font-size:0.5rem;opacity:0.7;margin-left:0.35rem;letter-spacing:0.08em}
.crp-banner{display:grid;grid-template-columns:repeat(5,1fr);gap:0.85rem;background:linear-gradient(135deg,var(--accent-dim) 0%,rgba(124,106,255,0.03) 100%);border:1px solid var(--border2);padding:0.85rem;border-left:3px solid var(--accent);position:relative;box-shadow:0 4px 24px rgba(0,0,0,0.25)}
.crp-banner::before{content:'GLOBAL';position:absolute;top:8px;right:14px;font-family:'Space Mono',monospace;font-size:0.46rem;letter-spacing:0.25em;color:var(--accent);font-weight:700;opacity:0.7}
.crp-kpi{background:rgba(0,0,0,0.18);border:1px solid var(--border);padding:1rem 1.2rem;backdrop-filter:blur(6px)}
.crp-kpi-lbl{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.4rem}
.crp-kpi-val{font-family:'Space Mono',monospace;font-size:1.65rem;font-weight:700;line-height:1}
.crp-kpi-sub{font-size:0.67rem;color:var(--text-dim);margin-top:0.25rem}
.crp-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:0.85rem}
.crp-card{background:var(--surface);border:1px solid var(--border);padding:1rem 1.1rem;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.15s}
.crp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.crp-card.ada::before{background:#3b82f6}.crp-card.sol::before{background:#a855f7}
.crp-card.eth::before{background:#818cf8}.crp-card.xrp::before{background:#22d3ee}
.crp-card.bnb::before{background:#eab308}
.crp-card.nodata{opacity:0.48}
.crp-sym{font-family:'Space Mono',monospace;font-size:1.45rem;font-weight:700;letter-spacing:0.18em;margin-bottom:0.95rem;text-shadow:0 0 14px currentColor;filter:saturate(1.1)}
.crp-stat{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.36rem;gap:0.5rem}
.crp-stat-l{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--text-mid)}
.crp-stat-v{font-family:'Space Mono',monospace;font-size:0.78rem;font-weight:700;text-align:right;white-space:nowrap}
.crp-sep{height:1px;background:var(--border);margin:0.55rem 0}
.crp-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:0.45rem;letter-spacing:0.08em;padding:2px 6px;border:1px solid;margin-top:0.6rem}
.crp-badge.wait{color:var(--text-dim);border-color:var(--border)}
.crp-badge.active{color:var(--green);border-color:rgba(74,222,128,0.3);background:rgba(74,222,128,0.05)}
.crp-charts-a{display:grid;grid-template-columns:1fr;gap:0.85rem}
.crp-charts-b{display:grid;grid-template-columns:1fr 1fr;gap:0.85rem}
@media (max-width:1000px){.crp-charts-b{grid-template-columns:1fr}}
.crp-evol-row{display:grid;grid-template-columns:1fr 280px;gap:0.85rem}
.crp-evol-gif{border-radius:6px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.35);display:flex}
.crp-evol-gif img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.92;transition:opacity 0.2s}
.crp-evol-gif:hover img{opacity:1}
@media (max-width:1100px){.crp-evol-row{grid-template-columns:1fr}.crp-evol-gif{display:none}}
.crp-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}
.crp-box-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.crp-box-ttl{font-family:'Space Mono',monospace;font-size:0.53rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-mid)}
.crp-wrap{position:relative;height:190px}.crp-wrap.tall{height:220px}
.crp-table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:0.57rem}
.crp-table th{text-align:left;color:var(--text-dim);letter-spacing:0.1em;font-weight:400;padding:0.28rem 0.6rem;border-bottom:1px solid var(--border)}
.crp-table td{padding:0.32rem 0.6rem;border-bottom:1px solid rgba(37,37,53,0.4);color:var(--text)}
.crp-table tr:last-child td{border-bottom:none}
.crp-pos{color:var(--green)}.crp-neg{color:var(--danger)}
.crp-btn{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.08em;padding:0.2rem 0.55rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.12s}
.crp-btn:hover{color:var(--text);border-color:var(--text-mid)}
.crp-empty{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;color:var(--text-dim);opacity:0.42;text-align:center;padding:2.5rem 0}
.crp-hodl-note{font-family:'Space Mono',monospace;font-size:0.46rem;letter-spacing:0.07em;color:var(--text-dim);margin-top:0.4rem}

/* ═══════════════════════════════
   FINANCES PAGE
═══════════════════════════════ */
#pagefinances{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1rem;flex-direction:column}
.fin-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem}
.fin-kpi{background:var(--surface);border:1px solid var(--border);padding:1rem 1.2rem}
.fin-kpi-lbl{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.4rem}
.fin-kpi-val{font-family:'Space Mono',monospace;font-size:1.55rem;font-weight:700;line-height:1}
.fin-kpi-sub{font-size:0.65rem;color:var(--text-dim);margin-top:0.28rem}
.fin-section{margin-top:0.15rem}
.fin-section-lbl{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.65rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
/* accounts */
.fin-accounts-wrap{display:flex;gap:0.7rem;align-items:stretch}
.fin-accounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:0.45rem;flex:1;min-width:0}
.fin-accounts-gif{flex-shrink:0;width:260px;border-radius:6px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.35);align-self:stretch;display:flex}
.fin-accounts-gif img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.92;transition:opacity 0.2s}
.fin-accounts-gif:hover img{opacity:1}
@media (max-width:1100px){.fin-accounts-gif{display:none}}
.fin-account{background:var(--surface);border:1px solid var(--border);padding:0.55rem 0.65rem;position:relative;overflow:hidden;transition:border-color 0.15s}
.fin-account:hover{border-color:var(--border2)}
.fin-account-name{font-family:'Space Mono',monospace;font-size:0.48rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-mid);margin-bottom:0.32rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-account-val{font-family:'Space Mono',monospace;font-size:0.92rem;font-weight:700;line-height:1;margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-account-delta{font-family:'Space Mono',monospace;font-size:0.5rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-account-meta{font-size:0.48rem;color:var(--text-dim);margin-top:0.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* charts */
.fin-charts{display:grid;grid-template-columns:1.3fr 0.65fr 1fr;gap:0.85rem}
.fin-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}
.fin-box-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.fin-box-ttl{font-family:'Space Mono',monospace;font-size:0.53rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-mid)}
.fin-wrap{position:relative;height:200px}
/* milestone / savings plan */
.fin-milestone{background:var(--surface);border:1px solid var(--border);padding:1.25rem 1.4rem}
.fin-ms-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.9rem;gap:1rem}
.fin-ms-title{font-family:'Space Mono',monospace;font-size:0.53rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-mid)}
.fin-ms-pct{font-family:'Space Mono',monospace;font-size:1.4rem;font-weight:700;color:var(--accent);line-height:1}
.fin-ms-proj{font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text-dim);margin-top:0.18rem}
.fin-ms-track{position:relative;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-bottom:1.1rem}
.fin-ms-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent) 0%,#a78bfa 60%,#22d3ee 100%);transition:width 0.7s ease}
.fin-milestones{display:grid;grid-template-columns:repeat(6,1fr);gap:0.4rem}
.fin-ms-node{display:flex;flex-direction:column;align-items:center;gap:0.28rem;padding:0.4rem 0.2rem;border:1px solid var(--border);background:var(--surface2);position:relative}
.fin-ms-node.done{border-color:rgba(124,106,255,0.3);background:rgba(124,106,255,0.05)}
.fin-ms-node.active-next{border-color:rgba(124,106,255,0.5);animation:borderPulse 2.5s infinite}
@keyframes borderPulse{0%,100%{border-color:rgba(124,106,255,0.3)}50%{border-color:rgba(124,106,255,0.8)}}
.fin-ms-icon{font-size:0.85rem;line-height:1}
.fin-ms-node-lbl{font-family:'Space Mono',monospace;font-size:0.52rem;font-weight:700;color:var(--text-mid)}
.fin-ms-node.done .fin-ms-node-lbl{color:var(--accent)}
.fin-ms-node-date{font-family:'Space Mono',monospace;font-size:0.42rem;color:var(--text-dim);text-align:center}
.fin-ms-node.done .fin-ms-node-date{color:var(--green)}
/* table */
.fin-table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:0.57rem}
.fin-table th{text-align:left;color:var(--text-dim);letter-spacing:0.1em;font-weight:400;padding:0.3rem 0.6rem;border-bottom:1px solid var(--border)}
.fin-table td{padding:0.34rem 0.6rem;border-bottom:1px solid rgba(37,37,53,0.4);color:var(--text)}
.fin-table tr:last-child td{border-bottom:none}
.fin-table tr:hover td{background:rgba(255,255,255,0.015)}
.fin-cat-pill{display:inline-block;font-family:'Space Mono',monospace;font-size:0.44rem;font-weight:700;letter-spacing:0.07em;padding:2px 7px;border:1px solid;white-space:nowrap}
.fin-empty{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;color:var(--text-dim);opacity:0.42;text-align:center;padding:2.5rem 0}

/* ═══════════════════════════════
   SPORT / FITNESS PAGE
═══════════════════════════════ */
#pagesport{overflow-y:auto;padding:1.25rem 1.5rem 3rem;gap:1rem;flex-direction:column}
.fit-section{margin-top:0}
.fit-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem}
.fit-kpi{background:var(--surface);border:1px solid var(--border);padding:1rem 1.2rem}
.fit-kpi-lbl{font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.4rem}
.fit-kpi-val{font-family:var(--font-mono);font-size:1.55rem;font-weight:700;line-height:1}
.fit-kpi-val.green{color:var(--green)}
.fit-kpi-sub{font-size:0.65rem;color:var(--text-dim);margin-top:0.28rem}
.fit-section-lbl{font-family:var(--font-mono);font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.65rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.fit-box{background:var(--surface);border:1px solid var(--border);padding:1.1rem}
.fit-box-ttl{font-family:var(--font-mono);font-size:0.53rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-mid)}
.fit-empty{font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.06em;color:var(--text-dim);opacity:0.6;text-align:center;padding:1.5rem 0;line-height:1.8}
.fit-input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.66rem;padding:0.42rem 0.55rem;outline:none;transition:border-color 0.13s;border-radius:6px}
.fit-input:focus{border-color:var(--accent)}
.fit-form-lbl{font-family:var(--font-mono);font-size:0.46rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:0.3rem}
.fit-btn{font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.4rem 0.8rem;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.12s;white-space:nowrap;border-radius:6px}
.fit-btn:hover{color:var(--text);border-color:var(--text-mid)}
.fit-stats-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:0.57rem}
.fit-stats-table th{text-align:left;color:var(--text-dim);letter-spacing:0.1em;font-weight:400;padding:0.42rem 0.6rem;border-bottom:1px solid var(--border)}
.fit-stats-table td{padding:0.48rem 0.6rem;border-bottom:1px solid rgba(37,37,53,0.4);color:var(--text)}
.fit-stats-table tr:last-child td{border-bottom:none}

/* Programme du jour + retour côte à côte */
.sp-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:1rem;align-items:start}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}}
.sp-today{background:linear-gradient(135deg,var(--accent-dim) 0%,transparent 72%);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:1.3rem 1.5rem;border-radius:10px;position:relative;min-height:210px}
.sp-today-hdr{display:flex;align-items:center;gap:0.7rem;flex-wrap:wrap}
.sp-type-badge{font-family:var(--font-mono);font-size:0.56rem;font-weight:700;letter-spacing:0.12em;padding:0.28rem 0.75rem;border-radius:99px;text-transform:uppercase}
.sp-dur{font-family:var(--font-mono);font-size:0.6rem;color:var(--text-mid)}
.sp-today-title{font-family:var(--font-body);font-size:1.45rem;font-weight:700;margin:0.55rem 0 0.95rem;line-height:1.15}
.sp-content{font-size:0.86rem;line-height:1.6;color:var(--text)}
.sp-content h4{font-family:var(--font-mono);font-size:0.64rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin:0.95rem 0 0.45rem}
.sp-content ul{margin:0.3rem 0 0.65rem;padding:0;list-style:none}
.sp-content li{padding:0.2rem 0 0.2rem 1.35rem;position:relative;color:var(--text-mid)}
.sp-content li::before{content:'▸';position:absolute;left:0.25rem;color:var(--accent)}
.sp-content p{margin:0.45rem 0;color:var(--text-mid)}
.sp-content b{color:var(--text);font-weight:700}
.sp-ex-hint{font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.04em;color:var(--text-dim);margin-bottom:0.6rem;opacity:0.8}
/* per-exercise loggable row */
.sp-ex-row{display:flex;align-items:center;gap:0.6rem;padding:0.3rem 0;border-top:1px solid var(--border)}
.sp-ex-row:first-of-type{border-top:none}
.sp-ex-status{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text-dim);font-family:var(--font-mono);font-size:0.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.13s;line-height:1}
.sp-ex-status:hover{border-color:var(--text-mid)}
.sp-ex-status.st-done{background:rgba(74,222,128,0.18);border-color:var(--green);color:var(--green)}
.sp-ex-status.st-partial{background:rgba(251,191,36,0.18);border-color:var(--warn);color:var(--warn)}
.sp-ex-status.st-skipped{background:rgba(248,113,113,0.18);border-color:var(--danger);color:var(--danger)}
.sp-ex-txt{flex:1;min-width:0;font-size:0.84rem;color:var(--text-mid);line-height:1.35}
.sp-ex-w{flex-shrink:0;width:62px;background:var(--surface3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.62rem;padding:0.32rem 0.4rem;outline:none;border-radius:6px;text-align:center}
.sp-ex-w:focus{border-color:var(--accent)}

/* Retour / logger */
.sp-log{background:var(--surface);border:1px solid var(--border);padding:1.2rem 1.3rem;border-radius:10px}
.sp-log-done{margin-bottom:0.9rem;padding:0.55rem 0.75rem;border-radius:8px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);font-family:var(--font-mono);font-size:0.58rem;color:var(--green);line-height:1.5}
.sp-status-btns{display:flex;gap:0.5rem;margin-bottom:1rem}
.sp-status-btn{flex:1;padding:0.6rem 0.3rem;border:1px solid var(--border2);background:var(--surface2);color:var(--text-mid);cursor:pointer;border-radius:8px;font-family:var(--font-mono);font-size:0.6rem;font-weight:700;letter-spacing:0.04em;transition:all 0.14s;text-align:center}
.sp-status-btn:hover{border-color:var(--text-mid)}
.sp-status-btn.sel-done{background:rgba(74,222,128,0.16);border-color:var(--green);color:var(--green)}
.sp-status-btn.sel-partial{background:rgba(251,191,36,0.16);border-color:var(--warn);color:var(--warn)}
.sp-status-btn.sel-skipped{background:rgba(248,113,113,0.16);border-color:var(--danger);color:var(--danger)}
.sp-field{margin-bottom:0.85rem}
.sp-feeling{display:flex;gap:0.4rem}
.sp-feel-btn{flex:1;padding:0.45rem 0;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;border-radius:6px;font-size:1rem;transition:all 0.13s;filter:grayscale(0.7);opacity:0.55}
.sp-feel-btn:hover{filter:none;opacity:1}
.sp-feel-btn.sel{filter:none;opacity:1;border-color:var(--accent);background:var(--accent-dim)}
.sp-row2{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}

/* Activité bonus du jour */
.sp-bonus{display:flex;align-items:center;gap:0.9rem;background:linear-gradient(135deg,rgba(252,211,77,0.1) 0%,transparent 75%);border:1px solid rgba(252,211,77,0.3);border-left:3px solid var(--gld);padding:0.7rem 1rem;border-radius:10px}
.sp-bonus.done{filter:none;border-color:rgba(74,222,128,0.35);border-left-color:var(--green);background:linear-gradient(135deg,rgba(74,222,128,0.1) 0%,transparent 75%)}
.sp-bonus.empty{border-style:dashed;border-color:var(--border2);border-left-color:var(--border2);background:none}
.sp-bonus-ico{font-size:1.3rem;line-height:1;flex-shrink:0}
.sp-bonus-body{flex:1;min-width:0}
.sp-bonus-lbl{font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gld);margin-bottom:0.15rem}
.sp-bonus.done .sp-bonus-lbl{color:var(--green)}
.sp-bonus-txt{font-family:var(--font-body);font-size:0.92rem;font-weight:600;color:var(--text)}
.sp-bonus.empty .sp-bonus-txt{font-weight:400;font-size:0.72rem;color:var(--text-dim)}
.sp-bonus-btn{flex-shrink:0;font-family:var(--font-mono);font-size:0.56rem;font-weight:700;letter-spacing:0.06em;padding:0.42rem 0.9rem;border-radius:8px;border:1px solid var(--gld);background:transparent;color:var(--gld);cursor:pointer;transition:all 0.13s}
.sp-bonus-btn:hover{background:rgba(252,211,77,0.14)}
.sp-bonus-btn.done{border-color:var(--green);color:var(--green);background:rgba(74,222,128,0.14)}

/* Demain */
.sp-tom{background:var(--surface);border:1px dashed var(--border2);padding:1rem 1.2rem;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.sp-tom-info{min-width:0}
.sp-tom-title{font-family:var(--font-body);font-size:0.92rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap}
.sp-tom-meta{font-family:var(--font-mono);font-size:0.56rem;color:var(--text-mid);margin-top:0.25rem}

/* Historique */
.sp-hist-status{font-family:var(--font-mono);font-size:0.5rem;font-weight:700;letter-spacing:0.05em;padding:2px 8px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.sp-hist-status.done{background:rgba(74,222,128,0.14);color:var(--green)}
.sp-hist-status.partial{background:rgba(251,191,36,0.14);color:var(--warn)}
.sp-hist-status.skipped{background:rgba(248,113,113,0.14);color:var(--danger)}
.sp-hist-status.none{background:rgba(148,163,184,0.1);color:var(--text-dim)}
.sp-wrap{position:relative;height:160px}
.modal textarea.fit-input{width:100%;resize:vertical;line-height:1.5}

/* ═══════════════════════════════
   TYPOGRAPHY BOOST (lisibilité globale)
═══════════════════════════════ */
.fin-kpi-lbl,.crp-kpi-lbl,.fit-kpi-lbl{font-size:0.62rem !important;letter-spacing:0.12em !important;color:var(--text-mid) !important}
.fin-kpi-val,.crp-kpi-val,.fit-kpi-val{font-size:1.85rem !important}
.fin-kpi-sub,.crp-kpi-sub,.fit-kpi-sub{font-size:0.74rem !important;color:var(--text-mid) !important}
.fin-section-lbl,.fit-section-lbl{font-size:0.66rem !important;letter-spacing:0.16em !important;color:var(--text-mid) !important}
.col-title{font-size:0.66rem !important;color:var(--text-mid) !important}
.card-title{font-size:0.84rem !important}
.fin-table th,.crp-table th,.fit-stats-table th{font-size:0.62rem !important;color:var(--text-mid) !important}
.fin-table td,.crp-table td,.fit-stats-table td{font-size:0.66rem !important}
.fin-account-name{font-size:0.54rem !important;color:var(--text-mid) !important}
.fin-account-val{font-size:1.05rem !important}
.fin-account-delta{font-size:0.6rem !important}
.fin-account-meta{font-size:0.55rem !important}
.fin-box-ttl,.fit-box-ttl{font-size:0.6rem !important;color:var(--text-mid) !important}

/* ═══════════════════════════════
   THEME PICKER (header dropdown)
═══════════════════════════════ */
.theme-picker-wrap{position:relative;flex-shrink:0}
.btn-theme{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;font-weight:700;padding:0.32rem 0.7rem;cursor:pointer;transition:all 0.13s;text-transform:uppercase;display:flex;align-items:center;gap:0.35rem}
.btn-theme:hover{color:var(--text);border-color:var(--text-mid)}
.theme-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border2);min-width:200px;z-index:300;display:none;box-shadow:0 8px 30px rgba(0,0,0,0.55);padding:0.4rem}
.theme-menu.open{display:block}
.theme-opt{display:flex;align-items:center;gap:0.65rem;padding:0.5rem 0.7rem;cursor:pointer;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.06em;color:var(--text-dim);transition:background 0.1s,color 0.1s;border:none;background:transparent;width:100%;text-align:left;text-transform:uppercase}
.theme-opt:hover{background:var(--surface2);color:var(--text)}
.theme-opt.active{color:var(--accent);background:var(--accent-dim)}
.theme-swatch{display:flex;width:34px;height:18px;border:1px solid var(--border2);flex-shrink:0}
.theme-swatch span{flex:1;height:100%}
.theme-opt-name{flex:1;font-weight:700}
.theme-opt-mark{font-size:0.7rem;color:var(--accent);width:0.8rem;text-align:center}

/* ═══════════════════════════════
   THEME — ① BRUTALIST
═══════════════════════════════ */
html[data-theme="brutalist"]{
  --bg:#000;--surface:#0a0a0a;--surface2:#141414;--surface3:#1f1f1f;
  --border:#2e2e2e;--border2:#4a4a4a;
  --accent:#ffffff;--accent-dim:rgba(255,255,255,0.08);
  --text:#ffffff;--text-dim:#888888;--text-mid:#bbbbbb;
  --green:#3eff85;--warn:#ffd23d;--danger:#ff4d6d;
  --font-body:'Space Mono',monospace;
  --font-mono:'Space Mono',monospace;
}
html[data-theme="brutalist"] body{background:var(--bg)}
html[data-theme="brutalist"] .card{border-radius:0}
html[data-theme="brutalist"] header{background:#000}
html[data-theme="brutalist"] .nav-tab.active{color:#fff;border-bottom-color:#fff}

/* ═══════════════════════════════
   THEME — ② TOKYO NIGHT
═══════════════════════════════ */
html[data-theme="tokyo"]{
  --bg:#1a1b26;--surface:#24283b;--surface2:#2a2e42;--surface3:#32364a;
  --border:#414868;--border2:#565f89;
  --accent:#7aa2f7;--accent-dim:rgba(122,162,247,0.14);
  --text:#c0caf5;--text-dim:#7882a9;--text-mid:#a9b1d6;
  --green:#9ece6a;--warn:#e0af68;--danger:#f7768e;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html[data-theme="tokyo"] body{background:var(--bg)}

/* ═══════════════════════════════
   THEME — ③ CARBON (IBM)
═══════════════════════════════ */
html[data-theme="carbon"]{
  --bg:#161616;--surface:#262626;--surface2:#2d2d2d;--surface3:#393939;
  --border:#393939;--border2:#525252;
  --accent:#4589ff;--accent-dim:rgba(69,137,255,0.12);
  --text:#f4f4f4;--text-dim:#a8a8a8;--text-mid:#c6c6c6;
  --green:#42be65;--warn:#f1c21b;--danger:#fa4d56;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html[data-theme="carbon"] body{background:var(--bg)}
html[data-theme="carbon"] .fin-kpi,html[data-theme="carbon"] .crp-kpi,html[data-theme="carbon"] .fit-kpi{border-left:3px solid var(--accent)}

/* ═══════════════════════════════
   THEME — ④ CYBER NEON (boosted current)
═══════════════════════════════ */
html[data-theme="neon"]{
  --bg:#06070d;--surface:#11111c;--surface2:#1a1a2a;--surface3:#222238;
  --border:#2d2d44;--border2:#4a4a6a;
  --accent:#a78bfa;--accent-dim:rgba(167,139,250,0.16);
  --text:#f0f0ff;--text-dim:#8888ad;--text-mid:#b4b4d8;
  --green:#4ade80;--warn:#fbbf24;--danger:#f87171;
  --font-body:'Syne',sans-serif;
  --font-mono:'Space Mono',monospace;
}
html[data-theme="neon"] body{background:var(--bg)}
html[data-theme="neon"] .fin-kpi-val,html[data-theme="neon"] .crp-kpi-val,html[data-theme="neon"] .fit-kpi-val{text-shadow:0 0 14px rgba(167,139,250,0.35)}
html[data-theme="neon"] .nav-tab.active{text-shadow:0 0 10px rgba(167,139,250,0.5)}

/* ═══════════════════════════════
   THEME — ⑤ SOLARIZED NIGHT
═══════════════════════════════ */
html[data-theme="solarized"]{
  --bg:#1c1817;--surface:#26211e;--surface2:#2d2723;--surface3:#3a342f;
  --border:#3a342f;--border2:#574f47;
  --accent:#d6824d;--accent-dim:rgba(214,130,77,0.14);
  --text:#ebe0d0;--text-dim:#9c8c78;--text-mid:#b3a48a;
  --green:#8fbc4f;--warn:#d6c44d;--danger:#e35d50;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html[data-theme="solarized"] body{background:var(--bg)}

/* ═══════════════════════════════
   THEME — ⑥ NORD FROST
═══════════════════════════════ */
html[data-theme="nord"]{
  --bg:#2e3440;--surface:#3b4252;--surface2:#434c5e;--surface3:#4c566a;
  --border:#434c5e;--border2:#4c566a;
  --accent:#88c0d0;--accent-dim:rgba(136,192,208,0.16);
  --text:#eceff4;--text-dim:#a5acba;--text-mid:#d8dee9;
  --green:#a3be8c;--warn:#ebcb8b;--danger:#bf616a;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html[data-theme="nord"] body{background:var(--bg)}

/* ═══════════════════════════════
   THEME — ⑦ FOREST (vert sombre · sage · nature)
═══════════════════════════════ */
html[data-theme="forest"]{
  --bg:#0d1813;--surface:#142318;--surface2:#1a2d20;--surface3:#22392a;
  --border:#22392a;--border2:#345240;
  --accent:#7ab880;--accent-dim:rgba(122,184,128,0.14);
  --text:#dfece1;--text-dim:#8aa893;--text-mid:#b4c8b8;
  --green:#9bc97f;--warn:#d4b86a;--danger:#d9776b;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html[data-theme="forest"] body{background:var(--bg)}

/* ═══════════════════════════════
   THEME — ⑧ MATRIX (noir profond · vert néon terminal)
═══════════════════════════════ */
html[data-theme="matrix"]{
  --bg:#000;--surface:#040806;--surface2:#0a1410;--surface3:#0f1f17;
  --border:#1a3326;--border2:#2a5240;
  --accent:#00ff88;--accent-dim:rgba(0,255,136,0.1);
  --text:#c8ffd9;--text-dim:#4a7d5e;--text-mid:#7dc99a;
  --green:#00ff88;--warn:#d4ff4a;--danger:#ff5566;
  --font-body:'Space Mono',monospace;
  --font-mono:'Space Mono',monospace;
}
html[data-theme="matrix"] body{background:var(--bg)}
html[data-theme="matrix"] .fin-kpi-val,
html[data-theme="matrix"] .crp-kpi-val,
html[data-theme="matrix"] .fit-kpi-val{text-shadow:0 0 12px rgba(0,255,136,0.5)}
html[data-theme="matrix"] .nav-tab.active{text-shadow:0 0 10px rgba(0,255,136,0.6)}
html[data-theme="matrix"] .card{box-shadow:inset 0 0 0 1px rgba(0,255,136,0.05)}

/* ═══════════════════════════════
   FONT SWAP — applique --font-body/--font-mono partout
   (selectors larges + !important pour battre les déclarations spécifiques)
═══════════════════════════════ */
body,body *{font-family:var(--font-body)}
/* Eléments monospace : tout ce qui ressemble à un label/KPI/badge/tableau */
.logo,.nav-tab,.col-title,.col-count,.proj-btn,.sync-status,.hstat,
.due-badge,.btn-done,.btn-edit,.card-notes,.board-filter,
.fin-kpi-lbl,.fin-kpi-val,.fin-kpi-sub,.fin-section-lbl,
.fin-account-name,.fin-account-val,.fin-account-delta,.fin-account-meta,
.fin-box-ttl,.fin-table,.fin-table th,.fin-table td,.fin-cat-pill,
.fin-ms-title,.fin-ms-pct,.fin-ms-proj,.fin-ms-node-lbl,.fin-ms-node-date,
.crp-kpi-lbl,.crp-kpi-val,.crp-kpi-sub,.crp-section-lbl,
.crp-box-ttl,.crp-table,.crp-table th,.crp-table td,.crp-btn,.crp-hodl-note,
.crp-symbol-pill,.crp-empty,
.fit-kpi-lbl,.fit-kpi-val,.fit-kpi-sub,.fit-section-lbl,
.fit-box-ttl,.fit-stats-table,.fit-stats-table th,.fit-stats-table td,
.fit-day-label,.fit-day-date,.fit-day-tier,.fit-day-check,.fit-day-sess,
.fit-tier-badge,.fit-today-mod,.fit-ex-meta span,.fit-ex-prescription,
.fit-ex-progress,.fit-ex-last,.fit-ex-sets,.fit-sess-meta,
.fit-log-set-done,.fit-input,.fit-btn,.fit-form-lbl,
.fit-prog-tier-hdr,.fit-prog-card-id,.fit-prog-num,.fit-prog-pres,
.theme-opt,.btn-theme,
.fin-alert,.fit-alert{font-family:var(--font-mono) !important}
/* Titres "humain" en font-body */
.card-title,.fin-today-title,.fit-today-title,.fit-ex-name,.fit-log-exname,
.fit-prog-card-hdr,.fit-prog-exname,.modal-hdr,.auth-logo,.auth-desc,
.btn-nav{font-family:var(--font-body) !important}

/* ═══════════════════════════════
   OBJECTIFS — arbre de progression (page objectifs)
═══════════════════════════════ */
#pageobjectifs{overflow-y:auto;flex-direction:column}
.gl-wrap{padding:1.4rem 1.6rem 3rem;display:flex;flex-direction:column;gap:1.1rem}
.gl-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem}
.gl-kpi{background:var(--surface);border:1px solid var(--border);padding:1rem 1.2rem;border-radius:8px}
.gl-kpi-lbl{font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-mid);margin-bottom:0.4rem}
.gl-kpi-val{font-family:var(--font-mono);font-size:1.7rem;font-weight:700;line-height:1}
.gl-toolbar{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap}
.gl-filter-lbl{font-family:var(--font-mono);font-size:0.52rem;letter-spacing:0.18em;color:var(--text-mid);text-transform:uppercase;margin-right:0.4rem}
.gl-pill{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.05em;font-weight:700;padding:0.32rem 0.8rem;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;border-radius:99px;transition:all 0.13s}
.gl-pill:hover{color:var(--text);border-color:var(--text-mid)}
.gl-pill.active{color:#09090e !important}
.gl-spacer{flex:1}
.gl-add{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.08em;font-weight:700;padding:0.36rem 0.95rem;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);cursor:pointer;border-radius:99px;text-transform:uppercase}
.gl-add:hover{background:var(--accent);color:var(--bg)}
.gl-empty{text-align:center;padding:3rem 0;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);opacity:0.55}
/* tree — horizontal INVERSÉ (gros objectifs/racines à DROITE), cartes compactes */
.gl-forest{display:flex;flex-direction:column;gap:1.4rem;overflow-x:auto;padding-bottom:0.6rem;align-items:flex-start}
.gl-node{display:flex;align-items:center;flex-direction:row-reverse}
.gl-link{width:18px;height:2px;background:var(--border2);flex-shrink:0}
.gl-subtree{display:flex;flex-direction:column;gap:0.7rem;position:relative;padding-right:20px}
.gl-subtree::before{content:'';position:absolute;right:0;top:24px;bottom:24px;width:2px;background:var(--border2)}
.gl-subtree:has(>.gl-node:only-child)::before{display:none}
.gl-subtree>.gl-node{position:relative}
.gl-subtree>.gl-node::before{content:'';position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:20px;height:2px;background:var(--border2)}
/* compact card */
.gl-card{width:238px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-top:7px solid var(--gcol,var(--accent));border-radius:10px;padding:0.65rem 0.8rem;cursor:pointer;transition:box-shadow 0.15s,transform 0.15s}
.gl-card:hover{box-shadow:0 6px 18px rgba(0,0,0,0.32);transform:translateY(-1px)}
.gl-card.done{filter:grayscale(0.9);opacity:0.5}
.gl-card.done:hover{opacity:0.78}
.gl-c-head{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem}
.gl-c-icon{font-size:1.05rem;line-height:1}
.gl-c-hbadge{font-family:var(--font-mono);font-size:0.58rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.gl-c-date{font-family:var(--font-mono);font-size:0.5rem;color:var(--text-dim)}
.gl-c-acts{margin-left:auto;display:flex;align-items:center;gap:0.15rem}
.gl-c-done{color:var(--green);font-size:0.8rem;font-weight:700}
.gl-edit,.gl-child{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.72rem;padding:0 0.2rem;opacity:0;transition:opacity 0.15s}
.gl-child{font-size:0.9rem;line-height:1}
.gl-card:hover .gl-edit,.gl-card:hover .gl-child{opacity:1}
.gl-edit:hover,.gl-child:hover{color:var(--accent)}
.gl-c-title{font-family:var(--font-body);font-size:0.85rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gl-c-cat{font-family:var(--font-mono);font-size:0.5rem;font-weight:700;margin-top:0.22rem}
.gl-prog{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-top:0.5rem}
.gl-prog-bar{height:100%;border-radius:4px;transition:width 0.5s}
.gl-c-foot{display:flex;align-items:center;gap:0.45rem;margin-top:0.42rem}
.gl-prog-pct{font-family:var(--font-mono);font-size:0.58rem;font-weight:700;color:var(--text-mid)}
.gl-cp-dots{display:flex;align-items:center;gap:3px;margin-left:auto}
.gl-cp-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--border2);cursor:pointer;transition:all 0.12s}
.gl-cp-dot.done{background:var(--green);border-color:var(--green)}
.gl-cp-dot:hover{border-color:var(--text-mid)}
.gl-cp-count{font-family:var(--font-mono);font-size:0.5rem;color:var(--text-dim);margin-left:2px}
.gl-reward-mini{font-family:var(--font-mono);font-size:0.52rem;color:var(--gld);margin-top:0.42rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-reward-mini.unlocked{text-shadow:0 0 8px rgba(252,211,77,0.45)}
/* emoji picker (modal) */
.gl-emoji-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:118px;overflow-y:auto}
.gl-emoji{font-size:1.1rem;width:34px;height:34px;border:1px solid var(--border2);background:var(--surface2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all 0.12s}
.gl-emoji:hover{border-color:var(--text-mid);transform:scale(1.08)}
.gl-emoji.sel{border-color:var(--accent);background:var(--accent-dim)}

/* ═══════════════════════════════
   FONDS D'ÉCRAN (galerie) — couche transparente sous le contenu
═══════════════════════════════ */
.pg-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0.5;pointer-events:none;transition:opacity 0.4s}
.gl-wrap,.hg-wrap{position:relative;z-index:1}
#pageboard>.board-filters,#pageboard>.board-scroll{position:relative;z-index:1}
/* Conteneurs translucides pour laisser voir le fond (Board & Habitudes) */
#pageboard .column{background:var(--surface);background:color-mix(in srgb,var(--surface) 55%,transparent)}
#pageboard .board-filters{background:color-mix(in srgb,var(--bg) 55%,transparent)}
#pagehabits .hg-table{background:var(--surface);background:color-mix(in srgb,var(--surface) 68%,transparent)}
#pagehabits .hm-box{background:var(--surface);background:color-mix(in srgb,var(--surface) 68%,transparent)}
.gl-wall-wrap{position:relative}
.gl-wall-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:0.5rem;display:none;grid-template-columns:repeat(2,1fr);gap:6px;width:300px;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,0.55)}
.gl-wall-menu.open{display:grid}
.gl-wall-opt{background:none;border:1px solid transparent;border-radius:8px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.gl-wall-opt:hover{border-color:var(--border2)}
.gl-wall-opt.active{border-color:var(--accent)}
.gl-wall-thumb{width:100%;height:56px;border-radius:6px;background-size:cover;background-position:center;background-color:var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:1rem}
.gl-wall-opt span{font-family:var(--font-mono);font-size:0.5rem;color:var(--text-mid)}

/* ═══════════════════════════════
   MOBILE — portrait (≤ 640px, ex. Pixel 8 ≈ 412px)
   Le viewport pilote le mode : large = PC, étroit = mobile.
═══════════════════════════════ */
@media (max-width:640px){
  /* Header navigable : logo + actions sur la 1re ligne, onglets scrollables en dessous */
  header{height:auto;min-height:50px;flex-wrap:wrap;padding:0.4rem 0.6rem;gap:0.4rem}
  .logo{font-size:0.58rem}
  .nav-sep{display:none}
  .proj-shortcuts,.hstat,.sync-status{display:none}
  .nav-tabs{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .nav-tabs::-webkit-scrollbar{height:0}
  .nav-tab{padding:0.45rem 0.6rem;font-size:0.6rem;flex-shrink:0}
  .header-right{margin-left:auto;gap:0.4rem}
  .btn-nav{font-size:0.68rem;padding:0.3rem 0.6rem}

  /* Page SPORT */
  #pagesport{padding:0.8rem 0.7rem 4rem;gap:0.85rem}
  .fit-banner{grid-template-columns:1fr 1fr;gap:0.55rem}
  .fit-kpi{padding:0.7rem 0.85rem}
  .fit-kpi-val{font-size:1.4rem !important}
  .fit-kpi-sub{font-size:0.62rem !important}
  .sp-grid{grid-template-columns:1fr;gap:0.85rem}
  .sp-today{padding:1rem 1.05rem;min-height:0}
  .sp-today-title{font-size:1.2rem}
  .sp-content{font-size:0.9rem}
  .sp-ex-row{gap:0.45rem}
  .sp-ex-txt{font-size:0.88rem}
  .sp-ex-status{width:30px;height:30px}
  .sp-ex-w{width:54px}
  .sp-log{padding:1rem 1.05rem}
  .sp-status-btn{font-size:0.56rem;padding:0.6rem 0.2rem}
  .sp-feel-btn{font-size:1.15rem;padding:0.55rem 0}
  /* Demain : carte empilée, boutons pleine largeur */
  .sp-tom{flex-direction:column;align-items:stretch;gap:0.7rem}
  .sp-tom>div:last-child{display:flex;gap:0.4rem}
  .sp-tom .fit-btn{flex:1}
  /* Historique : scroll horizontal plutôt que d'écraser les colonnes */
  #sportHistory .fit-box{overflow-x:auto}
  #sportHistory .fit-stats-table{min-width:440px}
  .sp-wrap{height:175px}
  /* Padding réduit des pages scrollables */
  #pageobjectifs,#pagecrypto,#pagefinances{padding:0.8rem 0.7rem 4rem;gap:0.8rem}

  /* DASHBOARD */
  .dash-grid{grid-template-columns:1fr 1fr;gap:0.55rem}
  .kpi-value{font-size:1.5rem}
  .proj-row{grid-template-columns:1fr;gap:0.6rem}
  .charts-row{grid-template-columns:1fr;gap:0.8rem}

  /* CRYPTOBOT */
  .crp-banner{grid-template-columns:1fr 1fr;gap:0.55rem;padding:0.7rem}
  .crp-banner::before{display:none}
  .crp-cards{grid-template-columns:1fr 1fr;gap:0.6rem}
  .crp-charts-b{grid-template-columns:1fr}
  .crp-filters{padding:0.55rem 0.6rem}
  #crpTradeTable{overflow-x:auto}
  .crp-table{min-width:420px}

  /* FINANCES */
  .fin-banner{grid-template-columns:1fr 1fr;gap:0.55rem}
  .fin-charts{grid-template-columns:1fr;gap:0.8rem}
  .fin-milestones{grid-template-columns:repeat(3,1fr)}
  #finTable .fin-box{overflow-x:auto}
  .fin-table{min-width:460px}

  /* HABITUDES — grille hebdo : scroll horizontal + en-tête souple */
  .hg-wrap{padding:0.8rem 0.7rem 4rem}
  .hg-header{gap:0.8rem}
  .hg-kpis{gap:1.1rem;flex-wrap:wrap}
  .hg-toolbar{gap:0.4rem}
  #habGrid{overflow-x:auto}
  .hg-table{min-width:500px}
  .heatmaps-grid{grid-template-columns:1fr}

  /* BOARD — une colonne plein écran, swipe horizontal */
  .board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:82vw;min-width:0;padding:0.7rem 0.6rem 1.5rem;gap:0.6rem;scroll-snap-type:x mandatory}
  .column{scroll-snap-align:start}
  .board-filters{flex-wrap:wrap;padding:0.5rem 0.6rem}

  /* OBJECTIFS */
  .gl-wrap{padding:0.8rem 0.7rem 4rem}
  .gl-banner{grid-template-columns:1fr 1fr;gap:0.55rem}
  .gl-kpi-val{font-size:1.4rem}
  .gl-card{width:210px}
  .gl-link{width:12px}
  .gl-subtree{padding-left:14px}
  .gl-subtree>.gl-node::before{left:-14px;width:14px}

  /* Modales lisibles */
  .modal{width:95vw !important;padding:1.1rem}
}

</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">◆ KANBAN OPS</div>
    <p class="auth-desc">Connecte ton compte Google pour accéder à tes tâches.</p>
    <button class="btn-nav" onclick="startAuth()" style="width:100%;margin-top:0.5rem;padding:0.7rem;font-size:0.85rem">SE CONNECTER AVEC GOOGLE</button>
  </div>
</div>

<!-- LOADING -->
<div id="loadOverlay"><div class="spinner"></div><div class="load-text">CHARGEMENT...</div></div>

<!-- HEADER -->
<header>
  <div class="logo">◆ KANBAN</div>
  <div class="nav-sep"></div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-page="board" onclick="switchPage('board')">BOARD</button>
    <button class="nav-tab" data-page="crypto" onclick="switchPage('crypto')">CRYPTOBOT</button>
    <button class="nav-tab" data-page="habits" onclick="switchPage('habits')">HABITUDES</button>
    <button class="nav-tab" data-page="sport" onclick="switchPage('sport')">SPORT</button>
    <button class="nav-tab" data-page="finances" onclick="switchPage('finances')">FINANCES</button>
    <button class="nav-tab" data-page="objectifs" onclick="switchPage('objectifs')">OBJECTIFS</button>
  </nav>
  <div class="nav-sep"></div>
  <div class="proj-shortcuts">
    <button class="proj-btn dcb" onclick="quickTask('DCB')">+ DCB</button>
    <button class="proj-btn gld" onclick="quickTask('GLD')">+ GLD</button>
    <button class="proj-btn air" onclick="quickTask('Airside')">+ AIRSIDE</button>
    <button class="proj-btn perso" onclick="quickTask('Perso')">+ PERSO</button>
  </div>
  <div class="header-right">
    <div class="hstat">ACTIVES <b id="hTotal">0</b></div>
    <div class="hstat">AUJ. <b id="hToday">0</b></div>
    <div class="hstat" style="color:var(--green)">✓ <b id="hDoneToday">0</b></div>
    <div class="hstat" style="color:var(--danger)">URGENTES <b id="hUrgent">0</b></div>
    <div class="sync-status"><div class="sync-dot ok" id="syncDot"></div><span id="syncLabel">PRÊT</span></div>
    <button class="btn-nav" onclick="openModal()">+ TÂCHE</button>
    <div class="theme-picker-wrap">
      <button class="btn-theme" onclick="toggleThemePicker(event)" title="Changer le thème">◐ THÈME</button>
      <div class="theme-menu" id="themeMenu">
        <button class="theme-opt" data-theme-id="default" onclick="setTheme('default')">
          <span class="theme-swatch"><span style="background:#09090e"></span><span style="background:#7c6aff"></span><span style="background:#4ade80"></span></span>
          <span class="theme-opt-name">Cyber Default</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="brutalist" onclick="setTheme('brutalist')">
          <span class="theme-swatch"><span style="background:#000"></span><span style="background:#fff"></span><span style="background:#3eff85"></span></span>
          <span class="theme-opt-name">① Brutalist</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="tokyo" onclick="setTheme('tokyo')">
          <span class="theme-swatch"><span style="background:#1a1b26"></span><span style="background:#7aa2f7"></span><span style="background:#bb9af7"></span></span>
          <span class="theme-opt-name">② Tokyo Night</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="carbon" onclick="setTheme('carbon')">
          <span class="theme-swatch"><span style="background:#161616"></span><span style="background:#4589ff"></span><span style="background:#42be65"></span></span>
          <span class="theme-opt-name">③ Carbon IBM</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="neon" onclick="setTheme('neon')">
          <span class="theme-swatch"><span style="background:#06070d"></span><span style="background:#a78bfa"></span><span style="background:#22d3ee"></span></span>
          <span class="theme-opt-name">④ Cyber Neon</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="solarized" onclick="setTheme('solarized')">
          <span class="theme-swatch"><span style="background:#1c1817"></span><span style="background:#d6824d"></span><span style="background:#8fbc4f"></span></span>
          <span class="theme-opt-name">⑤ Solarized Night</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="nord" onclick="setTheme('nord')">
          <span class="theme-swatch"><span style="background:#2e3440"></span><span style="background:#88c0d0"></span><span style="background:#a3be8c"></span></span>
          <span class="theme-opt-name">⑥ Nord Frost</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="forest" onclick="setTheme('forest')">
          <span class="theme-swatch"><span style="background:#0d1813"></span><span style="background:#7ab880"></span><span style="background:#9bc97f"></span></span>
          <span class="theme-opt-name">⑦ Forest</span><span class="theme-opt-mark"></span>
        </button>
        <button class="theme-opt" data-theme-id="matrix" onclick="setTheme('matrix')">
          <span class="theme-swatch"><span style="background:#000"></span><span style="background:#00ff88"></span><span style="background:#7dc99a"></span></span>
          <span class="theme-opt-name">⑧ Matrix</span><span class="theme-opt-mark"></span>
        </button>
      </div>
    </div>
    <span class="app-version">v1.0.8</span>
    <button class="btn-nav out" id="btnLogout" onclick="logout()" style="display:none">DÉCO.</button>
  </div>
</header>

<!-- BOARD PAGE -->
<div class="page active" id="pageboard">
  <div class="pg-bg" id="boardBg"></div>
  <div class="board-filters" id="boardFilters">
    <button class="board-filter f-all active" onclick="setBoardFilter('all')">TOUS</button>
    <button class="board-filter f-dcb" onclick="setBoardFilter('DCB')">DCB</button>
    <button class="board-filter f-gld" onclick="setBoardFilter('GLD')">GLD</button>
    <button class="board-filter f-air" onclick="setBoardFilter('Airside')">AIRSIDE</button>
    <button class="board-filter f-perso" onclick="setBoardFilter('Perso')">PERSO</button>
  </div>
  <div class="board-scroll">
    <div class="board" id="board"></div>
  </div>
</div>

<!-- OBJECTIFS PAGE — arbre de progression -->
<div class="page" id="pageobjectifs">
  <div class="pg-bg" id="glBg"></div>
  <div class="gl-wrap">
    <div id="glBanner"></div>
    <div id="glToolbar"></div>
    <div id="glTree"></div>
  </div>
</div>

<!-- GOAL MODAL -->
<div class="modal-bg" id="goalModal">
  <div class="modal" style="width:560px">
    <div class="modal-hdr" id="goalModalTitle">OBJECTIF</div>
    <button class="modal-close" onclick="closeGoalModal()">✕</button>
    <input type="hidden" id="gfId">
    <div class="field"><label>Titre</label><input type="text" id="gfTitle" placeholder="Mon objectif..." autocomplete="off"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem">
      <div class="field"><label>Catégorie</label>
        <select id="gfCategory">
          <option value="Finance">Finance</option>
          <option value="Esprit">Esprit</option>
          <option value="Santé">Santé</option>
          <option value="Productivité">Productivité</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="field"><label>Échéance <span style="color:var(--text-dim);font-weight:400">→ horizon auto</span></label><input type="date" id="gfTarget"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem">
      <div class="field"><label>Rattaché à (parent)</label><select id="gfParent"><option value="">— Aucun (racine) —</option></select></div>
      <div class="field"><label>Statut</label><select id="gfStatus"><option value="active">En cours</option><option value="done">Atteint</option><option value="paused">En pause</option></select></div>
    </div>
    <div class="field"><label>Description</label><input type="text" id="gfDesc" placeholder="Détail / pourquoi..." autocomplete="off"></div>
    <div class="field"><label>Progression % <span style="color:var(--text-dim);font-weight:400">(ignoré si checkpoints)</span></label><input type="number" id="gfProgress" min="0" max="100" placeholder="0"></div>
    <div class="field"><label>Icône</label><input type="hidden" id="gfIcon"><div class="gl-emoji-grid" id="gfEmojiGrid"></div></div>

function setTheme(name, silent) {
  const root = document.documentElement;

  localStorage.setItem(LS_THEME, name);
  // Update active marker
  document.querySelectorAll('.theme-opt').forEach(b => {
    const isActive = b.dataset.themeId === name;
    b.classList.toggle('active', isActive);

const sheetsBase = () => `https://sheets.googleapis.com/v4/spreadsheets/${cfg.spreadsheetId}`;

async function loadFromSheets() {
  try {
    const r = await fetch(`${sheetsBase()}/values/${cfg.sheetName}!A:H`, { headers:{Authorization:`Bearer ${accessToken}`} });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const rows = data.values || [];
    allTasks = rows.length <= 1 ? [] : rows.slice(1).map(p => ({
      id: parseInt(p[0])||Date.now(), title:p[1]||'', column:p[2]||'BackLog',
      importance:parseInt(p[3])||3, due_date:p[4]||'', created_at:p[5]||td(),
      completed_at:p[6]||'', notes:p[7]||''

    tasks = allTasks.filter(t => !t.completed_at);

    setSyncStatus('ok','SYNCED');

}

async function saveToSheets() {
  if (!accessToken) return;
  setSyncStatus('syncing','SAVING...');

    const range = `${cfg.sheetName}!A:H`;
    await fetch(`${sheetsBase()}/values/${encodeURIComponent(range)}:clear`, { method:'POST', headers:{Authorization:`Bearer ${accessToken}`} });
